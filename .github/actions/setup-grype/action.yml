name: Setup Grype
description: Install the repository Grype version with bounded retries

inputs:
  version-file:
    description: Path to the Grype version source of truth
    required: false
    default: .grype-version
  checksum-file:
    description: Path to the trusted Grype archive checksums
    required: false
    default: .grype-checksums

runs:
  using: composite
  steps:
    - name: Cache Grype archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/grype-downloads
        key: grype-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.version-file, inputs.checksum-file) }}

    - name: Install Grype
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.version-file }}
        CHECKSUM_FILE: ${{ inputs.checksum-file }}
      run: |
        set -euo pipefail
        : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
        : "${GITHUB_PATH:?GITHUB_PATH is required}"

        if [[ "${RUNNER_OS}" != "Linux" || "${RUNNER_ARCH}" != "X64" ]]; then
          echo "Unsupported Grype runner platform: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
          exit 1
        fi

        version="$(tr -d '[:space:]' < "${VERSION_FILE}")"
        if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid Grype version in ${VERSION_FILE}: ${version}" >&2
          exit 1
        fi

        archive_name="grype_${version}_linux_amd64.tar.gz"
        expected_sha256="$(awk -v archive="${archive_name}" '$2 == archive { print $1 }' "${CHECKSUM_FILE}")"
        if [[ ! "${expected_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Missing trusted checksum for ${archive_name} in ${CHECKSUM_FILE}" >&2
          exit 1
        fi

        archive_dir="${RUNNER_TEMP}/grype-downloads"
        archive="${archive_dir}/${archive_name}"
        install_dir="${RUNNER_TEMP}/grype-${version}"
        archive_url="https://github.com/anchore/grype/releases/download/v${version}/${archive_name}"
        mkdir -p "${archive_dir}" "${install_dir}"

        if [[ ! -f "${archive}" ]] || \
          ! printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum --check --status; then
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 240 \
            --connect-timeout 15 \
            --max-time 120 \
            --output "${archive}" \
            "${archive_url}"
        fi

        printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum --check
        tar -xzf "${archive}" -C "${install_dir}" grype

        actual_version="$("${install_dir}/grype" version | awk '/^Version:/ { print $2 }')"
        if [[ "${actual_version}" != "${version}" ]]; then
          echo "Installed Grype version ${actual_version}, expected ${version}" >&2
          exit 1
        fi
        echo "${install_dir}" >> "${GITHUB_PATH}"
