name: Setup Go
description: Configure the repository Go runtime and module cache

inputs:
  cache-dependency-path:
    description: Path to go.sum used for the cache key
    required: false
    default: apps/api/go.sum

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version-file: apps/api/go.mod
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
