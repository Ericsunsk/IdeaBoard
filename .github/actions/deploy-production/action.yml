name: Deploy Production
description: Validate an immutable release, use restricted SSH transport, and clean up credentials

inputs:
  prerequisite-status:
    description: Caller job status before the deployment action (only success may deploy)
    required: true
  manifest-path:
    description: Path to the downloaded immutable release manifest
    required: true
  release-tag:
    description: Expected strict SemVer release tag
    required: true
  source-commit:
    description: Expected source commit when deploying a newly built release
    required: false
    default: ''
  vps-host:
    description: Verified Production hostname or IPv4 address
    required: true
  vps-ssh-port:
    description: Production SSH port
    required: true
  vps-deploy-user:
    description: Restricted forced-command SSH user
    required: true
  vps-deploy-private-key:
    description: Dedicated Production deployment private key
    required: true
  vps-known-hosts:
    description: Pinned host-key entries for the Production endpoint
    required: true

runs:
  using: composite
  steps:
    - name: Validate immutable release manifest
      shell: bash
      env:
        PREREQUISITE_STATUS: ${{ inputs.prerequisite-status }}
        RELEASE_MANIFEST: ${{ inputs.manifest-path }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
      run: |
        set -euo pipefail
        [[ "${PREREQUISITE_STATUS}" == success ]] || exit 1
        [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
        [[ -z "${SOURCE_COMMIT}" || "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || exit 1
        test -s "${RELEASE_MANIFEST}"
        jq -e \
          --arg expected_tag "${RELEASE_TAG}" \
          --arg expected_commit "${SOURCE_COMMIT}" \
          --arg expected_ref "refs/tags/${RELEASE_TAG}" \
          --arg expected_repository "${GITHUB_REPOSITORY}" \
          --arg expected_image_repository "ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" \
          '
            . as $manifest |
            .repository == $expected_repository and
            .tag == $expected_tag and
            .ref == $expected_ref and
            (.commit | type == "string" and test("^[0-9a-f]{40}$")) and
            ($expected_commit == "" or .commit == $expected_commit) and
            (["api", "api-migrate", "auth", "auth-migrate", "realtime"] | all(.[];
              . as $image |
              ($expected_image_repository + "/ideaboard-" + $image + "@sha256:") as $prefix |
              $manifest.images[$image] |
              type == "string" and startswith($prefix) and
              length == (($prefix | length) + 64) and test("@sha256:[0-9a-f]{64}$")
            ))
          ' "${RELEASE_MANIFEST}" > /dev/null

    - name: Configure restricted SSH transport
      shell: bash
      env:
        VPS_HOST: ${{ inputs.vps-host }}
        VPS_SSH_PORT: ${{ inputs.vps-ssh-port }}
        VPS_DEPLOY_USER: ${{ inputs.vps-deploy-user }}
        VPS_DEPLOY_PRIVATE_KEY: ${{ inputs.vps-deploy-private-key }}
        VPS_KNOWN_HOSTS: ${{ inputs.vps-known-hosts }}
      run: |
        set -euo pipefail

        for required_name in VPS_HOST VPS_SSH_PORT VPS_DEPLOY_USER VPS_DEPLOY_PRIVATE_KEY VPS_KNOWN_HOSTS; do
          [[ -n "${!required_name}" ]] || {
            echo "Missing GitHub production Environment value: ${required_name}" >&2
            exit 1
          }
        done
        if [[ ! "${VPS_SSH_PORT}" =~ ^[1-9][0-9]{0,4}$ ]] || ((VPS_SSH_PORT > 65535)); then
          echo 'Invalid Production SSH port' >&2
          exit 1
        fi
        [[ "${VPS_DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
        [[ "${VPS_HOST}" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1

        ssh_dir="${RUNNER_TEMP}/ideaboard-production-ssh"
        install -d -m 700 "${ssh_dir}"
        SSH_KEY_FILE="${ssh_dir}/deploy-key"
        SSH_KNOWN_HOSTS_FILE="${ssh_dir}/known_hosts"
        install -m 600 /dev/null "${SSH_KEY_FILE}"
        install -m 600 /dev/null "${SSH_KNOWN_HOSTS_FILE}"
        printf '%s\n' "${VPS_DEPLOY_PRIVATE_KEY}" > "${SSH_KEY_FILE}"
        printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${SSH_KNOWN_HOSTS_FILE}"

        known_host="${VPS_HOST}"
        if [[ "${VPS_SSH_PORT}" != "22" ]]; then
          known_host="[${VPS_HOST}]:${VPS_SSH_PORT}"
        fi
        ssh-keygen -F "${known_host}" -f "${SSH_KNOWN_HOSTS_FILE}" > /dev/null || {
          echo 'Pinned known_hosts does not contain the configured VPS endpoint' >&2
          exit 1
        }

    - name: Stream manifest to Production deploy entrypoint
      shell: bash
      env:
        RELEASE_MANIFEST: ${{ inputs.manifest-path }}
        VPS_HOST: ${{ inputs.vps-host }}
        VPS_SSH_PORT: ${{ inputs.vps-ssh-port }}
        VPS_DEPLOY_USER: ${{ inputs.vps-deploy-user }}
        SSH_KEY_FILE: ${{ runner.temp }}/ideaboard-production-ssh/deploy-key
        SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ideaboard-production-ssh/known_hosts
        PRODUCTION_DEPLOY_RESULT_PATH: ${{ runner.temp }}/production-deploy-result.json
      run: ./scripts/run-production-deploy.sh "${RELEASE_MANIFEST}"

    - name: Remove SSH credentials
      if: always()
      shell: bash
      run: rm -rf -- "${RUNNER_TEMP}/ideaboard-production-ssh"

    - name: Write Production deployment summary
      if: always()
      shell: bash
      env:
        RELEASE_MANIFEST: ${{ inputs.manifest-path }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        RESULT: ${{ job.status }}
      run: |
        set -euo pipefail
        result_file="${RUNNER_TEMP}/production-deploy-result.json"
        failed_stage='not-started'
        recovery_hint='review_failed_workflow_step'
        if jq -e '
          (.result == "success" or .result == "failure")
          and (.stage | strings)
          and (.recovery_hint | strings)
        ' "${result_file}" > /dev/null 2>&1; then
          failed_stage="$(jq -r 'if .result == "success" then "none" else .stage end' "${result_file}")"
          recovery_hint="$(jq -r '.recovery_hint' "${result_file}")"
        fi
        commit="$(jq -er '.commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "${RELEASE_MANIFEST}" 2>/dev/null || printf 'unavailable')"
        {
          echo '### Production deployment'
          echo
          echo '| Field | Value |'
          echo '| --- | --- |'
          echo "| Result | \`${RESULT}\` |"
          echo "| Tag | \`${RELEASE_TAG}\` |"
          echo "| Commit | \`${commit}\` |"
          for image in api api-migrate auth auth-migrate realtime; do
            digest="$(jq -er --arg image "${image}" '.images[$image] | capture("@(?<digest>sha256:[0-9a-f]{64})$").digest' "${RELEASE_MANIFEST}" 2>/dev/null || printf 'unavailable')"
            echo "| ${image} digest | \`${digest}\` |"
          done
          echo "| Failed stage | \`${failed_stage}\` |"
          echo "| Recovery hint | \`${recovery_hint}\` |"
        } >> "${GITHUB_STEP_SUMMARY}"
