name: Setup Node
description: Configure the repository Node runtime and npm dependency cache

inputs:
  cache-dependency-path:
    description: Path to the npm lockfile used for the cache key
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
