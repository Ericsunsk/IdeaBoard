name: Ops

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ops-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          build-cache-scope: ops

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Verify CI orchestration contracts
        run: bash scripts/run-all-self-tests.sh

      - name: Check env schema and example drift
        run: bash scripts/env-schema-check.sh

      - name: Install ShellCheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Check shell scripts
        shell: bash
        run: |
          # Git is the canonical inventory; Go and Bats files are not Bash scripts.
          shell_scripts=()
          while IFS= read -r -d '' script; do
            shell_scripts+=("$script")
          done < <(git ls-files -z -- 'scripts/*.sh')
          [[ "${#shell_scripts[@]}" -gt 0 ]]
          for script in "${shell_scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${shell_scripts[@]}"

      - name: Lint Dockerfiles
        run: |
          docker run --rm \
            -v "${PWD}:/work:ro" \
            -w /work \
            --entrypoint hadolint \
            hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            apps/api/Dockerfile apps/auth/Dockerfile apps/realtime/Dockerfile

      - name: Install yamllint
        shell: bash
        run: |
          if ! command -v yamllint >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y yamllint
          fi
          yamllint --version

      - name: Lint compose and Grype YAML
        shell: bash
        run: |
          yamllint \
            docker/compose.yml \
            docker/compose.npm.yml \
            docker/compose.local.yml \
            .grype.yaml

      - name: Validate nginx template rendering
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          default_conf="$tmp_dir/default.conf"
          docker_conf="$tmp_dir/docker.conf"
          real_ip_conf="$tmp_dir/real-ip.conf"

          bash scripts/render-nginx-template.sh "$default_conf"
          env \
            NGINX_API_UPSTREAM=http://api:6000 \
            NGINX_AUTH_UPSTREAM=http://auth:6001 \
            NGINX_AUTH_HEALTH_UPSTREAM=http://auth:6001/api/health \
            NGINX_WEB_ROOT=/usr/share/nginx/html \
            NGINX_ROOT_DIRECTIVE="return 404" \
            bash scripts/render-nginx-template.sh "$docker_conf"
          env \
            NGINX_REAL_IP_INCLUDE=/etc/nginx/cloudflare-real-ip.conf \
            bash scripts/render-nginx-template.sh "$real_ip_conf"

          for rendered_conf in "$default_conf" "$docker_conf" "$real_ip_conf"; do
            grep -F 'location ~ ^/api/v1/workspaces/[^/]+/tasks(/|$)' "$rendered_conf"
            grep -F 'location ~ ^/api/v1/workspaces/[^/]+/events(/|$)' "$rendered_conf"
            grep -F 'proxy_set_header Connection "";' "$rendered_conf"
            if grep -F "\${" "$rendered_conf"; then
              echo "Unrendered template variable in $rendered_conf" >&2
              exit 1
            fi
            if grep -F 'X-XSS-Protection' "$rendered_conf"; then
              echo "Unexpected legacy X-XSS-Protection header in $rendered_conf" >&2
              exit 1
            fi
          done

          grep -F "try_files \$uri \$uri/ /index.html;" "$default_conf"
          grep -F 'return 404;' "$docker_conf"
          grep -F 'include /etc/nginx/cloudflare-real-ip.conf;' "$real_ip_conf"

      - name: Test rendered nginx configs
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          default_conf="$tmp_dir/default.conf"
          docker_conf="$tmp_dir/docker.conf"
          real_ip_include="$tmp_dir/cloudflare-real-ip.conf"
          real_ip_conf="$tmp_dir/real-ip.conf"

          bash scripts/render-nginx-template.sh "$default_conf"
          env \
            NGINX_API_UPSTREAM=http://api:6000 \
            NGINX_AUTH_UPSTREAM=http://auth:6001 \
            NGINX_AUTH_HEALTH_UPSTREAM=http://auth:6001/api/health \
            NGINX_WEB_ROOT=/usr/share/nginx/html \
            NGINX_ROOT_DIRECTIVE="return 404" \
            bash scripts/render-nginx-template.sh "$docker_conf"
          printf '%s\n' \
            'set_real_ip_from 127.0.0.1;' \
            'real_ip_header CF-Connecting-IP;' \
            'real_ip_recursive on;' \
            > "$real_ip_include"
          env \
            NGINX_REAL_IP_INCLUDE=/etc/nginx/cloudflare-real-ip.conf \
            bash scripts/render-nginx-template.sh "$real_ip_conf"

          docker run --rm \
            -v "$default_conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host auth:127.0.0.1 \
            -v "$docker_conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            -v "$real_ip_conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$real_ip_include:/etc/nginx/cloudflare-real-ip.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validate Docker Compose config
        run: |
          docker compose -f docker/compose.yml --env-file docker/.env.example --env-file docker/images.env.example config
          docker compose -f docker/compose.yml -f docker/compose.npm.yml --env-file docker/.env.example --env-file docker/images.env.example config
