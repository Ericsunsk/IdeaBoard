name: Auth

on:
  workflow_call:
    inputs:
      source_commit:
        type: string
        default: ''
      build_images:
        required: false
        type: boolean
        default: false
      audit_dependencies:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  quality:
    name: Auth Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with: { cache-dependency-path: apps/auth/package-lock.json }
      - uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/auth
          omit-optional: 'true'
      - name: Lint Auth
        working-directory: apps/auth
        run: npm run lint
      - uses: ./.github/actions/setup-go
        with:
          build-cache-scope: auth-contract
      # Keep cold dependency downloads and compilation outside the live contract's 60s budget.
      - name: Prepare Go contract test
        working-directory: apps/api
        run: go test -run '^$' ./internal/identity/auth
      - name: Test Auth
        working-directory: apps/auth
        run: npm test
      - name: Build Auth
        working-directory: apps/auth
        run: npm run build
      - name: Production dependency audit
        if: inputs.audit_dependencies
        working-directory: apps/auth
        run: npm audit --omit=dev --audit-level=high
  image:
    name: Auth PR Images
    if: inputs.build_images
    needs: [quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            target: runtime
          - name: auth-migrate
            target: migrator
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./apps/auth
          file: ./apps/auth/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: ideaboard-${{ matrix.name }}:pr
          cache-from: type=gha,scope=ideaboard-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ideaboard-${{ matrix.name }}
