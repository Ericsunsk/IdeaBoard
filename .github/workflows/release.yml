name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FRONTEND_ARCHIVE="feng-frontend-${TAG}.tar.gz"
          mkdir -p "release/$TAG"
          cd frontend
          npm run build
          tar -czf "../release/$TAG/${FRONTEND_ARCHIVE}" dist

      - name: Build backend binaries
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          BACKEND_LINUX="feng-backend-${TAG}-linux-amd64"
          BACKEND_DARWIN="feng-backend-${TAG}-darwin-arm64"
          mkdir -p "release/$TAG"
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "../release/$TAG/${BACKEND_LINUX}" ./cmd/main.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o "../release/$TAG/${BACKEND_DARWIN}" ./cmd/main.go

      - name: Assemble deployment bundle
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          BUNDLE_NAME="feng-bundle-${TAG}-linux-amd64"
          BUNDLE_DIR="$RELEASE_DIR/$BUNDLE_NAME"
          BUNDLE_ARCHIVE="${BUNDLE_NAME}.tar.gz"

          rm -rf "$BUNDLE_DIR"
          mkdir -p \
            "$BUNDLE_DIR/backend/uploads" \
            "$BUNDLE_DIR/frontend" \
            "$BUNDLE_DIR/deploy/nginx" \
            "$BUNDLE_DIR/deploy/systemd"

          cp "$RELEASE_DIR/feng-backend-${TAG}-linux-amd64" "$BUNDLE_DIR/backend/feng-server"
          cp -R frontend/dist "$BUNDLE_DIR/frontend/dist"
          cp backend/.env.example "$BUNDLE_DIR/backend/.env.example"
          cp README.md "$BUNDLE_DIR/README.md"
          cp DEPLOYMENT.md "$BUNDLE_DIR/DEPLOYMENT.md"
          cp development.md "$BUNDLE_DIR/development.md"

          cat > "$BUNDLE_DIR/deploy/systemd/feng.service" <<'EOF'
          [Unit]
          Description=FENG Backend
          After=network.target

          [Service]
          WorkingDirectory=/opt/feng/backend
          ExecStart=/opt/feng/backend/feng-server
          Restart=always
          RestartSec=3
          EnvironmentFile=/opt/feng/backend/.env

          [Install]
          WantedBy=multi-user.target
          EOF
          sed -i 's/^          //' "$BUNDLE_DIR/deploy/systemd/feng.service"

          cat > "$BUNDLE_DIR/deploy/nginx/feng.conf" <<'EOF'
          server {
              listen 80;
              server_name _;

              root /opt/feng/frontend/dist;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /uploads/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF
          sed -i 's/^          //' "$BUNDLE_DIR/deploy/nginx/feng.conf"

          tar -czf "$RELEASE_DIR/$BUNDLE_ARCHIVE" -C "$RELEASE_DIR" "$BUNDLE_NAME"

      - name: Generate release metadata
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          FRONTEND_ARCHIVE="feng-frontend-${TAG}.tar.gz"
          BACKEND_DARWIN="feng-backend-${TAG}-darwin-arm64"
          BACKEND_LINUX="feng-backend-${TAG}-linux-amd64"
          BUNDLE_ARCHIVE="feng-bundle-${TAG}-linux-amd64.tar.gz"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"

          {
            echo "release=$TAG"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "frontend_package_version=${FRONTEND_VERSION}"
          } > "$RELEASE_DIR/RELEASE_INFO.txt"

          (
            cd "$RELEASE_DIR"
            sha256sum \
              "$BACKEND_DARWIN" \
              "$BACKEND_LINUX" \
              "$FRONTEND_ARCHIVE" \
              "$BUNDLE_ARCHIVE" \
              > SHA256SUMS.txt
          )

      - name: Generate release notes from changelog
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          NOTES_FILE="$RELEASE_DIR/RELEASE_NOTES.md"

          {
            echo "# FENG $TAG"
            echo

            awk -v tag="$TAG" '
              $0 ~ "^## " tag "([[:space:]]|$)" { found=1; print; next }
              /^## / && found { exit }
              found { print }
            ' CHANGELOG.md
          } > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ] || [ "$(wc -l < "$NOTES_FILE")" -le 2 ]; then
            printf '# FENG %s\n\n自动发布版本 %s。\n' "$TAG" "$TAG" > "$NOTES_FILE"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release/${{ steps.meta.outputs.tag }}/RELEASE_NOTES.md
          files: |
            release/${{ steps.meta.outputs.tag }}/feng-backend-${{ steps.meta.outputs.tag }}-darwin-arm64
            release/${{ steps.meta.outputs.tag }}/feng-backend-${{ steps.meta.outputs.tag }}-linux-amd64
            release/${{ steps.meta.outputs.tag }}/feng-frontend-${{ steps.meta.outputs.tag }}.tar.gz
            release/${{ steps.meta.outputs.tag }}/feng-bundle-${{ steps.meta.outputs.tag }}-linux-amd64.tar.gz
            release/${{ steps.meta.outputs.tag }}/RELEASE_INFO.txt
            release/${{ steps.meta.outputs.tag }}/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
