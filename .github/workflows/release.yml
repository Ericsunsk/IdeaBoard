name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/auth/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --fund=false

      - name: Install auth dependencies
        working-directory: apps/auth
        run: npm ci --no-audit --fund=false

      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev

      - name: Audit auth production dependencies
        working-directory: apps/auth
        run: npm audit --omit=dev

      - name: Test Go API
        working-directory: apps/api
        run: go test ./...

      - name: Test Go API with race detector
        working-directory: apps/api
        run: go test -race ./...

      - name: Lint Go API
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
        with:
          version: v2.12.2
          working-directory: apps/api
          args: ./...

      - name: Build web archive
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          WEB_ARCHIVE="ideaboard-web-${TAG}.tar.gz"
          mkdir -p "release/$TAG"
          cd apps/web
          npm run build
          tar -czf "../../release/$TAG/${WEB_ARCHIVE}" dist

      - name: Build auth service
        working-directory: apps/auth
        run: npm run build

      - name: Build api binaries
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          API_LINUX="ideaboard-api-${TAG}-linux-amd64"
          API_DARWIN="ideaboard-api-${TAG}-darwin-arm64"
          mkdir -p "release/$TAG"
          cd apps/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "../../release/$TAG/${API_LINUX}" ./cmd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o "../../release/$TAG/${API_DARWIN}" ./cmd

      - name: Assemble deployment bundle
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          BUNDLE_NAME="ideaboard-bundle-${TAG}-linux-amd64"
          BUNDLE_DIR="$RELEASE_DIR/$BUNDLE_NAME"
          BUNDLE_ARCHIVE="${BUNDLE_NAME}.tar.gz"

          rm -rf "$BUNDLE_DIR"
          mkdir -p \
            "$BUNDLE_DIR/apps/auth" \
            "$BUNDLE_DIR/apps/api/uploads" \
            "$BUNDLE_DIR/apps/web" \
            "$BUNDLE_DIR/docker" \
            "$BUNDLE_DIR/docs" \
            "$BUNDLE_DIR/deploy/nginx" \
            "$BUNDLE_DIR/deploy/systemd"

          cp "$RELEASE_DIR/ideaboard-api-${TAG}-linux-amd64" "$BUNDLE_DIR/apps/api/ideaboard-server"
          cp -R apps/web/dist "$BUNDLE_DIR/apps/web/dist"
          cp -R apps/auth/dist "$BUNDLE_DIR/apps/auth/dist"
          cp apps/auth/package.json "$BUNDLE_DIR/apps/auth/package.json"
          cp apps/auth/package-lock.json "$BUNDLE_DIR/apps/auth/package-lock.json"
          cp apps/auth/.env.example "$BUNDLE_DIR/apps/auth/.env.example"
          cp apps/api/.env.example "$BUNDLE_DIR/apps/api/.env.example"
          cp README.md "$BUNDLE_DIR/README.md"
          cp DEPLOYMENT.md "$BUNDLE_DIR/DEPLOYMENT.md"
          cp DEVELOPMENT.md "$BUNDLE_DIR/DEVELOPMENT.md"
          cp SYSTEM_PROMPT.md "$BUNDLE_DIR/SYSTEM_PROMPT.md"
          cp CHANGELOG.md "$BUNDLE_DIR/CHANGELOG.md"
          cp -R docs/. "$BUNDLE_DIR/docs/"
          cp docker/README.md "$BUNDLE_DIR/docker/README.md"

          cat > "$BUNDLE_DIR/deploy/systemd/ideaboard.service" <<'EOF'
          [Unit]
          Description=IdeaBoard API
          After=network.target

          [Service]
          WorkingDirectory=/opt/ideaboard/apps/api
          User=ideaboard
          Group=ideaboard
          Environment=APP_ENV=production
          ExecStart=/opt/ideaboard/apps/api/ideaboard-server
          Restart=always
          RestartSec=3
          EnvironmentFile=/opt/ideaboard/apps/api/.env

          [Install]
          WantedBy=multi-user.target
          EOF
          sed -i 's/^          //' "$BUNDLE_DIR/deploy/systemd/ideaboard.service"

          cat > "$BUNDLE_DIR/deploy/systemd/ideaboard-auth.service" <<'EOF'
          [Unit]
          Description=IdeaBoard Auth Service
          After=network.target

          [Service]
          WorkingDirectory=/opt/ideaboard/apps/auth
          User=ideaboard
          Group=ideaboard
          ExecStart=/usr/bin/env node /opt/ideaboard/apps/auth/dist/index.js
          Restart=always
          RestartSec=3
          Environment=NODE_ENV=production
          EnvironmentFile=/opt/ideaboard/apps/auth/.env

          [Install]
          WantedBy=multi-user.target
          EOF
          sed -i 's/^          //' "$BUNDLE_DIR/deploy/systemd/ideaboard-auth.service"

          cat > "$BUNDLE_DIR/deploy/nginx/ideaboard.conf" <<'EOF'
          server {
              listen 80;
              server_name _;

              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;

              client_max_body_size 50m;

              root /opt/ideaboard/apps/web/dist;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location /api/auth/ {
                  proxy_pass http://127.0.0.1:6001;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:6000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /uploads/ {
                  proxy_pass http://127.0.0.1:6000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF
          sed -i 's/^          //' "$BUNDLE_DIR/deploy/nginx/ideaboard.conf"

          tar -czf "$RELEASE_DIR/$BUNDLE_ARCHIVE" -C "$RELEASE_DIR" "$BUNDLE_NAME"

      - name: Generate release metadata
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          WEB_ARCHIVE="ideaboard-web-${TAG}.tar.gz"
          API_DARWIN="ideaboard-api-${TAG}-darwin-arm64"
          API_LINUX="ideaboard-api-${TAG}-linux-amd64"
          BUNDLE_ARCHIVE="ideaboard-bundle-${TAG}-linux-amd64.tar.gz"
          WEB_VERSION="$(node -p "require('./apps/web/package.json').version")"
          AUTH_VERSION="$(node -p "require('./apps/auth/package.json').version")"

          {
            echo "release=$TAG"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "web_package_version=${WEB_VERSION}"
            echo "auth_package_version=${AUTH_VERSION}"
          } > "$RELEASE_DIR/RELEASE_INFO.txt"

          (
            cd "$RELEASE_DIR"
            sha256sum \
              "$API_DARWIN" \
              "$API_LINUX" \
              "$WEB_ARCHIVE" \
              "$BUNDLE_ARCHIVE" \
              > SHA256SUMS.txt
          )

      - name: Generate release notes from changelog
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          NOTES_FILE="$RELEASE_DIR/RELEASE_NOTES.md"

          {
            echo "# IdeaBoard $TAG"
            echo

            awk -v tag="$TAG" '
              $0 ~ "^## " tag "([[:space:]]|$)" { found=1; print; next }
              /^## / && found { exit }
              found { print }
            ' CHANGELOG.md
          } > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ] || [ "$(wc -l < "$NOTES_FILE")" -le 2 ]; then
            printf '# IdeaBoard %s\n\n自动发布版本 %s。\n' "$TAG" "$TAG" > "$NOTES_FILE"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release/${{ steps.meta.outputs.tag }}/RELEASE_NOTES.md
          files: |
            release/${{ steps.meta.outputs.tag }}/ideaboard-api-${{ steps.meta.outputs.tag }}-darwin-arm64
            release/${{ steps.meta.outputs.tag }}/ideaboard-api-${{ steps.meta.outputs.tag }}-linux-amd64
            release/${{ steps.meta.outputs.tag }}/ideaboard-web-${{ steps.meta.outputs.tag }}.tar.gz
            release/${{ steps.meta.outputs.tag }}/ideaboard-bundle-${{ steps.meta.outputs.tag }}-linux-amd64.tar.gz
            release/${{ steps.meta.outputs.tag }}/RELEASE_INFO.txt
            release/${{ steps.meta.outputs.tag }}/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
