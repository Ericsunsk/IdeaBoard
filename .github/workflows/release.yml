name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  backend-verification:
    name: Backend Verification
    uses: ./.github/workflows/backend.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      build_images: false

  build-release:
    name: Build Release Bundle
    needs:
      - backend-verification
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      source_commit: ${{ steps.meta.outputs.source_commit }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release source
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${REQUESTED_TAG}" >&2
            exit 1
          fi

          source_commit="$(git rev-parse 'HEAD^{commit}')"
          tag_commit="$(git rev-parse "refs/tags/${REQUESTED_TAG}^{commit}")"
          if [[ "${source_commit}" != "${tag_commit}" ]]; then
            echo "Checked out commit does not match ${REQUESTED_TAG}" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${source_commit}" origin/main; then
            echo "Release tag ${REQUESTED_TAG} is not reachable from main" >&2
            exit 1
          fi

          successful_gate_count="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${source_commit}/check-runs" \
              --jq '[.check_runs[] | select(.name == "CI Gate" and .conclusion == "success")] | length'
          )"
          if [[ "${successful_gate_count}" -lt 1 ]]; then
            echo "Release commit ${source_commit} has no successful CI Gate check" >&2
            exit 1
          fi

          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/auth/package-lock.json

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum

      - name: Install Web dependencies
        uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/web

      - name: Install Auth dependencies
        uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/auth
          omit-optional: 'true'

      - name: Audit production dependencies
        shell: bash
        run: |
          (cd apps/web && npm audit --omit=dev --audit-level=high)
          (cd apps/auth && npm audit --omit=dev --audit-level=high)

      - name: Build Web and Auth
        shell: bash
        run: |
          (cd apps/web && npm run build)
          (cd apps/auth && npm run build)

      - name: Build release artifacts
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
        run: |
          release_dir="release/${TAG}"
          mkdir -p "${release_dir}"

          tar -C apps/web -czf "${release_dir}/ideaboard-web-${TAG}.tar.gz" dist
          (
            cd apps/api
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -o "../../${release_dir}/ideaboard-api-${TAG}-linux-amd64" ./cmd
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -o "../../${release_dir}/ideaboard-api-${TAG}-darwin-arm64" ./cmd
          )

          web_version="$(node -p "require('./apps/web/package.json').version")"
          auth_version="$(node -p "require('./apps/auth/package.json').version")"
          {
            echo "release=${TAG}"
            echo "commit=${SOURCE_COMMIT}"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "web_package_version=${web_version}"
            echo "auth_package_version=${auth_version}"
          } > "${release_dir}/RELEASE_INFO.txt"

          notes_file="${release_dir}/RELEASE_NOTES.md"
          {
            echo "# IdeaBoard ${TAG}"
            echo
            awk -v tag="${TAG}" '
              $0 ~ "^## " tag "([[:space:]]|$)" { found=1; print; next }
              /^## / && found { exit }
              found { print }
            ' CHANGELOG.md
          } > "${notes_file}"

          if [[ "$(wc -l < "${notes_file}")" -le 2 ]]; then
            printf '# IdeaBoard %s\n\n自动发布版本 %s。\n' "${TAG}" "${TAG}" > "${notes_file}"
          fi

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: release/${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: release/${{ steps.meta.outputs.tag }}/release.sbom.spdx.json
          artifact-name: ideaboard-${{ steps.meta.outputs.tag }}-release-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums and provenance
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
        run: |
          release_dir="release/${TAG}"
          (
            cd "${release_dir}"
            sha256sum \
              "ideaboard-api-${TAG}-darwin-arm64" \
              "ideaboard-api-${TAG}-linux-amd64" \
              "ideaboard-web-${TAG}.tar.gz" \
              release.sbom.spdx.json \
              > SHA256SUMS.txt
          )

          jq -n \
            --arg tag "${TAG}" \
            --arg commit "${SOURCE_COMMIT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_ref "${GITHUB_WORKFLOW_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --rawfile checksums "${release_dir}/SHA256SUMS.txt" \
            '{
              release: $tag,
              source_commit: $commit,
              repository: $repository,
              workflow_ref: $workflow_ref,
              run_id: $run_id,
              sha256sums: ($checksums | split("\n") | map(select(length > 0)))
            }' > "${release_dir}/PROVENANCE.json"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ideaboard-${{ steps.meta.outputs.tag }}-release
          path: release/${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-release
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ideaboard-${{ needs.build-release.outputs.tag }}-release
          path: release/${{ needs.build-release.outputs.tag }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign release provenance
        env:
          TAG: ${{ needs.build-release.outputs.tag }}
        run: |
          cosign sign-blob --yes \
            --bundle "release/${TAG}/PROVENANCE.sigstore.json" \
            "release/${TAG}/PROVENANCE.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build-release.outputs.tag }}
          name: ${{ needs.build-release.outputs.tag }}
          body_path: release/${{ needs.build-release.outputs.tag }}/RELEASE_NOTES.md
          files: |
            release/${{ needs.build-release.outputs.tag }}/ideaboard-api-${{ needs.build-release.outputs.tag }}-darwin-arm64
            release/${{ needs.build-release.outputs.tag }}/ideaboard-api-${{ needs.build-release.outputs.tag }}-linux-amd64
            release/${{ needs.build-release.outputs.tag }}/ideaboard-web-${{ needs.build-release.outputs.tag }}.tar.gz
            release/${{ needs.build-release.outputs.tag }}/RELEASE_INFO.txt
            release/${{ needs.build-release.outputs.tag }}/SHA256SUMS.txt
            release/${{ needs.build-release.outputs.tag }}/release.sbom.spdx.json
            release/${{ needs.build-release.outputs.tag }}/PROVENANCE.json
            release/${{ needs.build-release.outputs.tag }}/PROVENANCE.sigstore.json
          fail_on_unmatched_files: true
          make_latest: true
