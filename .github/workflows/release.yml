name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/auth/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --fund=false

      - name: Install auth dependencies
        working-directory: apps/auth
        run: npm ci --omit=optional --no-audit --fund=false

      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev

      - name: Audit auth production dependencies
        working-directory: apps/auth
        run: npm audit --omit=dev

      - name: Test Go API migrations
        working-directory: apps/api
        run: go test ./internal/db/migrations -run TestMigrations -count=1

      - name: Build auth service
        working-directory: apps/auth
        run: npm run build

      - name: Smoke API then Auth migrations
        shell: bash
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: ideaboard
          DB_PASSWORD: ideaboard_test
          DB_NAME: ideaboard_test
          DB_SSLMODE: disable
          AUTH_INTERNAL_KEY: 0123456789abcdef0123456789abcdef
          AUTH_TRUSTED_ORIGINS: https://app.example.com
          BETTER_AUTH_SECRET: abcdef0123456789abcdef0123456789
          BETTER_AUTH_URL: https://api.example.com
          NODE_ENV: production
        run: |
          (cd apps/api && go run ./cmd migrate)
          (cd apps/auth && npm run migrate:dist)
          (cd apps/api && go run ./cmd migrate)
          (cd apps/auth && npm run migrate:dist)

      - name: Test Go API
        working-directory: apps/api
        run: go test ./...

      - name: Check sqlc generated code
        working-directory: apps/api
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/db/sqlc

      - name: Test Go API with race detector
        working-directory: apps/api
        run: go test -race ./...

      - name: Lint Go API
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
        with:
          version: v2.12.2
          working-directory: apps/api
          args: ./...

      - name: Build web archive
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          WEB_ARCHIVE="ideaboard-web-${TAG}.tar.gz"
          mkdir -p "release/$TAG"
          cd apps/web
          npm run build
          tar -czf "../../release/$TAG/${WEB_ARCHIVE}" dist

      - name: Build api binaries
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          API_LINUX="ideaboard-api-${TAG}-linux-amd64"
          API_DARWIN="ideaboard-api-${TAG}-darwin-arm64"
          mkdir -p "release/$TAG"
          cd apps/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "../../release/$TAG/${API_LINUX}" ./cmd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o "../../release/$TAG/${API_DARWIN}" ./cmd

      - name: Generate release metadata
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          WEB_ARCHIVE="ideaboard-web-${TAG}.tar.gz"
          API_DARWIN="ideaboard-api-${TAG}-darwin-arm64"
          API_LINUX="ideaboard-api-${TAG}-linux-amd64"
          WEB_VERSION="$(node -p "require('./apps/web/package.json').version")"
          AUTH_VERSION="$(node -p "require('./apps/auth/package.json').version")"

          {
            echo "release=$TAG"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "web_package_version=${WEB_VERSION}"
            echo "auth_package_version=${AUTH_VERSION}"
          } > "$RELEASE_DIR/RELEASE_INFO.txt"

          (
            cd "$RELEASE_DIR"
            sha256sum \
              "$API_DARWIN" \
              "$API_LINUX" \
              "$WEB_ARCHIVE" \
              > SHA256SUMS.txt
          )

      - name: Generate release notes from changelog
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_DIR="release/$TAG"
          NOTES_FILE="$RELEASE_DIR/RELEASE_NOTES.md"

          {
            echo "# IdeaBoard $TAG"
            echo

            awk -v tag="$TAG" '
              $0 ~ "^## " tag "([[:space:]]|$)" { found=1; print; next }
              /^## / && found { exit }
              found { print }
            ' CHANGELOG.md
          } > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ] || [ "$(wc -l < "$NOTES_FILE")" -le 2 ]; then
            printf '# IdeaBoard %s\n\n自动发布版本 %s。\n' "$TAG" "$TAG" > "$NOTES_FILE"
          fi

          {
            echo
            echo "## Docker image manifest"
            echo
            echo "同一 tag 会触发 Docker Images workflow 发布 GHCR 镜像，并把 \`release-manifest.json\` 上传为本 Release asset 与 workflow artifact。该 manifest 是三张镜像 digest、SBOM artifact 与 Cosign identity 的部署契约。"
          } >> "$NOTES_FILE"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release/${{ steps.meta.outputs.tag }}/RELEASE_NOTES.md
          files: |
            release/${{ steps.meta.outputs.tag }}/ideaboard-api-${{ steps.meta.outputs.tag }}-darwin-arm64
            release/${{ steps.meta.outputs.tag }}/ideaboard-api-${{ steps.meta.outputs.tag }}-linux-amd64
            release/${{ steps.meta.outputs.tag }}/ideaboard-web-${{ steps.meta.outputs.tag }}.tar.gz
            release/${{ steps.meta.outputs.tag }}/RELEASE_INFO.txt
            release/${{ steps.meta.outputs.tag }}/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
