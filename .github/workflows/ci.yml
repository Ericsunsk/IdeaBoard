name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: true
      source_commit:
        required: true
        type: string
      preview_images:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.source_commit || 'event' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
      api: ${{ steps.classify.outputs.api }}
      auth: ${{ steps.classify.outputs.auth }}
      realtime: ${{ steps.classify.outputs.realtime }}
      migration_integration: ${{ steps.classify.outputs.migration_integration }}
      docker: ${{ steps.classify.outputs.docker }}
      ops: ${{ steps.classify.outputs.ops }}
      web_audit: ${{ steps.classify.outputs.web_audit }}
      api_audit: ${{ steps.classify.outputs.api_audit }}
      auth_audit: ${{ steps.classify.outputs.auth_audit }}
      realtime_audit: ${{ steps.classify.outputs.realtime_audit }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      base_sha: ${{ steps.baseline.outputs.base_sha }}
      head_sha: ${{ steps.baseline.outputs.head_sha }}
      force_full: ${{ steps.baseline.outputs.force_full }}
      api_tests: ${{ steps.classify.outputs.api_tests }}
      api_sqlc: ${{ steps.classify.outputs.api_sqlc }}
      api_migrations: ${{ steps.classify.outputs.api_migrations }}
      api_build: ${{ steps.classify.outputs.api_build }}
      api_images: ${{ steps.classify.outputs.api_images }}
      browser_smoke: ${{ steps.classify.outputs.browser_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select verified ancestor baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
          FORCE_FULL: ${{ (github.event_name == 'workflow_dispatch' || inputs.force_full) && 'true' || 'false' }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: ./scripts/ci-baseline.sh "${RUNNER_TEMP}/changed-paths.txt" | tee -a "${GITHUB_OUTPUT}"
      - name: Classify changed contexts
        id: classify
        run: ./scripts/ci-change-classifier.sh < "${RUNNER_TEMP}/changed-paths.txt" | tee -a "${GITHUB_OUTPUT}"

  web:
    name: Web Verification
    permissions:
      contents: read
      pull-requests: write
    if: needs.changes.outputs.web == 'true'
    needs: [changes]
    uses: ./.github/workflows/web.yml
    with:
      base_sha: ${{ needs.changes.outputs.base_sha }}
      head_sha: ${{ needs.changes.outputs.head_sha }}
      force_full: ${{ needs.changes.outputs.force_full == 'true' }}
      audit_dependencies: ${{ needs.changes.outputs.web_audit == 'true' }}
  api:
    name: API Verification
    if: needs.changes.outputs.api == 'true'
    needs: [changes]
    uses: ./.github/workflows/api.yml
    with:
      base_sha: ${{ needs.changes.outputs.base_sha }}
      head_sha: ${{ needs.changes.outputs.head_sha }}
      force_full: ${{ needs.changes.outputs.force_full == 'true' }}
      run_tests: ${{ needs.changes.outputs.api_tests == 'true' }}
      run_sqlc: ${{ needs.changes.outputs.api_sqlc == 'true' }}
      run_migrations: ${{ needs.changes.outputs.api_migrations == 'true' }}
      build_api: ${{ needs.changes.outputs.api_build == 'true' }}
      build_images: ${{ needs.changes.outputs.api_images == 'true' && (inputs.preview_images || !inputs.source_commit) }}
      audit_dependencies: ${{ needs.changes.outputs.api_audit == 'true' }}
  auth:
    name: Auth Verification
    if: needs.changes.outputs.auth == 'true'
    needs: [changes]
    uses: ./.github/workflows/auth.yml
    with:
      source_commit: ${{ needs.changes.outputs.head_sha }}
      build_images: ${{ needs.changes.outputs.docker == 'true' && (inputs.preview_images || !inputs.source_commit) }}
      audit_dependencies: ${{ needs.changes.outputs.auth_audit == 'true' }}
  realtime:
    name: Realtime Verification
    if: needs.changes.outputs.realtime == 'true'
    needs: [changes]
    uses: ./.github/workflows/realtime.yml
    with:
      source_commit: ${{ needs.changes.outputs.head_sha }}
      build_images: ${{ needs.changes.outputs.docker == 'true' && (inputs.preview_images || !inputs.source_commit) }}
      audit_dependencies: ${{ needs.changes.outputs.realtime_audit == 'true' }}
  migration-integration:
    name: Migration Integration
    if: needs.changes.outputs.migration_integration == 'true'
    needs: [changes]
    uses: ./.github/workflows/migration-integration.yml
    with:
      source_commit: ${{ needs.changes.outputs.head_sha }}
      base_sha: ${{ needs.changes.outputs.base_sha }}
      head_sha: ${{ needs.changes.outputs.head_sha }}
  backend-browser-smoke:
    name: Backend Browser Smoke
    if: ${{ needs.changes.outputs.web != 'true' && needs.changes.outputs.browser_smoke == 'true' }}
    needs: [changes]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Web dependencies
        uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/web
      - name: User route smoke
        env:
          USER_ROUTE_SMOKE_VERBOSE: "1"
        run: ./scripts/ci-parity.sh web-smoke
  ops:
    name: Ops Verification
    if: needs.changes.outputs.ops == 'true'
    needs: [changes]
    uses: ./.github/workflows/ops.yml
    with:
      source_commit: ${{ needs.changes.outputs.head_sha }}
  media-contract:
    # Issue #661 / #667 contract gate. This always runs so the
    # required CI Gate cannot silently accept a skipped media
    # contract check on docs-only or workflow-only changes.
    name: Media Contract
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run media package boundary gate
        run: ./scripts/ci-media-package-boundary.sh
      - name: Run legacy media cutover zero-result scan
        run: ./scripts/ci-legacy-media-zero-scan.sh
  handbook-contract:
    # Issue #855 version/link contract gate. This always runs so the
    # required CI Gate cannot silently accept version drift or stale
    # handbook entry points on docs-only or workflow-only changes.
    name: Handbook Contract
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Run handbook version and link contract
        run: ./scripts/handbook-version-contract.sh
  pr-size-guard:
    # Check PR review size, not the accumulated history in a push range.
    # Keep the job present on every event for the required CI Gate.
    name: PR Size Guard
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run PR size guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo 'pr-size-guard: skipped (the size gate applies to pull requests, not pushes)'
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            printf '%s\n' .github/workflows/ci.yml > "${RUNNER_TEMP}/changed-paths.txt"
          elif [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git ls-files > "${RUNNER_TEMP}/changed-paths.txt"
          else
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed-paths.txt"
          fi
          ./scripts/ci-pr-size-guard.sh "${RUNNER_TEMP}/changed-paths.txt"
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, web, api, auth, realtime, migration-integration, backend-browser-smoke, ops, media-contract, handbook-contract, pr-size-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Summarize and verify required lanes
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          API_REQUIRED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          AUTH_REQUIRED: ${{ needs.changes.outputs.auth }}
          AUTH_RESULT: ${{ needs.auth.result }}
          REALTIME_REQUIRED: ${{ needs.changes.outputs.realtime }}
          REALTIME_RESULT: ${{ needs.realtime.result }}
          MIGRATION_REQUIRED: ${{ needs.changes.outputs.migration_integration }}
          MIGRATION_RESULT: ${{ needs.migration-integration.result }}
          BROWSER_SMOKE_REQUIRED: ${{ needs.changes.outputs.browser_smoke }}
          BROWSER_SMOKE_RESULT: ${{ needs.backend-browser-smoke.result }}
          OPS_REQUIRED: ${{ needs.changes.outputs.ops }}
          OPS_RESULT: ${{ needs.ops.result }}
          MEDIA_CONTRACT_REQUIRED: 'true'
          MEDIA_CONTRACT_RESULT: ${{ needs.media-contract.result }}
          HANDBOOK_CONTRACT_REQUIRED: 'true'
          HANDBOOK_CONTRACT_RESULT: ${{ needs.handbook-contract.result }}
          PR_SIZE_GUARD_REQUIRED: 'true'
          PR_SIZE_GUARD_RESULT: ${{ needs.pr-size-guard.result }}
        run: ./scripts/ci-gate.sh
