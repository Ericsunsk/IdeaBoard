name: Deploy Existing Production Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Strict SemVer release tag whose immutable manifest should be deployed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment: production
    steps:
      - name: Checkout deployment client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Download release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'release_tag must be a strict SemVer tag such as v1.2.3' >&2
            exit 1
          }
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern release-manifest.json \
            --pattern deployment-bundle.tar \
            --pattern deployment-bundle.sigstore.json \
            --dir release-assets \
            --clobber
          test -s release-assets/release-manifest.json
          test -s release-assets/deployment-bundle.tar
          test -s release-assets/deployment-bundle.sigstore.json

      - name: Deploy immutable Production release
        if: always()
        uses: ./.github/actions/deploy-production
        with:
          prerequisite-status: ${{ job.status }}
          manifest-path: release-assets/release-manifest.json
          bundle-path: release-assets/deployment-bundle.tar
          bundle-signature-path: release-assets/deployment-bundle.sigstore.json
          release-tag: ${{ inputs.release_tag }}
          vps-host: ${{ vars.VPS_HOST }}
          vps-ssh-port: ${{ vars.VPS_SSH_PORT }}
          vps-deploy-user: ${{ vars.VPS_DEPLOY_USER }}
          vps-deploy-private-key: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          vps-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          infisical-token: ${{ secrets.INFISICAL_TOKEN }}
