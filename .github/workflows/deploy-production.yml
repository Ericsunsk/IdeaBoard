name: Deploy Existing Production Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Strict SemVer release tag whose immutable manifest should be deployed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout deployment client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Download release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'release_tag must be a strict SemVer tag such as v1.2.3' >&2
            exit 1
          }
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern release-manifest.json \
            --dir release-assets \
            --clobber
          test -s release-assets/release-manifest.json

      - name: Validate release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          manifest='release-assets/release-manifest.json'
          jq -e \
            --arg expected_tag "${RELEASE_TAG}" \
            --arg expected_ref "refs/tags/${RELEASE_TAG}" \
            --arg expected_repository "${GITHUB_REPOSITORY}" \
            --arg expected_image_repository "ghcr.io/${GITHUB_REPOSITORY,,}" \
            '
              .repository == $expected_repository and
              .tag == $expected_tag and
              .ref == $expected_ref and
              (.commit | type == "string" and test("^[0-9a-f]{40}$")) and
              (.images.api | startswith($expected_image_repository + "/ideaboard-api@sha256:") and test("@sha256:[0-9a-f]{64}$")) and
              (.images["api-migrate"] | startswith($expected_image_repository + "/ideaboard-api-migrate@sha256:") and test("@sha256:[0-9a-f]{64}$")) and
              (.images.auth | startswith($expected_image_repository + "/ideaboard-auth@sha256:") and test("@sha256:[0-9a-f]{64}$")) and
              (.images["auth-migrate"] | startswith($expected_image_repository + "/ideaboard-auth-migrate@sha256:") and test("@sha256:[0-9a-f]{64}$"))
            ' "${manifest}" > /dev/null

      - name: Configure restricted SSH transport
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          VPS_DEPLOY_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required_name in VPS_HOST VPS_SSH_PORT VPS_DEPLOY_USER VPS_DEPLOY_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [[ -n "${!required_name}" ]] || {
              echo "Missing GitHub production Environment value: ${required_name}" >&2
              exit 1
            }
          done
          [[ "${VPS_SSH_PORT}" =~ ^[1-9][0-9]{0,4}$ ]] && ((VPS_SSH_PORT <= 65535))
          [[ "${VPS_DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${VPS_HOST}" =~ ^[A-Za-z0-9._-]+$ ]]

          ssh_dir="${RUNNER_TEMP}/ideaboard-production-ssh"
          install -d -m 700 "${ssh_dir}"
          SSH_KEY_FILE="${ssh_dir}/deploy-key"
          SSH_KNOWN_HOSTS_FILE="${ssh_dir}/known_hosts"
          install -m 600 /dev/null "${SSH_KEY_FILE}"
          install -m 600 /dev/null "${SSH_KNOWN_HOSTS_FILE}"
          printf '%s\n' "${VPS_DEPLOY_PRIVATE_KEY}" > "${SSH_KEY_FILE}"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${SSH_KNOWN_HOSTS_FILE}"

          known_host="${VPS_HOST}"
          if [[ "${VPS_SSH_PORT}" != "22" ]]; then
            known_host="[${VPS_HOST}]:${VPS_SSH_PORT}"
          fi
          ssh-keygen -F "${known_host}" -f "${SSH_KNOWN_HOSTS_FILE}" > /dev/null || {
            echo 'Pinned known_hosts does not contain the configured VPS endpoint' >&2
            exit 1
          }

      - name: Deploy existing immutable release
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/ideaboard-production-ssh/deploy-key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ideaboard-production-ssh/known_hosts
          PRODUCTION_DEPLOY_RESULT_PATH: ${{ runner.temp }}/production-deploy-result.json
        run: ./scripts/run-production-deploy.sh release-assets/release-manifest.json

      - name: Remove SSH credentials
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/ideaboard-production-ssh"

      - name: Write deployment summary
        if: always()
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/production-deploy-result.json"
          failed_stage='not-started'
          recovery_hint='review_failed_workflow_step'
          if [[ -s "${result_file}" ]] && jq -e 'type == "object" and (.result | strings) and (.stage | strings) and (.recovery_hint | strings)' "${result_file}" > /dev/null 2>&1; then
            failed_stage="$(jq -r 'if .result == "success" then "none" else .stage end' "${result_file}")"
            recovery_hint="$(jq -r '.recovery_hint' "${result_file}")"
          fi
          {
            echo '### Existing Production release deployment'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Result | \`${RESULT}\` |"
            echo "| Tag | \`${RELEASE_TAG}\` |"
            echo "| Failed stage | \`${failed_stage}\` |"
            echo "| Recovery hint | \`${recovery_hint}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
