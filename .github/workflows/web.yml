name: Web

on:
  workflow_call:
    inputs:
      audit_dependencies:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Web Quality
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: apps/web/package-lock.json
      - uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/web
      - name: Generated API drift
        working-directory: apps/web
        run: npm run api:generate && git diff --exit-code -- src/shared/api/generated-query
      - name: ESLint
        working-directory: apps/web
        run: npm run lint
      - name: Stylelint
        working-directory: apps/web
        run: npm run lint:style
      - name: Test typecheck
        working-directory: apps/web
        run: npm run test:typecheck
      - name: Production dependency audit
        if: inputs.audit_dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: apps/web
        run: npm run build
  unit:
    name: Web Unit (${{ matrix.shard }})
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: apps/web/package-lock.json
      - uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/web
      - name: Unit tests
        working-directory: apps/web
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: npm run test:run -- --shard="${TEST_SHARD}"
  smoke:
    name: Web Browser Smoke
    runs-on: ubicloud-standard-2
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: apps/web/package-lock.json
      - uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/web
      - name: Browser smoke
        run: ./scripts/ci-parity.sh web-smoke
