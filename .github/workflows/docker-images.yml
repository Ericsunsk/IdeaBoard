name: Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or strict SemVer tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  GRYPE_LOG_QUIET: 'true'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

concurrency:
  group: docker-images-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  preflight:
    name: Release Eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source commit and CI Gate
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: ./scripts/release-eligibility-check.sh >> "${GITHUB_OUTPUT}"

      - name: Plan component images
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.validate.outputs.source_commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          ./scripts/prepare-release-plan.sh release-plan.json
          echo "matrix=$(jq -c '.matrix' release-plan.json)" >> "${GITHUB_OUTPUT}"

      - name: Upload component image plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 3

  publish-images:
    name: Publish ${{ matrix.display }} Image
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Download component image plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan
          path: .

      - name: Prepare image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.name }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "immutable_tag=ghcr.io/${repository}/ideaboard-${IMAGE_NAME}:sha-${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: matrix.action == 'build'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        if: matrix.action == 'build'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: matrix.action == 'build'
        id: build
        timeout-minutes: 25
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.immutable_tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true

      - name: Resolve immutable component image
        id: resolved
        shell: bash
        env:
          COMPONENT_ACTION: ${{ matrix.action }}
          REUSED_IMAGE: ${{ matrix.image }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "${COMPONENT_ACTION}" == reuse ]]; then
            image="${REUSED_IMAGE}"
          else
            image="${IMAGE_NAME}@${BUILT_DIGEST}"
          fi
          [[ "${image}" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "ref=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${image##*@}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        timeout-minutes: 5
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify reused component signature
        if: matrix.action == 'reuse'
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.resolved.outputs.ref }}
          CERTIFICATE_IDENTITY: ${{ matrix.certificate_identity }}
          CERTIFICATE_ISSUER: ${{ matrix.certificate_oidc_issuer }}
        run: cosign verify --certificate-identity "${CERTIFICATE_IDENTITY}" --certificate-oidc-issuer "${CERTIFICATE_ISSUER}" "${IMAGE}" > /dev/null

      - name: Prepare release asset directory
        run: mkdir -p release-assets

      - name: Set up Grype
        timeout-minutes: 5
        uses: ./.github/actions/setup-grype

      - name: Prepare Grype database cache key
        id: grype-cache
        shell: bash
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"

      - name: Cache Grype vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grype-db
          lookup-only: true
          key: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-${{ steps.grype-cache.outputs.date }}
          restore-keys: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-

      - name: Update Grype vulnerability database
        timeout-minutes: 5
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: grype db update

      - name: Scan linux/arm64 image
        timeout-minutes: 10
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_AUTO_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          IMAGE: ${{ steps.resolved.outputs.ref }}
        run: grype "registry:${IMAGE}" --platform linux/arm64 --config .grype.yaml --fail-on high --output table

      - name: Sign image digest
        if: matrix.action == 'build'
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.resolved.outputs.ref }}
        run: cosign sign --yes "${IMAGE}"

      - name: Write image metadata
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.resolved.outputs.digest }}
          IMAGE_KEY: ${{ matrix.name }}
          COMPONENT_ACTION: ${{ matrix.action }}
        run: |
          args=(--plan release-plan.json --component "${IMAGE_KEY}" --output "release-assets/${IMAGE_KEY}.json")
          if [[ "${COMPONENT_ACTION}" == build ]]; then
            args+=(--digest "${IMAGE_DIGEST}")
          fi
          python3 scripts/release-artifacts.py metadata "${args[@]}"

      - name: Upload image release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ideaboard-${{ matrix.name }}-release-metadata
          path: release-assets
          if-no-files-found: error
          retention-days: 3

  aggregate-release-manifest:
    name: Build Release Manifest
    needs:
      - publish-images
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      is-production-release: ${{ steps.production-release.outputs.is-production-release }}

    steps:
      - name: Checkout manifest implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download component image plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan
          path: .

      - name: Download image release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ideaboard-*-release-metadata
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest
        shell: bash
        run: |
          python3 scripts/release-artifacts.py manifest --plan release-plan.json \
            --metadata-dir release-assets --output release-assets/release-manifest.json

      - name: Classify Production release
        id: production-release
        shell: bash
        run: |
          is_production_release=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
            [[ "${GITHUB_REF_TYPE}" == "tag" ]] && \
            [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            is_production_release=true
          fi
          echo "is-production-release=${is_production_release}" >> "${GITHUB_OUTPUT}"

      - name: Upload release metadata bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest
          path: release-assets/release-manifest.json
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    name: Deploy Production
    if: needs.aggregate-release-manifest.outputs.is-production-release == 'true'
    needs:
      - aggregate-release-manifest
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout deployment client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Download release metadata bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release-assets

      - name: Deploy immutable Production release
        if: always()
        timeout-minutes: 30
        uses: ./.github/actions/deploy-production
        with:
          prerequisite-status: ${{ job.status }}
          manifest-path: release-assets/release-manifest.json
          release-tag: ${{ github.ref_name }}
          source-commit: ${{ needs.preflight.outputs.source_commit }}
          vps-host: ${{ vars.VPS_HOST }}
          vps-ssh-port: ${{ vars.VPS_SSH_PORT }}
          vps-deploy-user: ${{ vars.VPS_DEPLOY_USER }}
          vps-deploy-private-key: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          vps-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          infisical-token: ${{ secrets.INFISICAL_TOKEN }}

  publish-release-assets:
    name: Publish Image Release Assets
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - aggregate-release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release metadata bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release-assets

      - name: Upload image metadata to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release-assets/release-manifest.json
          fail_on_unmatched_files: true

  measurements:
    name: Release Measurements
    if: always()
    needs: [preflight, publish-images, aggregate-release-manifest, deploy-production, publish-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout measurement implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Report release and deployment measurements
        uses: ./.github/actions/pipeline-metrics
