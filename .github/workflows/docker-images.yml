name: Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "apps/api/**"
      - "apps/auth/**"
      - "docker/**"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra image tag, for example prod or v0.1.0"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test API
        working-directory: apps/api
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: apps/auth/package-lock.json

      - name: Build Auth
        working-directory: apps/auth
        run: |
          npm ci
          npm run build

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${repository}/ideaboard-api" >> "$GITHUB_OUTPUT"
          echo "auth=ghcr.io/${repository}/ideaboard-auth" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.api }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=ideaboard-api
          cache-to: type=gha,mode=max,scope=ideaboard-api

      - name: Auth image metadata
        id: auth-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.auth }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and push Auth image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/auth
          file: ./apps/auth/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.auth-meta.outputs.tags }}
          labels: ${{ steps.auth-meta.outputs.labels }}
          cache-from: type=gha,scope=ideaboard-auth
          cache-to: type=gha,mode=max,scope=ideaboard-auth
