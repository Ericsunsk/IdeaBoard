name: Docker Images

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/auth/**"
      - "docker/**"
      - ".grype.yaml"
      - ".github/workflows/docker-images.yml"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "apps/api/**"
      - "apps/auth/**"
      - "docker/**"
      - ".grype.yaml"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra image tag, for example prod or v0.1.0"
        required: false
        type: string

permissions:
  contents: read

env:
  GRYPE_LOG_QUIET: "true"

concurrency:
  group: docker-images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test API
        working-directory: apps/api
        run: go test ./...

      - name: Test API with race detector
        working-directory: apps/api
        run: go test -race ./...

      - name: Lint API
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/api

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: apps/auth/package-lock.json

      - name: Build Auth
        working-directory: apps/auth
        run: |
          npm ci --omit=optional --no-audit --fund=false
          npm run build

  build-pr-images:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            cache_scope: ideaboard-api
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            cache_scope: ideaboard-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build ${{ matrix.image.display }} image
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}

  publish-images:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            cache_scope: ideaboard-api
            sbom_file: api.sbom.cyclonedx.json
            sbom_artifact: ideaboard-api-sbom-cyclonedx-json
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            cache_scope: ideaboard-auth
            sbom_file: auth.sbom.cyclonedx.json
            sbom_artifact: ideaboard-auth-sbom-cyclonedx-json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and push ${{ matrix.image.display }} image
        id: build
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache_scope }}

      - name: Generate ${{ matrix.image.display }} SBOM
        timeout-minutes: 10
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.image.sbom_file }}
          artifact-name: ${{ matrix.image.sbom_artifact }}
          upload-release-assets: false

      - name: Scan ${{ matrix.image.display }} image
        timeout-minutes: 10
        uses: anchore/scan-action@v7.4.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          config: .grype.yaml
          cache-db: true
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table

      - name: Install Cosign
        timeout-minutes: 5
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign ${{ matrix.image.display }} image
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"
