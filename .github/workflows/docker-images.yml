name: Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or strict SemVer tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  GRYPE_LOG_QUIET: 'true'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

concurrency:
  group: docker-images-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  preflight:
    name: Release Eligibility
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      checks: read
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Verify source commit and CI Gate
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "${REQUESTED_REF}" =~ ^v ]]; then
            [[ "${REQUESTED_REF}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$(git rev-parse "refs/tags/${REQUESTED_REF}^{commit}")" == "${source_commit}" ]]
          else
            [[ "${REQUESTED_REF}" =~ ^[0-9a-f]{40}$ ]]
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${source_commit}" origin/main
          successful_gate_count="$(gh api --paginate --slurp -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${source_commit}/check-runs?per_page=100" | jq '[.[].check_runs[] | select(.name == "CI Gate" and .conclusion == "success")] | length')"
          [[ "${successful_gate_count}" -ge 1 ]]
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"

  publish-images:
    name: Publish ${{ matrix.image.display }} Image
    needs:
      - preflight
    runs-on: ubicloud-standard-2
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: runtime
            cache_scope: ideaboard-api
          - name: api-migrate
            display: API Migration
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: migrator
            cache_scope: ideaboard-api-migrate
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: runtime
            cache_scope: ideaboard-auth
          - name: auth-migrate
            display: Auth Migration
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: migrator
            cache_scope: ideaboard-auth-migrate

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}" >> "${GITHUB_OUTPUT}"
          echo "immutable_tag=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}:sha-${{ needs.preflight.outputs.source_commit }}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        timeout-minutes: 25
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.immutable_tag }}
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache_scope }}
          provenance: mode=max
          sbom: true

      - name: Prepare release asset directory
        run: mkdir -p release-assets

      - name: Set up Grype
        timeout-minutes: 5
        uses: ./.github/actions/setup-grype

      - name: Prepare Grype database cache key
        id: grype-cache
        shell: bash
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"

      - name: Cache Grype vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grype-db
          key: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-${{ steps.grype-cache.outputs.date }}
          restore-keys: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-

      - name: Update Grype vulnerability database
        timeout-minutes: 5
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: grype db update

      - name: Scan linux/arm64 image
        timeout-minutes: 10
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_AUTO_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: grype "registry:${IMAGE}" --platform linux/arm64 --config .grype.yaml --fail-on high --output table

      - name: Install Cosign
        timeout-minutes: 5
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image digest
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      - name: Write image metadata
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KEY: ${{ matrix.image.name }}
        run: |
          jq -n \
            --arg name "${IMAGE_KEY}" \
            --arg image "${IMAGE_NAME}" \
            --arg digest "${IMAGE_DIGEST}" \
            '{
              name: $name,
              image: $image,
              digest: $digest,
              ref: ($image + "@" + $digest)
            }' > "release-assets/${IMAGE_KEY}.json"

          {
            echo "### ${{ matrix.image.display }} image"
            echo '```text'
            echo "${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ideaboard-${{ matrix.image.name }}-release-metadata
          path: release-assets
          if-no-files-found: error
          retention-days: 3

  aggregate-release-manifest:
    name: Build Release Manifest
    needs:
      - publish-images
      - preflight
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      is-production-release: ${{ steps.production-release.outputs.is-production-release }}

    steps:
      - name: Download image release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ideaboard-*-release-metadata
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest
        shell: bash
        run: |
          for image in api api-migrate auth auth-migrate; do
            test -s "release-assets/${image}.json" || {
              echo "Missing metadata for ${image}" >&2
              exit 1
            }
          done

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg commit "${{ needs.preflight.outputs.source_commit }}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg workflow "docker-images.yml" \
            --arg cosign_identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@${GITHUB_REF}" \
            --arg cosign_issuer "https://token.actions.githubusercontent.com" \
            --slurpfile api release-assets/api.json \
            --slurpfile api_migrate release-assets/api-migrate.json \
            --slurpfile auth release-assets/auth.json \
            --slurpfile auth_migrate release-assets/auth-migrate.json \
            '{
              repository: $repository,
              tag: $tag,
              ref: $ref,
              commit: $commit,
              workflow: {
                name: $workflow,
                run_id: $run_id
              },
              images: {
                api: $api[0].ref,
                "api-migrate": $api_migrate[0].ref,
                auth: $auth[0].ref,
                "auth-migrate": $auth_migrate[0].ref
              },
              cosign: {
                certificate_identity: $cosign_identity,
                certificate_oidc_issuer: $cosign_issuer
              }
            }' > release-assets/release-manifest.json

          {
            echo '### Release manifest'
            echo '```json'
            cat release-assets/release-manifest.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Classify Production release
        id: production-release
        shell: bash
        run: |
          is_production_release=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
            [[ "${GITHUB_REF_TYPE}" == "tag" ]] && \
            [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            is_production_release=true
          fi
          echo "is-production-release=${is_production_release}" >> "${GITHUB_OUTPUT}"

      - name: Upload release metadata bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest
          path: release-assets/release-manifest.json
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    name: Deploy Production
    if: needs.aggregate-release-manifest.outputs.is-production-release == 'true'
    needs:
      - aggregate-release-manifest
      - preflight
    runs-on: ubicloud-standard-2
    timeout-minutes: 35
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout deployment client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Download release metadata bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release-assets

      - name: Validate Production release manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest="release-assets/release-manifest.json"
          test -s "${manifest}"
          jq -e \
            --arg expected_tag "${GITHUB_REF_NAME}" \
            --arg expected_commit "${{ needs.preflight.outputs.source_commit }}" \
            --arg expected_ref "${GITHUB_REF}" \
            --arg expected_repository "${GITHUB_REPOSITORY}" \
            --arg expected_image_repository "ghcr.io/${GITHUB_REPOSITORY,,}" \
            '
              .repository == $expected_repository and
              .tag == $expected_tag and
              .commit == $expected_commit and
              .ref == $expected_ref and
              (.images.api |
                startswith($expected_image_repository + "/ideaboard-api@sha256:") and
                test("@sha256:[0-9a-f]{64}$")) and
              (.images["api-migrate"] |
                startswith($expected_image_repository + "/ideaboard-api-migrate@sha256:") and
                test("@sha256:[0-9a-f]{64}$")) and
              (.images.auth |
                startswith($expected_image_repository + "/ideaboard-auth@sha256:") and
                test("@sha256:[0-9a-f]{64}$")) and
              (.images["auth-migrate"] |
                startswith($expected_image_repository + "/ideaboard-auth-migrate@sha256:") and
                test("@sha256:[0-9a-f]{64}$"))
            ' "${manifest}" > /dev/null

      - name: Configure restricted SSH transport
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          VPS_DEPLOY_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for required_name in VPS_HOST VPS_SSH_PORT VPS_DEPLOY_USER VPS_DEPLOY_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [[ -n "${!required_name}" ]] || {
              echo "Missing GitHub production Environment value: ${required_name}" >&2
              exit 1
            }
          done
          [[ "${VPS_SSH_PORT}" =~ ^[1-9][0-9]{0,4}$ ]] && ((VPS_SSH_PORT <= 65535))
          [[ "${VPS_DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${VPS_HOST}" =~ ^[A-Za-z0-9._-]+$ ]]

          ssh_dir="${RUNNER_TEMP}/ideaboard-production-ssh"
          install -d -m 700 "${ssh_dir}"
          SSH_KEY_FILE="${ssh_dir}/deploy-key"
          SSH_KNOWN_HOSTS_FILE="${ssh_dir}/known_hosts"
          install -m 600 /dev/null "${SSH_KEY_FILE}"
          install -m 600 /dev/null "${SSH_KNOWN_HOSTS_FILE}"
          printf '%s\n' "${VPS_DEPLOY_PRIVATE_KEY}" > "${SSH_KEY_FILE}"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${SSH_KNOWN_HOSTS_FILE}"

          known_host="${VPS_HOST}"
          if [[ "${VPS_SSH_PORT}" != "22" ]]; then
            known_host="[${VPS_HOST}]:${VPS_SSH_PORT}"
          fi
          ssh-keygen -F "${known_host}" -f "${SSH_KNOWN_HOSTS_FILE}" > /dev/null || {
            echo 'Pinned known_hosts does not contain the configured VPS endpoint' >&2
            exit 1
          }

      - name: Stream manifest to Production deploy entrypoint
        id: deploy
        timeout-minutes: 30
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/ideaboard-production-ssh/deploy-key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ideaboard-production-ssh/known_hosts
          PRODUCTION_DEPLOY_RESULT_PATH: ${{ runner.temp }}/production-deploy-result.json
        run: |
          set -euo pipefail
          ./scripts/run-production-deploy.sh release-assets/release-manifest.json

      - name: Remove SSH credentials
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/ideaboard-production-ssh"

      - name: Write Production deployment summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail

          manifest="release-assets/release-manifest.json"
          deployment_result_file="${RUNNER_TEMP}/production-deploy-result.json"
          digest_or_unavailable() {
            jq -er --arg image "$1" \
              '.images[$image] | capture("@(?<digest>sha256:[0-9a-f]{64})$").digest' \
              "${manifest}" 2> /dev/null || printf 'unavailable\n'
          }

          api_digest="$(digest_or_unavailable api)"
          api_migrate_digest="$(digest_or_unavailable api-migrate)"
          auth_digest="$(digest_or_unavailable auth)"
          auth_migrate_digest="$(digest_or_unavailable auth-migrate)"
          failed_stage='not-started'
          recovery_hint='review_failed_workflow_step'
          if jq -e '
            (.result == "success" or .result == "failure")
            and (.stage | strings)
            and (.recovery_hint | strings)
          ' "${deployment_result_file}" > /dev/null 2>&1; then
            failed_stage="$(jq -r 'if .result == "success" then "none" else .stage end' "${deployment_result_file}")"
            recovery_hint="$(jq -r '.recovery_hint' "${deployment_result_file}")"
          fi
          {
            echo '### Production deployment'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Result | \`${RESULT}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| API digest | \`${api_digest}\` |"
            echo "| API migration digest | \`${api_migrate_digest}\` |"
            echo "| Auth digest | \`${auth_digest}\` |"
            echo "| Auth migration digest | \`${auth_migrate_digest}\` |"
            echo "| Failed stage | \`${failed_stage}\` |"
            echo "| Recovery hint | \`${recovery_hint}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-release-assets:
    name: Publish Image Release Assets
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - aggregate-release-manifest
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release metadata bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release-assets

      - name: Upload image metadata to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release-assets/release-manifest.json
          fail_on_unmatched_files: true
