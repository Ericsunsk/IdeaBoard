name: Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'apps/api/**'
      - 'apps/auth/**'
      - 'contracts/auth-internal.openapi.json'
      - 'docker/**'
      - '.grype.yaml'
      - '.grype-version'
      - '.grype-checksums'
      - '.github/actions/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/docker-images.yml'
      - '.node-version'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional extra image tag, for example prod or v0.1.0
        required: false
        type: string

permissions:
  contents: read

env:
  GRYPE_LOG_QUIET: 'true'

concurrency:
  group: docker-images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Verification
    uses: ./.github/workflows/backend.yml
    with:
      build_images: false

  publish-images:
    name: Publish ${{ matrix.image.display }} Image
    needs:
      - backend-verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: runtime
            cache_scope: ideaboard-api
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: runtime
            cache_scope: ideaboard-auth
          - name: auth-migrate
            display: Auth Migration
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: migrator
            cache_scope: ideaboard-auth-migrate

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}" >> "${GITHUB_OUTPUT}"
          echo "immutable_tag=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and push image
        id: build
        timeout-minutes: 25
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.immutable_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache_scope }}
          provenance: mode=max
          sbom: true

      - name: Prepare release asset directory
        run: mkdir -p release-assets

      - name: Generate linux/amd64 SBOM
        timeout-minutes: 10
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: release-assets/${{ matrix.image.name }}-linux-amd64.sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate linux/arm64 SBOM
        timeout-minutes: 10
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: release-assets/${{ matrix.image.name }}-linux-arm64.sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Set up Grype
        timeout-minutes: 5
        uses: ./.github/actions/setup-grype

      - name: Prepare Grype database cache key
        id: grype-cache
        shell: bash
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"

      - name: Cache Grype vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grype-db
          key: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-${{ steps.grype-cache.outputs.date }}
          restore-keys: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-

      - name: Update Grype vulnerability database
        timeout-minutes: 5
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: grype db update

      - name: Scan linux/amd64 image
        timeout-minutes: 10
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_AUTO_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: grype "registry:${IMAGE}" --platform linux/amd64 --config .grype.yaml --fail-on high --output table

      - name: Scan linux/arm64 image
        timeout-minutes: 10
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_AUTO_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: grype "registry:${IMAGE}" --platform linux/arm64 --config .grype.yaml --fail-on high --output table

      - name: Install Cosign
        timeout-minutes: 5
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image digest
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      - name: Publish verified image aliases
        timeout-minutes: 5
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          mapfile -t tags <<< "${TAGS}"
          tag_args=()
          for tag in "${tags[@]}"; do
            [[ -n "${tag}" ]] && tag_args+=(--tag "${tag}")
          done
          ((${#tag_args[@]} > 0))

          for attempt in 1 2 3; do
            if docker buildx imagetools create "${tag_args[@]}" "${IMAGE}"; then
              exit 0
            fi
            if [[ "${attempt}" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Write image metadata
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KEY: ${{ matrix.image.name }}
          SBOM_AMD64_FILE: ${{ matrix.image.name }}-linux-amd64.sbom.cyclonedx.json
          SBOM_ARM64_FILE: ${{ matrix.image.name }}-linux-arm64.sbom.cyclonedx.json
        run: |
          jq -n \
            --arg name "${IMAGE_KEY}" \
            --arg image "${IMAGE_NAME}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg sbom_amd64_file "${SBOM_AMD64_FILE}" \
            --arg sbom_arm64_file "${SBOM_ARM64_FILE}" \
            '{
              name: $name,
              image: $image,
              digest: $digest,
              ref: ($image + "@" + $digest),
              sbom_files: {
                "linux/amd64": $sbom_amd64_file,
                "linux/arm64": $sbom_arm64_file
              }
            }' > "release-assets/${IMAGE_KEY}.json"

          {
            echo "### ${{ matrix.image.display }} image"
            echo '```text'
            echo "${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ideaboard-${{ matrix.image.name }}-release-metadata
          path: release-assets
          if-no-files-found: error
          retention-days: 90

  aggregate-release-manifest:
    name: Build Release Manifest
    needs:
      - publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download image release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ideaboard-*-release-metadata
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest
        shell: bash
        run: |
          for image in api auth auth-migrate; do
            test -s "release-assets/${image}.json" || {
              echo "Missing metadata for ${image}" >&2
              exit 1
            }
          done

          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg workflow "docker-images.yml" \
            --arg cosign_identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@${GITHUB_REF}" \
            --arg cosign_issuer "https://token.actions.githubusercontent.com" \
            --slurpfile api release-assets/api.json \
            --slurpfile auth release-assets/auth.json \
            --slurpfile auth_migrate release-assets/auth-migrate.json \
            '{
              tag: $tag,
              ref: $ref,
              commit: $commit,
              workflow: {
                name: $workflow,
                run_id: $run_id
              },
              images: {
                api: $api[0].ref,
                auth: $auth[0].ref,
                "auth-migrate": $auth_migrate[0].ref
              },
              sbom_files: {
                api: $api[0].sbom_files,
                auth: $auth[0].sbom_files,
                "auth-migrate": $auth_migrate[0].sbom_files
              },
              cosign: {
                certificate_identity: $cosign_identity,
                certificate_oidc_issuer: $cosign_issuer
              }
            }' > release-assets/release-manifest.json

          {
            echo '### Release manifest'
            echo '```json'
            cat release-assets/release-manifest.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release metadata bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest
          path: |
            release-assets/release-manifest.json
            release-assets/*.sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 90

  publish-release-assets:
    name: Publish Image Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - aggregate-release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release metadata bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release-assets

      - name: Upload image metadata to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            release-assets/release-manifest.json
            release-assets/*.sbom.cyclonedx.json
          fail_on_unmatched_files: true
