name: Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or strict SemVer tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  GRYPE_LOG_QUIET: 'true'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

concurrency:
  group: docker-images-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  preflight:
    name: Release Eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source commit and CI Gate
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: ./scripts/release-eligibility-check.sh >> "${GITHUB_OUTPUT}"

  publish-images:
    name: Publish ${{ matrix.image.display }} Image
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: runtime
            cache_scope: ideaboard-api
          - name: api-migrate
            display: API Migration
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: migrator
            cache_scope: ideaboard-api-migrate
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: runtime
            cache_scope: ideaboard-auth
          - name: auth-migrate
            display: Auth Migration
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: migrator
            cache_scope: ideaboard-auth-migrate
          - name: realtime
            display: Realtime
            context: ./apps/realtime
            file: ./apps/realtime/Dockerfile
            target: runtime
            cache_scope: ideaboard-realtime

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Prepare image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "immutable_tag=ghcr.io/${repository}/ideaboard-${IMAGE_NAME}:sha-${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        timeout-minutes: 25
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.immutable_tag }}
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache_scope }}
          provenance: mode=max
          sbom: true

      - name: Prepare release asset directory
        run: mkdir -p release-assets

      - name: Set up Grype
        timeout-minutes: 5
        uses: ./.github/actions/setup-grype

      - name: Prepare Grype database cache key
        id: grype-cache
        shell: bash
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"

      - name: Cache Grype vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grype-db
          lookup-only: true
          key: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-${{ steps.grype-cache.outputs.date }}
          restore-keys: grype-db-v6-${{ runner.os }}-${{ hashFiles('.grype-version') }}-

      - name: Update Grype vulnerability database
        timeout-minutes: 5
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: grype db update

      - name: Scan linux/arm64 image
        timeout-minutes: 10
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_AUTO_UPDATE: 'false'
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: grype "registry:${IMAGE}" --platform linux/arm64 --config .grype.yaml --fail-on high --output table

      - name: Install Cosign
        timeout-minutes: 5
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image digest
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      - name: Write image metadata
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KEY: ${{ matrix.image.name }}
        run: |
          jq -n \
            --arg name "${IMAGE_KEY}" \
            --arg image "${IMAGE_NAME}" \
            --arg digest "${IMAGE_DIGEST}" \
            '{
              name: $name,
              image: $image,
              digest: $digest,
              ref: ($image + "@" + $digest)
            }' > "release-assets/${IMAGE_KEY}.json"

          {
            echo "### ${{ matrix.image.display }} image"
            echo '```text'
            echo "${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ideaboard-${{ matrix.image.name }}-release-metadata
          path: release-assets
          if-no-files-found: error
          retention-days: 3

  aggregate-release-manifest:
    name: Build Release Manifest
    needs:
      - publish-images
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      is-production-release: ${{ steps.production-release.outputs.is-production-release }}

    steps:
      - name: Download image release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ideaboard-*-release-metadata
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          for image in api api-migrate auth auth-migrate realtime; do
            test -s "release-assets/${image}.json" || {
              echo "Missing metadata for ${image}" >&2
              exit 1
            }
          done

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg commit "${SOURCE_COMMIT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg workflow "docker-images.yml" \
            --arg cosign_identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@${GITHUB_REF}" \
            --arg cosign_issuer "https://token.actions.githubusercontent.com" \
            --slurpfile api release-assets/api.json \
            --slurpfile api_migrate release-assets/api-migrate.json \
            --slurpfile auth release-assets/auth.json \
            --slurpfile auth_migrate release-assets/auth-migrate.json \
            --slurpfile realtime release-assets/realtime.json \
            '{
              repository: $repository,
              tag: $tag,
              ref: $ref,
              commit: $commit,
              workflow: {
                name: $workflow,
                run_id: $run_id
              },
              images: {
                api: $api[0].ref,
                "api-migrate": $api_migrate[0].ref,
                auth: $auth[0].ref,
                "auth-migrate": $auth_migrate[0].ref,
                realtime: $realtime[0].ref
              },
              cosign: {
                certificate_identity: $cosign_identity,
                certificate_oidc_issuer: $cosign_issuer
              }
            }' > release-assets/release-manifest.json

          {
            echo '### Release manifest'
            echo '```json'
            cat release-assets/release-manifest.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Classify Production release
        id: production-release
        shell: bash
        run: |
          is_production_release=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
            [[ "${GITHUB_REF_TYPE}" == "tag" ]] && \
            [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            is_production_release=true
          fi
          echo "is-production-release=${is_production_release}" >> "${GITHUB_OUTPUT}"

      - name: Upload release metadata bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest
          path: release-assets/release-manifest.json
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    name: Deploy Production
    if: needs.aggregate-release-manifest.outputs.is-production-release == 'true'
    needs:
      - aggregate-release-manifest
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout deployment client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Download release metadata bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release-assets

      - name: Deploy immutable Production release
        if: always()
        timeout-minutes: 30
        uses: ./.github/actions/deploy-production
        with:
          prerequisite-status: ${{ job.status }}
          manifest-path: release-assets/release-manifest.json
          release-tag: ${{ github.ref_name }}
          source-commit: ${{ needs.preflight.outputs.source_commit }}
          vps-host: ${{ vars.VPS_HOST }}
          vps-ssh-port: ${{ vars.VPS_SSH_PORT }}
          vps-deploy-user: ${{ vars.VPS_DEPLOY_USER }}
          vps-deploy-private-key: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          vps-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          infisical-token: ${{ secrets.INFISICAL_TOKEN }}

  publish-release-assets:
    name: Publish Image Release Assets
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - aggregate-release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release metadata bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release-assets

      - name: Upload image metadata to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release-assets/release-manifest.json
          fail_on_unmatched_files: true
