name: Docker Images

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/auth/**"
      - "contracts/auth-internal.openapi.json"
      - "docker/**"
      - ".grype.yaml"
      - ".github/workflows/docker-images.yml"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "apps/api/**"
      - "apps/auth/**"
      - "contracts/auth-internal.openapi.json"
      - "docker/**"
      - ".grype.yaml"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra image tag, for example prod or v0.1.0"
        required: false
        type: string

permissions:
  contents: read

env:
  GRYPE_LOG_QUIET: "true"

concurrency:
  group: docker-images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  api-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check sqlc generated code
        working-directory: apps/api
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/db/sqlc

  api-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test API migrations
        working-directory: apps/api
        run: go test ./internal/db/migrations -run TestMigrations -count=1

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode:
          - standard
          - race
        shard:
          - 0
          - 1
          - 2

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test API (${{ matrix.mode }} shard ${{ matrix.shard }})
        shell: bash
        working-directory: apps/api
        env:
          TEST_MODE: ${{ matrix.mode }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: "3"
        run: |
          mapfile -t packages < <(
            go list ./... | awk \
              -v shard="${TEST_SHARD}" \
              -v total="${TEST_SHARD_COUNT}" \
              '((NR - 1) % total) == shard'
          )

          printf 'Running %s tests for shard %s/%s:\n' \
            "${TEST_MODE}" "${TEST_SHARD}" "${TEST_SHARD_COUNT}"
          printf '  %s\n' "${packages[@]}"

          if [ "${TEST_MODE}" = "race" ]; then
            go test -race "${packages[@]}"
          else
            go test "${packages[@]}"
          fi

  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        check:
          - vulnerability
          - lint

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Go vulnerability check
        if: matrix.check == 'vulnerability'
        working-directory: apps/api
        run: go tool govulncheck ./...

      - name: Lint API
        if: matrix.check == 'lint'
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
        with:
          version: v2.12.2
          working-directory: apps/api
          args: ./...

  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: apps/auth/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test and build Auth
        working-directory: apps/auth
        run: |
          npm ci --omit=optional --no-audit --fund=false
          npm test
          npm run build

      - name: Create migration smoke runtime roles
        shell: bash
        env:
          API_DB_PASSWORD: ideaboard_api_test
          AUTH_DB_PASSWORD: ideaboard_auth_test
        run: |
          postgres_container="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "${postgres_container}"
          docker cp docker/postgres/init-runtime-roles.sh "${postgres_container}:/tmp/init-runtime-roles.sh"
          docker exec \
            -e POSTGRES_USER=ideaboard \
            -e POSTGRES_DB=ideaboard_test \
            -e API_DB_PASSWORD="${API_DB_PASSWORD}" \
            -e AUTH_DB_PASSWORD="${AUTH_DB_PASSWORD}" \
            "${postgres_container}" \
            sh /tmp/init-runtime-roles.sh

      - name: Smoke API then Auth migrations
        shell: bash
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          API_DB_USER: ideaboard_api
          API_DB_PASSWORD: ideaboard_api_test
          AUTH_DB_USER: ideaboard_auth
          AUTH_DB_PASSWORD: ideaboard_auth_test
          DB_MIGRATION_USER: ideaboard
          DB_MIGRATION_PASSWORD: ideaboard_test
          DB_NAME: ideaboard_test
          DB_SSLMODE: disable
          AUTH_INTERNAL_KEY: 0123456789abcdef0123456789abcdef
          APP_SECRETS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AUTH_TRUSTED_ORIGINS: https://app.example.com
          BETTER_AUTH_SECRET: abcdef0123456789abcdef0123456789
          BETTER_AUTH_URL: https://api.example.com
          NODE_ENV: production
        run: |
          (cd apps/api && env DB_USER="${API_DB_USER}" DB_PASSWORD="${API_DB_PASSWORD}" go run ./cmd migrate)
          (cd apps/auth && env DB_USER="${AUTH_DB_USER}" DB_PASSWORD="${AUTH_DB_PASSWORD}" npm run migrate:dist)
          (cd apps/api && env DB_USER="${API_DB_USER}" DB_PASSWORD="${API_DB_PASSWORD}" go run ./cmd migrate)
          (cd apps/auth && env DB_USER="${AUTH_DB_USER}" DB_PASSWORD="${AUTH_DB_PASSWORD}" npm run migrate:dist)

  verify:
    if: always()
    needs:
      - api-generated
      - api-migrations
      - api-tests
      - api-quality
      - auth
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required checks
        if: >-
          ${{
            needs.api-generated.result != 'success' ||
            needs.api-migrations.result != 'success' ||
            needs.api-tests.result != 'success' ||
            needs.api-quality.result != 'success' ||
            needs.auth.result != 'success'
          }}
        run: exit 1

  build-pr-images:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: runtime
            cache_scope: ideaboard-api
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: runtime
            cache_scope: ideaboard-auth
          - name: auth-migrate
            display: Auth Migration
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: migrator
            cache_scope: ideaboard-auth-migrate

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build ${{ matrix.image.display }} image
        timeout-minutes: 20
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache_scope }}

  publish-images:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: runtime
            cache_scope: ideaboard-api
            sbom_file: api.sbom.cyclonedx.json
            sbom_artifact: ideaboard-api-sbom-cyclonedx-json
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: runtime
            cache_scope: ideaboard-auth
            sbom_file: auth.sbom.cyclonedx.json
            sbom_artifact: ideaboard-auth-sbom-cyclonedx-json
          - name: auth-migrate
            display: Auth Migration
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: migrator
            cache_scope: ideaboard-auth-migrate
            sbom_file: auth-migrate.sbom.cyclonedx.json
            sbom_artifact: ideaboard-auth-migrate-sbom-cyclonedx-json

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and push ${{ matrix.image.display }} image
        id: build
        timeout-minutes: 20
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache_scope }}

      - name: Generate ${{ matrix.image.display }} SBOM
        timeout-minutes: 10
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.image.sbom_file }}
          artifact-name: ${{ matrix.image.sbom_artifact }}
          upload-release-assets: false

      - name: Scan ${{ matrix.image.display }} image
        timeout-minutes: 10
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        env:
          GRYPE_PLATFORM: linux/amd64
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          config: .grype.yaml
          cache-db: true
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Install Cosign
        timeout-minutes: 5
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign ${{ matrix.image.display }} image
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      - name: Print deploy image reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          echo "${{ matrix.image.display }} image: ${IMAGE}"
          echo "### ${{ matrix.image.display }} image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Write ${{ matrix.image.display }} digest metadata
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KEY: ${{ matrix.image.name }}
          SBOM_ARTIFACT: ${{ matrix.image.sbom_artifact }}
        run: |
          mkdir -p image-digests
          cat > "image-digests/${IMAGE_KEY}.json" <<EOF
          {
            "name": "${IMAGE_KEY}",
            "image": "${IMAGE_NAME}",
            "digest": "${IMAGE_DIGEST}",
            "ref": "${IMAGE_NAME}@${IMAGE_DIGEST}",
            "sbom_artifact": "${SBOM_ARTIFACT}"
          }
          EOF

      - name: Upload ${{ matrix.image.display }} digest metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ideaboard-${{ matrix.image.name }}-image-digest
          path: image-digests/${{ matrix.image.name }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate-release-manifest:
    if: github.event_name != 'pull_request'
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download image digest metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ideaboard-*-image-digest
          path: image-digests
          merge-multiple: true

      - name: Generate release manifest
        shell: bash
        run: |
          for image in api auth auth-migrate; do
            if [ ! -s "image-digests/${image}.json" ]; then
              echo "Missing digest metadata for ${image}"
              exit 1
            fi
          done

          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg workflow "docker-images.yml" \
            --arg cosign_identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@${GITHUB_REF}" \
            --arg cosign_issuer "https://token.actions.githubusercontent.com" \
            --slurpfile api image-digests/api.json \
            --slurpfile auth image-digests/auth.json \
            --slurpfile auth_migrate image-digests/auth-migrate.json \
            '{
              tag: $tag,
              ref: $ref,
              commit: $commit,
              workflow: {
                name: $workflow,
                run_id: $run_id
              },
              images: {
                api: $api[0].ref,
                auth: $auth[0].ref,
                "auth-migrate": $auth_migrate[0].ref
              },
              sbom_artifacts: {
                api: $api[0].sbom_artifact,
                auth: $auth[0].sbom_artifact,
                "auth-migrate": $auth_migrate[0].sbom_artifact
              },
              cosign: {
                certificate_identity: $cosign_identity,
                certificate_oidc_issuer: $cosign_issuer
              }
            }' > release-manifest.json

          cat release-manifest.json
          {
            echo "### Release manifest"
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload release manifest to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release-manifest.json
