name: Backend Verification

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to verify
        required: false
        type: string
      build_images:
        description: Build non-publishing PR images after verification
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  api-generated:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum

      - name: Check sqlc generated code
        working-directory: apps/api
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/db/sqlc

      - name: Test CI parity entrypoint
        run: bash scripts/ci-parity-test.sh

  api-migrations:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum

      - name: Test API migrations
        working-directory: apps/api
        run: go test ./internal/db/migrations -run TestMigrations -count=1

  api-tests:
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode: [standard, race]
        shard: [0, 1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum

      - name: Test API (${{ matrix.mode }} shard ${{ matrix.shard }})
        env:
          TEST_MODE: ${{ matrix.mode }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: "3"
        run: ./scripts/ci-parity.sh api-test

  api-quality:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        check: [vulnerability, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum

      - name: Go vulnerability check
        if: matrix.check == 'vulnerability'
        working-directory: apps/api
        run: go tool govulncheck ./...

      - name: Lint API
        if: matrix.check == 'lint'
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
        with:
          version: v2.12.2
          working-directory: apps/api
          args: ./...

  auth:
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: apps/auth/package-lock.json

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum

      - name: Test and build Auth
        uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/auth
          omit-optional: 'true'

      - name: Test Auth
        working-directory: apps/auth
        run: npm test

      - name: Build Auth
        working-directory: apps/auth
        run: npm run build

      - name: Create migration smoke runtime roles
        shell: bash
        env:
          API_DB_PASSWORD: ideaboard_api_test
          AUTH_DB_PASSWORD: ideaboard_auth_test
        run: |
          postgres_container="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "${postgres_container}"
          docker cp docker/postgres/init-runtime-roles.sh "${postgres_container}:/tmp/init-runtime-roles.sh"
          docker exec \
            -e POSTGRES_USER=ideaboard \
            -e POSTGRES_DB=ideaboard_test \
            -e API_DB_PASSWORD="${API_DB_PASSWORD}" \
            -e AUTH_DB_PASSWORD="${AUTH_DB_PASSWORD}" \
            "${postgres_container}" \
            sh /tmp/init-runtime-roles.sh

      - name: Smoke API then Auth migrations
        shell: bash
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          API_DB_USER: ideaboard_api
          API_DB_PASSWORD: ideaboard_api_test
          AUTH_DB_USER: ideaboard_auth
          AUTH_DB_PASSWORD: ideaboard_auth_test
          DB_MIGRATION_USER: ideaboard
          DB_MIGRATION_PASSWORD: ideaboard_test
          DB_NAME: ideaboard_test
          DB_SSLMODE: disable
          AUTH_INTERNAL_KEY: 0123456789abcdef0123456789abcdef
          APP_SECRETS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AUTH_TRUSTED_ORIGINS: https://app.example.com
          BETTER_AUTH_SECRET: abcdef0123456789abcdef0123456789
          BETTER_AUTH_URL: https://api.example.com
          NODE_ENV: production
        run: |
          (cd apps/api && env DB_USER="${API_DB_USER}" DB_PASSWORD="${API_DB_PASSWORD}" go run ./cmd migrate)
          (cd apps/auth && env DB_USER="${AUTH_DB_USER}" DB_PASSWORD="${AUTH_DB_PASSWORD}" npm run migrate:dist)
          (cd apps/api && env DB_USER="${API_DB_USER}" DB_PASSWORD="${API_DB_PASSWORD}" go run ./cmd migrate)
          (cd apps/auth && env DB_USER="${AUTH_DB_USER}" DB_PASSWORD="${AUTH_DB_PASSWORD}" npm run migrate:dist)

  build-images:
    if: inputs.build_images
    needs:
      - api-generated
      - api-migrations
      - api-tests
      - api-quality
      - auth
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - name: api
            display: API
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: runtime
            cache_scope: ideaboard-api
          - name: auth
            display: Auth
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: runtime
            cache_scope: ideaboard-auth
          - name: auth-migrate
            display: Auth Migration
            context: ./apps/auth
            file: ./apps/auth/Dockerfile
            target: migrator
            cache_scope: ideaboard-auth-migrate

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/ideaboard-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build ${{ matrix.image.display }} image
        timeout-minutes: 20
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cache_scope }}

  verify:
    if: always()
    needs:
      - api-generated
      - api-migrations
      - api-tests
      - api-quality
      - auth
      - build-images
    runs-on: ubicloud-standard-2
    timeout-minutes: 5

    steps:
      - name: Verify backend lanes
        env:
          API_GENERATED_RESULT: ${{ needs.api-generated.result }}
          API_MIGRATIONS_RESULT: ${{ needs.api-migrations.result }}
          API_TESTS_RESULT: ${{ needs.api-tests.result }}
          API_QUALITY_RESULT: ${{ needs.api-quality.result }}
          AUTH_RESULT: ${{ needs.auth.result }}
          BUILD_IMAGES_RESULT: ${{ needs.build-images.result }}
        run: |
          for result in \
            "${API_GENERATED_RESULT}" \
            "${API_MIGRATIONS_RESULT}" \
            "${API_TESTS_RESULT}" \
            "${API_QUALITY_RESULT}" \
            "${AUTH_RESULT}"; do
            [[ "${result}" == success ]] || {
              echo "Backend verification finished with ${result}" >&2
              exit 1
            }
          done

          if [[ "${BUILD_IMAGES_RESULT}" != success && "${BUILD_IMAGES_RESULT}" != skipped ]]; then
            echo "Backend image verification finished with ${BUILD_IMAGES_RESULT}" >&2
            exit 1
          fi
