name: API

# Lint, standard tests, race tests, sqlc checks, and migration verification
# run independently. Image builds and dependency auditing are controlled
# by workflow inputs.

on:
  workflow_call:
    inputs:
      build_images:
        required: false
        type: boolean
        default: false
      audit_dependencies:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  lint:
    name: API Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
      - name: Lint API
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          version: v2.14.0
          working-directory: apps/api
          only-new-issues: true
          args: ./...

  quality:
    name: API Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable
      API_TEST_DATABASE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
      - name: Test CI parity entrypoint
        run: bash scripts/ci-parity-test.sh
      - name: Test nested test infrastructure modules
        working-directory: apps/api
        run: |
          (cd internal/testdb && go test ./...)
          (cd internal/testsupport && go test ./...)
      - name: Go vulnerability check
        if: inputs.audit_dependencies
        working-directory: apps/api
        run: go tool govulncheck ./...
      - name: Production compile
        working-directory: apps/api
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  standard-tests:
    name: API Standard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable
      API_TEST_DATABASE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
          build-cache-scope: api-standard-${{ matrix.shard }}
      - name: Test standard shard
        env:
          TEST_MODE: standard
          TEST_SHARD: "${{ matrix.shard }}"
          TEST_SHARD_COUNT: "2"
        run: ./scripts/ci-parity.sh api-test

  tests:
    name: API Race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable
      API_TEST_DATABASE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
          build-cache-scope: api-race-${{ matrix.shard }}
      - name: Test race shard
        env:
          TEST_MODE: race
          TEST_SHARD: "${{ matrix.shard }}"
          TEST_SHARD_COUNT: "2"
        run: ./scripts/ci-parity.sh api-test

  sqlc-diff:
    name: sqlc Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
      # Use the module-pinned sqlc with the local engine.
      - name: Check sqlc generated code drift
        working-directory: apps/api
        run: go tool sqlc diff --no-remote

  sqlc-vet:
    name: sqlc Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SQLC_VET_DATABASE_URI: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
      # The canonical schema snapshot (the same file sqlc.yaml generates from,
      # and the same snapshot internal/testdb applies) is loaded into the
      # service container so every query can be PREPAREd against a live
      # PostgreSQL 17.
      - name: Load canonical schema into the vet database
        run: |
          postgres_container="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          [[ -n "${postgres_container}" ]]
          docker exec -i "${postgres_container}" \
            psql -v ON_ERROR_STOP=1 -U ideaboard -d ideaboard_test \
            < apps/api/internal/db/schema/schema.sql
      # The db-prepare rule needs a database section, which is derived here
      # instead of committed: a checked-in `database:` would force
      # `sqlc diff` (and every local generate) to open a live connection.
      # Paths inside the config resolve relative to the config file, so the
      # copy lives next to sqlc.yaml.
      - name: Vet queries against live PostgreSQL
        working-directory: apps/api
        run: |
          cp sqlc.yaml sqlc.ci-vet.yaml
          printf '%s\n' \
            '    rules:' \
            '      - sqlc/db-prepare' \
            '    database:' \
            "      uri: \"\${SQLC_VET_DATABASE_URI}\"" >> sqlc.ci-vet.yaml
          go tool sqlc vet --no-remote -f sqlc.ci-vet.yaml

  migration-gate:
    name: Migration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    # Each job uses an ephemeral JetStream store to isolate test streams.
    env:
      API_TEST_DATABASE_DSN: postgres://ideaboard:ideaboard_test@127.0.0.1:5432/ideaboard_test?sslmode=disable
      API_TEST_NATS_URL: nats://127.0.0.1:4222
      # Destructive-DDL review needs the added-migration diff; passed through
      # job env (never interpolated into shell source).
      ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
      - name: Start NATS with JetStream
        run: |
          docker run -d --name ideaboard-nats --network host nats:2.11-alpine -js -m 8222
          nats_ready=0
          for _ in $(seq 1 30); do
            if wget --spider -q http://127.0.0.1:8222/healthz; then
              nats_ready=1
              break
            fi
            sleep 1
          done
          [[ "${nats_ready}" == 1 ]] || { echo 'NATS JetStream did not become ready' >&2; exit 1; }
      - name: Install Atlas
        run: |
          atlas_arch="$(uname -m)"
          case "${atlas_arch}" in
            x86_64) atlas_arch=amd64 ;;
            aarch64|arm64) atlas_arch=arm64 ;;
            *) echo "unsupported architecture: ${atlas_arch}" >&2; exit 1 ;;
          esac
          # Canonical Atlas pin lives in apps/api/Dockerfile (ARG ATLAS_VERSION);
          # never hardcode a version literal here so CI and images stay in lockstep.
          atlas_version="$(sed -n 's/^ARG ATLAS_VERSION=//p' apps/api/Dockerfile | tr -d '[:space:]')"
          [[ -n "${atlas_version}" ]] || { echo 'ATLAS_VERSION pin missing from apps/api/Dockerfile' >&2; exit 1; }
          curl -fsSL "https://release.ariga.io/atlas/atlas-linux-${atlas_arch}-v${atlas_version}" -o /tmp/atlas
          chmod 0555 /tmp/atlas
          echo /tmp >> "${GITHUB_PATH}"
      - name: Prepare runtime database roles
        run: |
          postgres_container="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          [[ -n "${postgres_container}" ]]
          docker cp \
            docker/postgres/init-runtime-roles.sh \
            "${postgres_container}:/tmp/init-runtime-roles.sh"
          docker exec \
            -e POSTGRES_USER=ideaboard \
            -e POSTGRES_DB=ideaboard_test \
            -e API_PG_PASSWORD=ideaboard_api_test \
            -e AUTH_PG_PASSWORD=ideaboard_auth_test \
            "${postgres_container}" \
            sh /tmp/init-runtime-roles.sh
      # Destructive-DDL tripwire (DROP TABLE/COLUMN/... grep) plus
      # `atlas migrate validate` with a Fresh replay on an isolated database.
      # atlas-migration-check.sh owns the pattern list and the
      # `-- destructive: approved` escape hatch.
      - name: Create Atlas validation database
        run: |
          postgres_container="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          [[ -n "${postgres_container}" ]]
          validation_db="ideaboard_atlas_validate_${GITHUB_RUN_ID}"
          [[ "${validation_db}" =~ ^[a-zA-Z0-9_]+$ ]]
          docker exec \
            -e POSTGRES_USER=ideaboard \
            -e POSTGRES_DB=ideaboard_test \
            "${postgres_container}" \
            psql -v ON_ERROR_STOP=1 -U ideaboard -d ideaboard_test \
            -c "CREATE DATABASE ${validation_db}"
          # Branch-creation pushes (repository bootstrap) carry an all-zero
          # base SHA; the checker then diffs against the working tree, which
          # is the correct review scope on CI.
          if [[ ! "${ATLAS_BASE_SHA}" =~ ^[0-9a-f]{40}$ || "${ATLAS_BASE_SHA}" =~ ^0+$ ]]; then
            echo "ATLAS_BASE_SHA=" >> "${GITHUB_ENV}"
          fi
          {
            printf 'ATLAS_DEV_URL=postgres://ideaboard:ideaboard_test@127.0.0.1:5432/%s?sslmode=disable\n' "${validation_db}"
            printf 'MIGRATION_VALIDATION_DB=%s\n' "${validation_db}"
            printf 'ATLAS_BINARY=/tmp/atlas\n'
          } >> "${GITHUB_ENV}"
      - name: Check destructive migrations and validate the chain
        run: bash scripts/atlas-migration-check.sh
      - name: Compare migration replay with schema snapshot
        working-directory: apps/api
        run: go run ./cmd/schemarelease --base-sha "${ATLAS_BASE_SHA:-HEAD}"
      - name: Apply API migrations up
        run: |
          /tmp/atlas migrate apply \
            --dir "file://apps/api/internal/db/migrations" \
            --url "${API_TEST_DATABASE_DSN}"
      # River schema migration plus runtime privilege setup; the env block
      # mirrors scripts/ci-migration-integration.sh, which runs the same
      # finalize step (credentials are the documented throwaway test values).
      - name: Finalize migration (River schema and runtime privileges)
        working-directory: apps/api
        env:
          APP_ENV: production
          PG_HOST: 127.0.0.1
          PG_PORT: "5432"
          PG_DB: ideaboard_test
          PG_SSLMODE: disable
          API_PG_USER: ideaboard_api
          API_PG_PASSWORD: ideaboard_api_test
          PG_MIGRATION_USER: ideaboard
          PG_MIGRATION_PASSWORD: ideaboard_test
          APP_SECRETS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PUBLIC_ORIGIN: https://app.example.com
        run: go run ./cmd finalize-migrate
      # Tests use isolated snapshot fixtures; migration semantics are checked above.
      - name: Test snapshot fixtures and NATS integration
        env:
          TEST_MODE: standard
          TEST_SHARD: "0"
          TEST_SHARD_COUNT: "1"
        run: ./scripts/ci-parity.sh api-test
      - name: Tear down migration databases
        if: always()
        run: |
          docker rm -f ideaboard-nats >/dev/null 2>&1 || true
          postgres_container="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          [[ -n "${postgres_container}" ]]
          for database in "${MIGRATION_VALIDATION_DB}" ideaboard_test; do
            [[ -n "${database}" ]] || continue
            docker exec \
              -e POSTGRES_USER=ideaboard \
              -e POSTGRES_DB=ideaboard_test \
              "${postgres_container}" \
              psql -v ON_ERROR_STOP=1 -U ideaboard -d postgres \
              -c "DROP DATABASE IF EXISTS ${database} WITH (FORCE)"
          done

  openapi-breaking:
    name: OpenAPI Breaking Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
      - name: Check for breaking OpenAPI changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENAPI_BREAKING_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/openapi-breaking-check.sh "${BASE_SHA}"

  static-contracts:
    name: API Static Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check workspace SQL scope predicates
        run: bash scripts/sql-workspace-scope-check.sh

      - name: Check OpenAPI scalar pattern consistency
        run: bash scripts/openapi-pattern-check.sh
      - name: Check backend copy vocabulary
        run: bash scripts/check-backend-copy.sh

  image:
    name: API PR Image
    if: inputs.build_images
    needs: [quality, standard-tests, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          tags: ideaboard-api:pr
          cache-from: type=gha,scope=ideaboard-api
          cache-to: type=gha,mode=max,scope=ideaboard-api
