name: Migration Integration

on:
  workflow_call:
    inputs:
      source_commit:
        type: string
        default: ''
      base_sha:
        required: false
        type: string
        default: ''
      head_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: API then Auth migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Keep workflow inputs out of shell source; GitHub injects them as
      # environment values and the migration checker validates the commits.
      ATLAS_BASE_SHA: ${{ inputs.base_sha }}
      ATLAS_HEAD_SHA: ${{ inputs.head_sha }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ideaboard_test
          POSTGRES_USER: ideaboard
          POSTGRES_PASSWORD: ideaboard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ideaboard -d ideaboard_test -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: apps/auth/package-lock.json
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: apps/api/go.sum
          build-cache-scope: migration-integration
      - uses: ./.github/actions/npm-ci
        with:
          working-directory: apps/auth
          omit-optional: 'true'
      - name: Install Atlas
        run: |
          atlas_arch="$(uname -m)"
          case "${atlas_arch}" in
            x86_64) atlas_arch=amd64 ;;
            aarch64|arm64) atlas_arch=arm64 ;;
            *) echo "unsupported architecture: ${atlas_arch}" >&2; exit 1 ;;
          esac
          # Canonical Atlas pin lives in apps/api/Dockerfile (ARG ATLAS_VERSION);
          # never hardcode a version literal here so CI and images stay in lockstep.
          atlas_version="$(sed -n 's/^ARG ATLAS_VERSION=//p' apps/api/Dockerfile | tr -d '[:space:]')"
          [[ -n "${atlas_version}" ]] || { echo 'ATLAS_VERSION pin missing from apps/api/Dockerfile' >&2; exit 1; }
          curl -fsSL "https://release.ariga.io/atlas/atlas-linux-${atlas_arch}-v${atlas_version}" -o /tmp/atlas
          chmod 0555 /tmp/atlas
          printf 'ATLAS_BINARY=/tmp/atlas\n' >> "${GITHUB_ENV}"
      - name: Test migration integration entrypoint
        run: bash scripts/ci-migration-integration-test.sh
      - name: Prepare Atlas Fresh database
        run: |
          postgres_container="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          [[ -n "${postgres_container}" ]]
          validation_db="ideaboard_atlas_validate_${GITHUB_RUN_ID}"
          [[ "${validation_db}" =~ ^[a-zA-Z0-9_]+$ ]]
          docker exec \
            -e POSTGRES_USER=ideaboard \
            -e POSTGRES_DB=ideaboard_test \
            "${postgres_container}" \
            psql -v ON_ERROR_STOP=1 -U ideaboard -d ideaboard_test \
            -c "CREATE DATABASE ${validation_db}"
          printf 'ATLAS_DEV_URL=postgres://ideaboard:ideaboard_test@127.0.0.1:5432/%s?sslmode=disable\n' "${validation_db}" >> "${GITHUB_ENV}"
      - name: Validate Atlas migrations on a Fresh database
        run: bash scripts/atlas-migration-check.sh
      - name: Smoke API then Auth migrations twice
        run: ./scripts/ci-migration-integration.sh
