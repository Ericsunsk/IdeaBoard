services:
  postgres:
    image: postgres:17-alpine
    container_name: ideaboard-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideaboard}
      POSTGRES_USER: ${POSTGRES_USER:-ideaboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ideaboard-network

  nats:
    image: nats:2.11-alpine
    container_name: ideaboard-nats
    restart: always
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -T 3 -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ideaboard-network

volumes:
  postgres-data:
  nats-data:

networks:
  ideaboard-network:
    driver: bridge
