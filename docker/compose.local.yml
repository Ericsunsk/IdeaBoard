services:
  postgres:
    image: postgres:17-alpine
    container_name: ideaboard-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideaboard}
      POSTGRES_USER: ${POSTGRES_USER:-ideaboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ideaboard-network

  redis:
    image: redis:8.6.2
    container_name: ideaboard-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    networks:
      - ideaboard-network

volumes:
  postgres-data:
  redis-data:

networks:
  ideaboard-network:
    driver: bridge
