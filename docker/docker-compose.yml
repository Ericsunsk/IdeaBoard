services:
  mysql:
    platform: linux/amd64
    image: mysql:8.0
    container_name: ideaboard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ideaboard}
      MYSQL_USER: ${MYSQL_USER:-ideaboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ideaboard123}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - ideaboard-network

  redis:
    image: redis:7
    container_name: ideaboard-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    networks:
      - ideaboard-network

volumes:
  mysql-data:
  redis-data:

networks:
  ideaboard-network:
    driver: bridge
