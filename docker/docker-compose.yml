services:
  mysql:
    platform: linux/amd64
    image: mysql:8.0
    container_name: ideaboard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ideaboard}
      MYSQL_USER: ${MYSQL_USER:-ideaboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ideaboard123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - ideaboard-network

  redis:
    image: redis:7
    container_name: ideaboard-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - ideaboard-network

volumes:
  mysql-data:
  redis-data:

networks:
  ideaboard-network:
    driver: bridge
