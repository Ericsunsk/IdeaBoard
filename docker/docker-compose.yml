version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: feng-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: feng
      MYSQL_USER: feng
      MYSQL_PASSWORD: feng123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - feng-network

  redis:
    image: redis:7
    container_name: feng-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - feng-network

volumes:
  mysql-data:
  redis-data:

networks:
  feng-network:
    driver: bridge
