# Vulnerability exceptions live here so every image scan uses the same policy.
# Keep exceptions narrow, temporary, and tied to a triage note.
ignore:
  # Triage 2026-11-16: Atlas CLI binary (api-migrator image) embeds these
  # modules; latest immutable Atlas (v1.3.11-ede06dc-canary, verified via
  # `go version -m`) still ships them. Upstream fixes exist
  # (brotli v1.2.7, compress v1.20.2); waiting on Ariga to rebuild.
  # Migrator only runs `atlas migrate apply` from the signed bundle
  # (no untrusted input reaches these code paths). Scoped to the exact
  # vulnerability + go-module; REVERT once Atlas ships fixed deps.
  - vulnerability: GO-2026-6888
    fix-state: fixed
    package:
      name: github.com/andybalholm/brotli
      type: go-module
    reason: Atlas-bundled brotli v1.2.0; upstream fix pending Ariga rebuild; migrator-only exposure; revert on Atlas bump
  - vulnerability: GO-2026-6865
    fix-state: fixed
    package:
      name: github.com/klauspost/compress
      type: go-module
    reason: Atlas-bundled compress v1.18.7; upstream fix pending Ariga rebuild; migrator-only exposure; revert on Atlas bump
  # Triage 2026-11-20: same Atlas binary (v1.3.11-ede06dc-canary) embeds
  # Go 1.26.10 stdlib with 8 fresh High CVEs (fixed in go1.26.11).
  # Our own binaries already run go1.26.11 (verified clean). Scoped to the
  # exact CVE + stdlib@go1.26.10 so future stdlib versions (ours or a
  # rebuilt Atlas) are never masked. REVERT once Atlas ships a rebuild.
  - vulnerability: CVE-2026-97033
    fix-state: fixed
    package:
      name: stdlib
      version: go1.26.10
      type: go-module
    reason: Atlas-bundled stdlib go1.26.10; migrator-only exposure; our binaries run go1.26.11; revert on Atlas rebuild
