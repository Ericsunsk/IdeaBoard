# Vulnerability exceptions live here so every image scan uses the same policy.
# Keep exceptions narrow, temporary, and tied to a triage note.
ignore:
  - vulnerability: CVE-2026-58043
    package:
      name: node
      version: 22.23.2
      type: binary
    reason: >-
      Not affected: IdeaBoard does not enable Node.js Permission Model, which is
      the vulnerable code path. Review by 2026-09-07 and remove when upgrading
      Node.js.
  - package:
      name: stdlib
      version: go1.26.5
      type: go-module
    reason: >-
      Upstream Atlas 1.3.2 embeds this Go standard library in the migration-only
      binary. Review by 2026-09-01 and remove when Atlas publishes a patched
      binary.
  - package:
      name: golang.org/x/mod
      version: v0.38.0
      type: go-module
    reason: >-
      Upstream Atlas 1.3.2 embeds this dependency in the migration-only binary.
      Review by 2026-09-01 and remove when Atlas publishes a patched binary.
