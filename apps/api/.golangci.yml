version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Extend the standard preset with the repository's explicit lint policy.
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - tagalign
    - nolintlint
    - gocritic
    - revive
    - misspell
    - prealloc
    - dupl
    - noctx
    - depguard
    - copyloopvar
    - nilerr
    - sloglint
  settings:
    errcheck:
      # defer Close()/Rollback() noise is covered by sqlclosecheck/bodyclose;
      # keep blank-error checks off to avoid `_, _ =` churn.
      check-blank: false
    tagalign:
      # Enforce tag column alignment; the repo does not reorder tag keys
      # themselves (sort:true would fight the file-local key order).
      align: true
      sort: false
    prealloc:
      # Report range loops that append to a slice whose size is inferable.
      # `simple` (default) reports only loops without returns/breaks/
      # continues/gotos; `for-loops` stays off (classic index loops are fine).
      simple: true
      range-loops: true
      for-loops: false
    dupl:
      # 300 tokens: the repo's explicit contract renderers and thin store
      # adapters repeat deliberately (one place per route/query), so the
      # golangci-lint default of 150 flags intentional structure. Only
      # whole-block copies above 300 tokens are reported.
      threshold: 300
    gocritic:
      # Allow explicit business branching.
      disabled-checks:
        - ifElseChain
    gosec:
      # G304/G204/G702 are intentional: schema assembly reads manifest paths,
      # schema-release/migration shell out to Atlas, renderer shells out to a
      # configured binary. G101/G115/G109 fire on test fixtures, env names and
      # clamped int conversions; real secrets are env/file based. G301/G302
      # are 0755/0644 for checked-in schema artifacts and local dev dirs.
      # G703/G704/G122 are taint-analysis noise on already-validated
      # upload paths and allowlisted SSRF-guarded HTTP clients.
      excludes:
        - G304
        - G204
        - G702
        - G703
        - G704
        - G101
        - G109
        - G115
        - G122
        - G301
        - G302
        - G306
    depguard:
      rules:
        # DESIGN.md: platform must not import business contexts.
        platform-boundary:
          files:
            - internal/platform/**/*.go
            - internal/db/**/*.go
            - internal/events/**/*.go
          deny:
            - pkg: ideaboard/api/internal/accountpool
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/billing
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/billingrecords
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/boards
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/credits
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/identity
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/library
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/media
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/payments
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/prompts
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/rewards
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/tasking
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/usage
              desc: platform must not depend on business contexts
            - pkg: ideaboard/api/internal/workflow
              desc: platform must not depend on business contexts
        # DESIGN.md + apps/api/CONTEXT.md: business must not import runtime.
        no-runtime-from-business:
          files:
            - internal/accountpool/**/*.go
            - internal/billing/**/*.go
            - internal/billingrecords/**/*.go
            - internal/boards/**/*.go
            - internal/credits/**/*.go
            - internal/identity/**/*.go
            - internal/library/**/*.go
            - internal/media/**/*.go
            - internal/payments/**/*.go
            - internal/prompts/**/*.go
            - internal/rewards/**/*.go
            - internal/tasking/**/*.go
            - internal/usage/**/*.go
            - internal/workflow/**/*.go
            - internal/searchcatalog/**/*.go
          deny:
            - pkg: ideaboard/api/internal/runtime
              desc: business contexts must not depend on runtime (see apps/api/CONTEXT.md)
    revive:
      # Keep default rules; exported-comment stutter is noisy on this codebase.
      rules:
        - name: exported
          disabled: true
  exclusions:
    # Only files with a standard generated-code marker are excluded.
    generated: strict
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errorlint
          - bodyclose
          - rowserrcheck
          - sqlclosecheck
          - gosec
          - gocritic
          - revive
          - nilerr
          - sloglint
          - copyloopvar
          - dupl
          - noctx
          - prealloc
      # defer Cleanup()/Rollback()/RemoveAll()/c.Error() are best-effort
      # teardown; real failures are surfaced by the primary error return.
      - text: Error return value of `.*(Cleanup|Rollback|RemoveAll)` is not checked
        linters:
          - errcheck
      - text: Error return value of `c\.Error` is not checked
        linters:
          - errcheck
      # `net.Listen` at server startup: the listener is bound once before any
      # request context exists and closed by the lifecycle coordinator.
      - path: internal/runtime/infrastructure/http/server\.go
        linters:
          - noctx
      # The grant-function list is assembled from three signature tables; the
      # explicit append form is preferred over a compound make() capacity.
      - path: internal/credits/infrastructure/postgres/privileges\.go
        linters:
          - prealloc
      # Preserve explicit tag spacing in the domain structs.
      - path: internal/tasking/domain/models\.go
        linters:
          - tagalign

formatters:
  enable:
    - gofmt
    - goimports
