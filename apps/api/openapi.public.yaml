          type: string
          format: date-time
    UploadSession:
      type: object
      required: [id, workspace_id, status, filename, mime_type, size_bytes, checksum_sha256, media_kind, upload_target, created_at, updated_at, expires_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UploadId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        status:
          type: string
          enum: [pending, transferring, completed, failed, expired]
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          type: string
          description: Canonical image MIME from the supported allowlist.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 31457280
        checksum_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 64-character hex sha256 digest (normalized to lowercase).
        media_kind:
          type: string
          enum: [image]
        upload_target:
          $ref: '#/components/schemas/UploadTarget'
        asset_id:
          $ref: '#/components/schemas/MediaAssetId'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    UploadSessionEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/UploadSession'
    CreateUploadRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [filename, mime_type, size_bytes, checksum_sha256]
          additionalProperties: false
          properties:
            filename:
              type: string
              minLength: 1
              maxLength: 255
            mime_type:
              type: string
              description: Image MIME from the supported allowlist.
            size_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 31457280
            checksum_sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
            media_kind:
              type: string
              enum: [image]
              default: image
              description: Defaults to image when omitted.
            board_id:
              type: string
              description: >-
                Optional board the upload is captured for (#936). Verified
                against the creator's board write access; malformed,
                unknown, and unreadable boards converge to 404,
                readable-but-unwritable boards to 403. Empty means no
                binding: the asset stays owner-only until another source
                grants wider access.
    CompleteUploadRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [checksum_sha256, size_bytes]
          additionalProperties: false
          properties:
            checksum_sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
              description: Must equal the session declaration or the session fails terminally.
            size_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 31457280
              description: Must equal the session declaration.
            mime_type:
              type: string
              description: Must match the session declaration when present.
            media_kind:
              type: string
              enum: [image]
              description: Must match the session declaration when present.
            width:
              type: integer
              format: int32
              minimum: 0
              maximum: 32768
              description: Client-declared frame width (byte inspection lands with #805).
            height:
              type: integer
              format: int32
              minimum: 0
              maximum: 32768
              description: Client-declared frame height (byte inspection lands with #805).
    CompleteUploadResult:
      type: object
      required: [upload, asset]
      additionalProperties: false
      properties:
        upload:
          $ref: '#/components/schemas/UploadSession'
        asset:
          $ref: '#/components/schemas/MediaAsset'
    CompleteUploadEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/CompleteUploadResult'
