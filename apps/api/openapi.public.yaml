        '503':
          description: Checkout service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/pending-orders/{order_id}/continue:
    post:
      tags: [WorkspaceBilling]
      operationId: continueWorkspacePendingOrder
      summary: Continue a pending recharge order (members only)
      description: >-
