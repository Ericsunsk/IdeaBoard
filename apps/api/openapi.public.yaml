    post:
      tags: [WorkspaceTasks]
      operationId: cancelWorkspaceTask
      summary: Cancel a workspace task (members only)
      description: >-
        Documented deviation: the cancel action is a POST /cancel
        sub-resource (not a `:cancel` action suffix) to keep Gin
        routing collision-free. The optional body carries only
        {data:{reason}} and defaults to "user cancel". Requires the
        Idempotency-Key header (scope task:cancel). Cancelling a
        terminal task renders 409 task_state_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelWorkspaceTaskRequest'
      responses:
        '200':
          description: Task cancelled.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/tasks/{task_id}/outputs:
