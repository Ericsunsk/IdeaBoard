  /workspaces/{workspace_id}/boards/{board_id}/members:
    get:
      tags: [Boards]
      operationId: listBoardMembers
      summary: List board members (any board role)
      description: >-
        The implicit owner row comes first, followed by explicit grants
        ordered by user. Bearer secrets never appear here.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Board member list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Boards]
      operationId: addBoardMember
      summary: Grant a board role (owner only)
      description: >-
        Requires the Idempotency-Key header. Re-adding an existing member
        keeps the current role. Inviting the implicit owner renders 400
        bad_request; unknown users render 404 board_member_not_found;
        illegal roles render 422 validation_failed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBoardMemberRequest'
      responses:
        '201':
          description: Member added.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards/{board_id}/members/{member_id}:
    patch:
      tags: [Boards]
      operationId: updateBoardMember
      summary: Change a board member role (owner only)
      description: >-
        Demoting the last owner renders 403
        membership_transition_forbidden. Unknown or malformed member ids
        converge to 404 board_member_not_found. No Idempotency-Key is
        required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardMemberRequest'
      responses:
        '200':
          description: Member role updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Boards]
      operationId: removeBoardMember
      summary: Remove a board member (owner manages the roster; anyone may leave)
      description: >-
        Owners may remove anyone; any member may remove themselves
        (self-leave). Removing the last owner renders 403
        membership_transition_forbidden; removing the implicit owner row
        renders 400. Requires the Idempotency-Key header.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Member removed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/boards/{board_id}/shares:
    get:
      tags: [Boards]
      operationId: listShareTokens
      summary: List share tokens without bearers (owner only)
      description: >-
        List entries carry the list-safe token_prefix only; the bearer
        plaintext is shown once at creation (and on idempotent replay)
        and never here.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Share token list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardShareTokenList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Boards]
      operationId: createShareToken
      summary: Create a share bearer (owner only)
      description: >-
        Requires the Idempotency-Key header; same key+hash replays the
        same bearer, a different request renders 409
        board_idempotency_conflict. Share roles are editor or viewer
        only (anything else renders 422 validation_failed). The bearer
        `token` is returned once and must be stored by the caller.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareTokenRequest'
      responses:
        '201':
          description: Share token created (bearer shown once).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardShareTokenEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards/{board_id}/shares/{token_id}:
    delete:
      tags: [Boards]
      operationId: revokeShareToken
      summary: Revoke a share token (owner only)
      description: >-
        Requires the Idempotency-Key header. Revocation is idempotent:
        revoking twice succeeds. Unknown token ids converge to 404
        board_share_token_not_found. Joins against the bearer converge to
        the same 404 afterwards.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/TokenId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Share token revoked.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/billing-account:
    get:
