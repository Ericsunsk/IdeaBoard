            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/credits/balance:
    get:
      tags: [WorkspaceBilling]
      operationId: getWorkspaceCreditsBalance
      summary: Get workspace credits balance (members only)
      description: >-
        Transitional projection: the credits ledger stays user-scoped, so
        workspace reads project the workspace owner's wallet. All money
        is integer minor units. Frozen or restricted wallets render 403
        billing_wallet_restricted; missing wallets render 404 with the
        same code (no provisioning state leak).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Credits balance in integer minor units.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCreditsBalanceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wallet frozen or restricted (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Balance service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/credits/ledger:
    get:
      tags: [WorkspaceBilling]
      operationId: listWorkspaceCreditsLedger
      summary: List immutable credits ledger entries (members only)
      description: >-
