          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [WorkspaceRewards]
      operationId: listWorkspaceRewardRedemptions
      summary: List caller-owned reward redemption history (members only)
      description: >-
        Read model over the caller's redemption facts with the workspace
        as the authZ scope only. History maps BeforeID through the kernel
        opaque cursor. Pages arrive as the contract {data, meta}
        envelope: meta.next_cursor/has_more replaces legacy
        next_cursor/next_before_id fields.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
