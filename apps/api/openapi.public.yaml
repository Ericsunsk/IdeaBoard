        source_url:
          type: string
          format: uri
        preview_url:
          type: string
          format: uri
        original_url:
          type: string
          format: uri
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        width:
          type: integer
          format: int32
          minimum: 0
        height:
          type: integer
          format: int32
