    LibraryAssetId:
      type: string
      pattern: '^lasset_[A-Za-z0-9_-]+$'
      description: Opaque public library asset identifier.
    VisionQueryId:
      type: string
      pattern: '^visq_[A-Za-z0-9_-]+$'
      description: Opaque public vision query operation identifier.
    Service:
      type: string
      enum: [generation, inpaint, render, variations, cutout, fusion, upscale, outpaint]
      description: >-
        Registered AI image service slug. Breaking rename (#847): replaces
        `workflow_kind` with no compatibility alias. A request carrying only
        the old `workflow_kind` field fails strict decoding with 400
        bad_request; a missing `service` renders 422 validation_failed on
        details.fields.service.
    TaskStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]
      description: Workspace task lifecycle status (cancelled_with_results converges to cancelled).
    TaskSettlementState:
      type: string
      enum: [quoted, free, held, captured, released]
      description: Task billing settlement state.
    TaskOutputKind:
      type: string
      enum: [asset, remote]
      description: Task output reference kind.
    TaskBillingSnapshot:
      type: object
      required: [sku, display_name, price_version_id, price_version, output_resolution, unit_credits, quantity, total_credits, quoted_at, settlement_state]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Price SKU (ai-image:<service>).
        display_name:
          type: string
        price_version_id:
          type: integer
          format: int64
        price_version:
          type: integer
          format: int64
        output_resolution:
          type: string
        unit_credits:
          type: integer
          format: int64
          minimum: 0
          description: Integer minor units.
        quantity:
          type: integer
          format: int64
          minimum: 1
        total_credits:
          type: integer
          format: int64
          minimum: 0
          description: Integer minor units.
        quoted_at:
          type: string
          format: date-time
        hold_transaction_id:
          type: string
          description: Omitted unless held.
        settlement_state:
          $ref: '#/components/schemas/TaskSettlementState'
    TaskBillingSnapshotEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/TaskBillingSnapshot'
    TaskOutputRef:
      type: object
      required: [kind, result_index]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/TaskOutputKind'
        asset_id:
          $ref: '#/components/schemas/MediaAssetId'
          description: Set for kind=asset (byte-verified ready asset only).
        url:
          type: string
          format: uri
          description: Set for kind=remote (no storage internals).
        checksum_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Set for kind=remote.
        role:
          type: string
        result_index:
          type: integer
          minimum: 0
    WorkspaceTask:
      type: object
      required: [id, workspace_id, service, status, retry_count, billing_snapshot, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/TaskId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        service:
          $ref: '#/components/schemas/Service'
        media_asset_ids:
          type: array
          items:
            $ref: '#/components/schemas/MediaAssetId'
          description: asset_... input references (no raw storage URLs).
        board_id:
          $ref: '#/components/schemas/BoardId'
          description: >-
            Durable Canvas Board binding (absent for non-Canvas tasks).
            Task content is submitter- or current-Board-reader-only;
            Board-less tasks are submitter-only.
        board_access_version:
          type: integer
          format: int64
          minimum: 1
          description: Board access_version snapshot observed at submit (stale-callback detection for completion publishing).
        status:
          $ref: '#/components/schemas/TaskStatus'
        retry_count:
          type: integer
          minimum: 0
        execution_token:
          type: string
          description: Opaque retry-fencing token; omitted when empty.
        output_refs:
          type: array
          items:
            $ref: '#/components/schemas/TaskOutputRef'
        billing_snapshot:
          $ref: '#/components/schemas/TaskBillingSnapshot'
        error_msg:
          type: string
          description: Omitted unless failed.
        cancel_reason:
          type: string
          description: Omitted unless cancelled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless terminally completed.
    TaskEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceTask'
    PaginatedWorkspaceTasks:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceTask'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginatedMediaAssets:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateWorkspaceTaskRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [service]
          additionalProperties: false
          properties:
            service:
              $ref: '#/components/schemas/Service'
            inputs:
              type: object
              additionalProperties: false
              properties:
                media_asset_ids:
                  type: array
                  maxItems: 8
                  items:
                    $ref: '#/components/schemas/MediaAssetId'
            prompt:
              type: string
              maxLength: 8192
              description: >-
                Free-text prompt (max 8KB bytes). Required for generation
                and inpaint, optional for render/variations/fusion/outpaint,
                ignored for cutout/upscale. Covered by the idempotency hash:
                same key with a different prompt renders 409
                task_idempotency_conflict, never a silent replay.
            params:
              type: object
              description: >-
                Service params object (unknown fields rejected; no storage
                URLs; params.prompt still renders 422 unknown_field).
              properties:
                mask_asset_id:
                  $ref: '#/components/schemas/MediaAssetId'
                  description: >-
                    Inpaint-only durable mask path (mask bytes arrive via
                    the upload-session flow, linked here by asset id).
                    Data-URL and storage-URL masks render 422; inpaint
                    without a mask, or a mask on any non-inpaint feature,
                    renders 422 validation_failed. Mask assets gate on the
                    same ready/archived semantics as inputs (404
                    media_not_found, 409 media_not_ready, 410
                    media_archived).
            quantity:
              type: integer
              format: int64
              minimum: 1
              default: 1
            resolution:
              type: string
              description: Output resolution; omitted input is normalized to the Service policy canonical value.
            board_id:
              $ref: '#/components/schemas/BoardId'
              description: >-
                Optional Canvas Board binding (board_...). The server
                validates Board identity, the caller's generate capability,
                and input availability before any Quote/Hold, and snapshots
                the Board access_version into the durable task binding.
                Omitted Board IDs stay non-Canvas tasks with their own
                workspace-level permission (submitter-only reads, never
                auto-published); callers must never forge a Board
                attribution. Covered by the idempotency hash: same key with
                a different Board renders 409 task_idempotency_conflict.
    QuoteWorkspaceTaskRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [service]
          additionalProperties: false
          properties:
            service:
              $ref: '#/components/schemas/Service'
            quantity:
              type: integer
              format: int64
              minimum: 1
              default: 1
            resolution:
              type: string
              description: Output resolution; omitted input is normalized to the Service policy canonical value.
    CancelWorkspaceTaskRequest:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              maxLength: 500
              description: Cancel reason; defaults to "user cancel" when omitted.
    WorkspaceTaskOutputs:
      type: object
      required: [task_id, outputs]
      additionalProperties: false
      properties:
        task_id:
          $ref: '#/components/schemas/TaskId'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/TaskOutputRef'
    WorkspaceTaskOutputsEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceTaskOutputs'
    LibraryFolder:
      type: object
      required: [id, workspace_id, name, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LibraryFolderId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LibraryFolderEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/LibraryFolder'
    PaginatedLibraryFolders:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryFolder'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateLibraryFolderRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
    RenameLibraryFolderRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
    LibraryAssetProvider:
      type: string
      enum: [unsplash, pexels]
      description: Saved reference provider.
    MediaDisplay:
      type: object
      required: [variants]
      additionalProperties: false
      description: Same-origin display renditions. max_side is a size bound, not a srcset width descriptor.
      properties:
        variants:
          type: array
          items:
            $ref: "#/components/schemas/MediaDisplayVariant"
        expires_at:
          type: string
          format: date-time
          description: Public preview capability expiration. Refresh result pages before reusing expired descriptors.
    MediaDisplayVariant:
      type: object
      required: [tier, max_side, url]
      additionalProperties: false
      properties:
        tier:
          type: string
          enum: [thumb, preview, large-preview]
        max_side:
          type: integer
          enum: [256, 640, 1280]
        url:
          type: string
          description: Same-origin image byte URL; never an original or processing input reference.
    LibraryAsset:
      oneOf:
        - $ref: '#/components/schemas/ExternalLibraryAsset'
        - $ref: '#/components/schemas/MediaLibraryAsset'
      description: >-
        Saved library reference discriminated by source. External rows
        carry provider/source identity plus real URLs; media rows carry
        a media_asset_id with no provider/URL keys.
    ExternalLibraryAsset:
      type: object
      required: [id, workspace_id, source, provider, source_id, source_url, preview_url, original_url, width, height, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LibraryAssetId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        folder_id:
          $ref: '#/components/schemas/LibraryFolderId'
          description: Omitted when unfiled.
        source:
          type: string
          enum: [external]
        provider:
          $ref: '#/components/schemas/LibraryAssetProvider'
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        source_url:
          type: string
          format: uri
        preview_url:
          type: string
          format: uri
        original_url:
          type: string
          format: uri
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        width:
          type: integer
          format: int32
          minimum: 0
        height:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        display:
          $ref: '#/components/schemas/MediaDisplay'
    MediaLibraryAsset:
      type: object
      required: [id, workspace_id, source, media_asset_id, width, height, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LibraryAssetId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        folder_id:
          $ref: '#/components/schemas/LibraryFolderId'
          description: Omitted when unfiled.
        source:
          type: string
          enum: [media]
        media_asset_id:
          type: string
          description: Managed Media Asset identity (asset_...).
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        width:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Projected from the managed Media row; null = unknown. Always paired with height.
        height:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Projected from the managed Media row; null = unknown. Always paired with width.
        task_id:
          type: string
          description: Task provenance (which task output produced this save). Absent on manual saves. Never a dedup key.
        task_result_index:
          type: integer
          format: int32
          minimum: 0
          description: Task provenance, paired with task_id.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        display:
          $ref: '#/components/schemas/MediaDisplay'
    LibraryAssetEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/LibraryAsset'
    PaginatedLibraryAssets:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryAsset'
