    PaginatedWorkspaces:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginatedOrganizations:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ShareTokenId:
      type: string
      pattern: '^sht_[A-Za-z0-9_-]+$'
      description: Opaque share bearer identifier (the bearer itself is shown once at creation only).
    BoardRole:
      type: string
      enum: [owner, editor, viewer]
      description: Explicit board grant role (creator row counts as owner).
    ShareRole:
      type: string
      enum: [editor, viewer]
      description: Share bearer role (owner cannot be granted via shares).
    Board:
      type: object
      required: [id, workspace_id, name, revision, schema_version, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/BoardId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Revision counter, also served as the ETag header.
        schema_version:
          type: integer
          format: int32
          minimum: 1
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BoardEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Board'
    PaginatedBoards:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Board'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    UpdateBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    JoinBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
