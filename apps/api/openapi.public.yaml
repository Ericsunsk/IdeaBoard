          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditsLedger'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wallet frozen or restricted (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Ledger service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/billing-records:
    get:
      tags: [WorkspaceBilling]
      operationId: listWorkspaceBillingRecords
      summary: List caller-owned billing records (members only)
      description: >-
        Read model over settled ledger facts plus immutable task billing
        snapshots; no ledger writes happen here. Cursor pagination over
