        '503':
          description: Billing service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/usage:
    get:
      tags: [WorkspaceBilling]
      operationId: getWorkspaceUsage
      summary: Get current workspace usage snapshot (members only)
      description: >-
        Read-only composition of settled captures plus task snapshots.
        Unknown range values render 422 validation_failed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: range
          in: query
          required: false
          description: Usage window. Defaults to 30d.
          schema:
            type: string
            enum: [7d, 30d, 1y]
            default: 30d
      responses:
        '200':
          description: Usage snapshot (timezone Asia/Shanghai).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUsageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Usage service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/checkout-sessions:
    post:
      tags: [WorkspaceBilling]
      operationId: createWorkspaceCheckoutSession
      summary: Create a recharge checkout session (members only)
      description: >-
        Pricing is server-side only: the request carries the Idea quantity
        plus terms acceptance, never prices or amounts (unknown fields
        such as client-supplied prices are strictly rejected with 400).
        Quantity bounds are 500..500000 Ideas; terms must be accepted at
        the current versions. Requires the Idempotency-Key header: same
        key+hash replays the first session, a different request renders
        409 billing_checkout_conflict. Restricted wallets render 403
        billing_wallet_restricted. Webhook settlement (POST
        /api/webhooks/stripe) is unchanged and settles only through the
        Payments to credits transaction.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceCheckoutRequest'
      responses:
        '201':
          description: Checkout session created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCheckoutSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wallet restricted and not rechargeable (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency-Key reused with a different checkout request (billing_checkout_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Price snapshot or checkout service unavailable (billing_quote_unavailable, service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/checkout-sessions/{session_id}:
    get:
      tags: [WorkspaceBilling]
      operationId: getWorkspaceCheckoutSession
      summary: Get a checkout session status (members only)
      description: >-
        Unknown sessions within a visible workspace render 404
        billing_session_not_found; hidden workspaces converge to 404
        workspace_not_found first.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: session_id
          in: path
          required: true
          description: Opaque checkout session identifier returned at creation.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Checkout session status.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCheckoutSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown checkout session (billing_session_not_found) or hidden workspace (workspace_not_found).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Checkout service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/purchase-options:
    get:
      tags: [WorkspaceBilling]
      operationId: getWorkspacePurchaseOptions
      summary: Get recharge purchase options (members only)
      description: >-
        Caller-owned read over the Payments purchase-eligibility projection
        (static quantities plus terms versions plus wallet gate). No ledger
        writes. Pricing stays server-side; this read carries eligibility
        only, never amounts.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Purchase options.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePurchaseOptionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Recharge service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/pending-orders:
    get:
      tags: [WorkspaceBilling]
      operationId: listWorkspacePendingOrders
      summary: List caller-owned pending recharge orders (members only)
      description: >-
        Pending order intents are bounded (max 3 unpaid, service-enforced)
        and intentionally unpaginated. Facts stay caller-scoped with the
        workspace as the authZ scope only. Malformed or foreign order
        tokens converge to 404 billing_session_not_found, never 400.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Pending order list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePendingOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Checkout service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/pending-orders/{order_id}/continue:
    post:
      tags: [WorkspaceBilling]
      operationId: continueWorkspacePendingOrder
      summary: Continue a pending recharge order (members only)
      description: >-
        Converges provider state inside Payments and returns the refreshed
        order (checkout_url when checkout is open). Empty body: a body is
        a caller bug and renders 400. Requires the Idempotency-Key header:
        key reuse with a different request renders 409
        billing_checkout_conflict. Restricted wallets render 403
        billing_wallet_restricted.
      parameters:
