  /workspaces/{workspace_id}/boards/{board_id}:
    get:
      tags: [Boards]
      operationId: getBoard
      summary: Get a board (any board role)
      description: >-
        Malformed ids, unknown boards, and callers holding no effective
        board role converge to 404 board_not_found. The revision counter
        is returned as the ETag response header. The payload carries the
        creator identity, common sharing role, access version, derived
        posture, caller relationship, and capabilities.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Board detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Boards]
      operationId: updateBoard
      summary: Rename a board (owner/editor only)
      description: >-
        Rename-only: access changes never ride this route (workspace
        sharing is replaced atomically through PUT access). Viewers render
        403 board_forbidden. Writes against an archived
        board render 409 board_archived. Blank or overlong names
        render 422 validation_failed. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardRequest'
      responses:
        '200':
          description: Board renamed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards/{board_id}/archive:
    post:
      tags: [Boards]
      operationId: archiveBoard
      summary: Archive a board (owner/editor only)
      description: >-
        Requires the Idempotency-Key header. Already-archived boards read
        as 404 board_not_found so archive stays idempotent-safe.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
