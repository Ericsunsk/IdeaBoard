  /workspaces/{workspace_id}/uploads/{upload_id}/bytes:
    put:
      tags: [WorkspaceMedia]
      operationId: stageWorkspaceUploadBytes
      summary: Stage declared upload bytes (members only, retryable)
      description: >-
        Stages the raw image bytes matching the session declaration
        (size, checksum, MIME). Raw image bytes body (never JSON, never
        multipart). Retryable: 422 validation mismatches change no state.
        Success reuses the UploadSession envelope. Requires the
        Idempotency-Key header (scope upload:bytes): key reuse with a
        different body renders 409 upload_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Raw image bytes matching the session declaration (size, checksum, MIME). Retryable 422s change no state.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Bytes staged; session echoed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session not live (upload_state_conflict) or idempotency conflict (upload_idempotency_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: Upload session expired (upload_expired).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Byte store unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/uploads/{upload_id}/complete:
    post:
      tags: [WorkspaceMedia]
      operationId: completeWorkspaceUpload
      summary: Complete a workspace upload session (members only, 200 + asset)
      description: >-
        Verifies the completion echo against the declaration and
        materializes the media asset atomically. Complete-after-bytes:
        with a byte backend wired, the staged object must exist at the
        session slot and match the declaration first: completion without
        staged bytes renders 422 upload_validation_failed
        (details.fields.bytes=missing), staged mismatches render 422
        under details.fields size_bytes/checksum_sha256/mime_type (the
        session fails), and transient staged-read failures render 503
        service_unavailable. Requires the
        Idempotency-Key header (scope upload:complete): key reuse with
        a different request renders 409 upload_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: Upload completed with its media asset.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: State conflict or idempotency conflict (upload_state_conflict, upload_idempotency_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: Upload session expired (upload_expired).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Transient staged-read failure (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/media-assets:
    get:
      tags: [WorkspaceMedia]
      operationId: listWorkspaceMediaAssets
      summary: List workspace media assets with cursor pagination (members only)
      description: >-
        Lists live workspace media assets newest-first. Unknown
        workspaces list empty at the store layer; non-members converge
        to 404 workspace_not_found at the handler gate.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated media asset list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAssets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/media-assets/batch:
    post:
      tags: [WorkspaceMedia]
      operationId: batchGetWorkspaceMediaAssets
      summary: Read up to 50 media assets in one call (members only)
      description: >-
        Bounded read-only batch over the same asset DTOs as the
        single-read endpoint, in request order. Read-only, so no
        Idempotency-Key (library asset-resolutions precedent). Any
        malformed, unknown, or cross-workspace id converges to 404
        media_not_found; over-bound inputs render 422
        media_validation_failed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetMediaAssetsRequest'
      responses:
        '200':
          description: Requested media assets in request order.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetMediaAssetsResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/media-assets/{asset_id}:
    get:
      tags: [WorkspaceMedia]
      operationId: getWorkspaceMediaAsset
      summary: Get a workspace media asset (members only)
      description: >-
        Resolves one media asset. Malformed asset_ shapes, unknown ids,
        and cross-workspace ids converge to 404 media_not_found.
        Archived assets stay readable (archived_at set).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Media asset metadata.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/media-assets/{asset_id}/content:
    get:
      tags: [WorkspaceMedia]
      operationId: contentWorkspaceMediaAsset
      summary: Read workspace media asset bytes (members only)
      description: >-
        Serves the stored bytes (never the JSON envelope, never storage
        keys). Errors are plain non-JSON statuses: archived assets 410,
        non-ready assets 409, missing bytes 404/503.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Media bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: Media asset archived (media_archived).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/media-assets/{asset_id}/derivatives/{variant}:
    get:
      tags: [WorkspaceMedia]
      operationId: derivativeWorkspaceMediaAsset
      summary: Read a workspace media asset derivative (members only)
      description: >-
        Serves one generation-matched stored derivative row. Tiers
        without a stored row stay 409 until generation materializes
        them; there is no imgproxy pull-through on the v1 path.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
        - name: variant
          in: path
          required: true
          description: Display tier variant.
          schema:
            type: string
            enum: [thumb, preview, large-preview]
      responses:
        '200':
          description: Derivative bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/media-assets/{asset_id}/archive:
    post:
      tags: [WorkspaceMedia]
      operationId: archiveWorkspaceMediaAsset
      summary: Archive a workspace media asset (owner/admin only, 200)
      description: >-
        Stamps the archive lifecycle marker. Repeat archives converge on
        the stored row so idempotent replays never 404. Requires the
        Idempotency-Key header (scope media:archive): key reuse with a
        different request renders 409 media_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Archived media asset metadata.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency conflict (media_idempotency_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/library/folders:
    get:
      tags: [WorkspaceLibrary]
      operationId: listWorkspaceLibraryFolders
      summary: List workspace library folders with cursor pagination (members only)
      description: >-
        Folders return in creation order. Hidden workspaces converge to
        404 workspace_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated folder list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLibraryFolders'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [WorkspaceLibrary]
      operationId: createWorkspaceLibraryFolder
      summary: Create a workspace library folder (members only)
      description: >-
        Folder names are 1..100 characters and unique per workspace
        (case-insensitive duplicates render 409). Requires the
        Idempotency-Key header (scope library:folder-create): key reuse
        with a different request renders 409
        library_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryFolderRequest'
      responses:
        '201':
          description: Folder created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryFolderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/library/folders/{folder_id}:
    patch:
      tags: [WorkspaceLibrary]
      operationId: renameWorkspaceLibraryFolder
      summary: Rename a workspace library folder (members only)
      description: >-
        Malformed lfolder_ shapes (including legacy integer ids, which v1
        never accepts), unknown ids, and cross-workspace ids converge to
        404 library_folder_not_found. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LibraryFolderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameLibraryFolderRequest'
      responses:
        '200':
          description: Folder renamed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryFolderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [WorkspaceLibrary]
      operationId: deleteWorkspaceLibraryFolder
      summary: Delete a workspace library folder (members only)
      description: >-
        Contained assets become unfiled rather than deleted. Requires
        the Idempotency-Key header (scope library:folder-delete) so
        replays converge instead of 404ing on the already-deleted
        folder.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LibraryFolderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Folder deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/library/assets:
    get:
      tags: [WorkspaceLibrary]
      operationId: listWorkspaceLibraryAssets
      summary: List workspace library assets with cursor pagination (members only)
      description: >-
        Assets return in creation order. The optional folder_id query
        filters to one folder; unknown folder shapes converge to 404
        library_folder_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: folder_id
          in: query
          required: false
          description: Filter to one lfolder_ folder.
          schema:
            type: string
      responses:
        '200':
          description: Paginated asset list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLibraryAssets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [WorkspaceLibrary]
      operationId: saveWorkspaceLibraryAsset
      summary: Save a provider reference as a workspace library asset (members only)
      description: >-
        Assets are saved external references ONLY (provider URL + source
        metadata, never bytes) behind the provider-allowlist https URL
        gate. Save is idempotent on (workspace, provider, source_id):
        re-saving returns the existing asset with 200 instead of 201.
        Requires the Idempotency-Key header (scope library:asset-save).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLibraryAssetRequest'
      responses:
        '200':
          description: Asset already saved (dedup hit returns the existing asset).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAssetEnvelope'
        '201':
          description: Asset saved.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAssetEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/library/assets/{asset_id}:
    patch:
      tags: [WorkspaceLibrary]
      operationId: moveWorkspaceLibraryAsset
      summary: Move a workspace library asset to another folder (members only)
      description: >-
        An empty folder_id unfiles the asset. Unknown assets or folders
        404 with their own codes. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LibraryAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveLibraryAssetRequest'
      responses:
        '200':
          description: Asset moved.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAssetEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [WorkspaceLibrary]
      operationId: deleteWorkspaceLibraryAsset
      summary: Delete a workspace library asset (members only)
      description: >-
        Drops the saved reference only (the provider original is
        untouched; materialized media assets are owned by Media).
        Requires the Idempotency-Key header (scope
        library:asset-delete).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LibraryAssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Asset deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/library/asset-resolutions:
    post:
      tags: [WorkspaceLibrary]
      operationId: resolveWorkspaceLibraryAssets
      summary: Batch-resolve saved workspace assets by reference (members only, max 20)
      description: >-
        Typed batch lookup against saved workspace assets only (by
        provider + source_id or exact known provider URL) — NOT a
        general proxy; nothing is fetched and unknown references report
        unresolved per item. Batches above 20 render 400. No
        Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveLibraryAssetsRequest'
      responses:
        '200':
          description: Per-item resolve outcomes.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveLibraryAssetsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/search:
    get:
      tags: [WorkspaceSearch]
      operationId: searchWorkspace
      summary: Search provider catalogs in a workspace context (members only)
      description: >-
        Results carry provider URL + source metadata only (never bytes),
        mirroring the library asset boundary. Query validation is
        explicit: blank or over-limit queries render 422
        validation_failed (details.fields names q), never a silent empty
        page. The cursor is opaque and bound to (query, providers,
        page_size): replaying it against a different query, filter set,
        or page size renders 400 pagination_cursor_invalid. All
        providers failed renders 503 search_provider_unavailable.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          required: true
          description: Search keywords (1..200 characters after trimming).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Provider filter (repeatable). Empty means both catalog providers.
          schema:
            type: array
            items:
              type: string
              enum: [unsplash, pexels]
      responses:
        '200':
          description: Paginated search hits.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaceSearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Search providers unavailable (search_provider_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/search/vision-queries:
    post:
      tags: [WorkspaceSearch]
      operationId: createWorkspaceVisionQuery
      summary: File a vision query from text plus owned refs (members only)
      description: >-
        Inputs reference owned workspace library assets by lasset_ id
        (resolved server-side; unknown, malformed, or cross-workspace
        refs converge to 404 library_asset_not_found), staged workspace
        uploads by upload_ id (stage-then-reference through the
        upload-session byte PUT; unknown ids 404 upload_not_found,
        expired 410 upload_expired, failed 409 upload_state_conflict,
        unstaged 422 validation_failed), and external images by
        allowlisted https URL (images.unsplash.com, plus.unsplash.com,
        images.pexels.com; anything else 422); client bytes never cross
        this boundary, so there is no multipart surface.
        Billing settles through credits.Commands against a server-side
        quote for the ai-search:vision SKU (unpriced or unregistered SKU
        renders billing_pricing_unavailable 422 deterministic, transient
        quote failures billing_quote_unavailable 503,
        billing_wallet_restricted 403). Provider extraction
        failures render 502 search_vision_provider_error (hold
        refunded); unconfigured vision renders 503
        search_vision_not_configured. Requires the Idempotency-Key
        header (scope search:vision): key reuse with a different request
        renders 409 search_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceVisionQueryRequest'
      responses:
        '201':
          description: Vision query extracted (normalized query returned).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceVisionQueryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Restricted wallet (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: Staged-upload session expired (upload_expired).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failure (validation_failed) or SKU unpriced/unregistered (billing_pricing_unavailable, deterministic, do not retry).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Vision provider failure (search_vision_provider_error, hold refunded).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Vision unconfigured or transient quote failure (search_vision_not_configured, billing_quote_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    publicSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Human session via the Better Auth transport (/api/auth/*).
    publicApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Personal API key or OAuth token principal.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token bound to principal, filters and sort order.
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: page_size
      in: query
      required: false
      description: Requested page size. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WorkspaceId'
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganizationId'
    MemberId:
      name: member_id
      in: path
      required: true
      description: External usr_ member identifier (database ids never appear in URLs).
      schema:
        $ref: '#/components/schemas/UserId'
    BoardId:
      name: board_id
      in: path
      required: true
      description: Opaque board_ identifier (malformed shapes converge to 404 board_not_found, never 400).
      schema:
        $ref: '#/components/schemas/BoardId'
    RevisionId:
      name: revision_id
      in: path
      required: true
      description: Board revision number or entry id (unknown values converge to 404 board_not_found).
      schema:
        type: integer
        format: int64
        minimum: 1
    TokenId:
      name: token_id
      in: path
      required: true
      description: Opaque sht_ share token identifier (legacy integer shapes simply miss and read as 404).
      schema:
        $ref: '#/components/schemas/ShareTokenId'
    UploadId:
      name: upload_id
      in: path
      required: true
      description: Opaque upload_ session identifier (malformed shapes converge to 404 upload_not_found).
      schema:
        $ref: '#/components/schemas/UploadId'
    AssetId:
      name: asset_id
      in: path
      required: true
      description: Opaque asset_ media identifier (malformed shapes converge to 404 media_not_found).
      schema:
        $ref: '#/components/schemas/MediaAssetId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Expected board revision (the ETag value from the last read).
        Missing, wildcard, or unparsable values render 400; stale values
        render 409 board_revision_conflict at write time.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-chosen idempotency key, at most 128 characters. Scoped by
        principal, operation and key value. Reuse it when retrying the same
        action; reuse with a different request returns 409 with
        workspace_idempotency_conflict-style codes. No body-level key is accepted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: Request-Id
      in: header
      required: false
      description: Caller-supplied correlation ID echoed back on the response.
      schema:
        type: string
        maxLength: 128
    TaskId:
      name: task_id
      in: path
      required: true
      description: Opaque task_ identifier (malformed shapes converge to 404 task_not_found).
      schema:
        $ref: '#/components/schemas/TaskId'
    LibraryFolderId:
      name: folder_id
      in: path
      required: true
      description: Opaque lfolder_ library folder identifier (malformed shapes, including legacy integer ids, converge to 404 library_folder_not_found).
      schema:
        $ref: '#/components/schemas/LibraryFolderId'
    LibraryAssetId:
      name: asset_id
      in: path
      required: true
      description: Opaque lasset_ library asset identifier (malformed shapes, including legacy integer ids, converge to 404 library_asset_not_found).
      schema:
        $ref: '#/components/schemas/LibraryAssetId'
  headers:
    RequestId:
      description: Server-assigned request correlation ID, present on every response.
      schema:
        type: string
    ETag:
      description: Resource version (board revision counter) for optimistic updates; send back as If-Match.
      schema:
        type: string
    RateLimitLimit:
      description: Rate limit ceiling for the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying (429 and 503 with known window).
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request, including missing idempotency keys.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing authentication.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Visible-but-forbidden; hidden resources converge to 404 instead.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Missing or invisible resource (anti-enumeration).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Idempotency-key reuse with a different request.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Validation failure with details.fields.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          description: Resource payload.
        meta:
          type: object
          description: Optional single-resource metadata.
    DeletedEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [deleted]
          additionalProperties: false
          properties:
            deleted:
              type: boolean
    UserEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/User'
    WorkspaceEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Workspace'
    WorkspaceList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    OrganizationEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Organization'
    WorkspaceMemberEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceMemberList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    PaginationMeta:
      type: object
      required: [next_cursor, has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when exhausted.
        has_more:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. workspace_idempotency_conflict.
              example: workspace_idempotency_conflict
            message:
              type: string
              description: User-facing text; may change. Branch on code, not message.
            details:
              type: object
              description: Field-level validation failures under details.fields.
            request_id:
              type: string
              description: Correlation ID matching the Request-Id response header.
    UserId:
      type: string
      pattern: '^usr_[A-Za-z0-9_-]+$'
      description: Opaque public user identifier.
    OrganizationId:
      type: string
      pattern: '^org_[A-Za-z0-9_-]+$'
      description: Opaque public organization identifier.
    WorkspaceId:
      type: string
      pattern: '^ws_[A-Za-z0-9_-]+$'
      description: Opaque public workspace identifier.
    BoardId:
      type: string
      pattern: '^board_[A-Za-z0-9_-]+$'
      description: Opaque public board identifier.
    TaskId:
      type: string
      pattern: '^task_[A-Za-z0-9_-]+$'
      description: Opaque public task identifier.
    MediaAssetId:
      type: string
      pattern: '^asset_[A-Za-z0-9_-]+$'
      description: Opaque public media asset identifier.
    UploadId:
      type: string
