          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wallet frozen or restricted (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
