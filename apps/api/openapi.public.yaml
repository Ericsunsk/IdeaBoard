  /workspaces/{workspace_id}/library/assets:
    get:
      tags: [WorkspaceLibrary]
      operationId: listWorkspaceLibraryAssets
      summary: List workspace library assets with cursor pagination (members only)
      description: >-
        Assets return in creation order. Each item carries a source
        discriminator: external rows carry provider/source identity plus
        real URLs, media rows carry a media_asset_id with no
        provider/URL keys. Media dimensions are projected from the
        managed Media row (null = unknown). The optional folder_id query
        filters to one folder; unknown folder shapes converge to 404
        library_folder_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: folder_id
          in: query
          required: false
          description: Filter to one lfolder_ folder.
          schema:
            type: string
      responses:
        '200':
          description: Paginated asset list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLibraryAssets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [WorkspaceLibrary]
      operationId: saveWorkspaceLibraryAsset
      summary: Save a workspace library asset (members only)
      description: >-
        Saves are discriminated by source. External saves carry a
        provider reference (provider URL + source metadata, never bytes)
        behind the provider-allowlist https URL gate and are idempotent
        on (workspace, provider, source_id). Media saves carry a managed
        Media Asset identity (same-workspace, readable) and are
        idempotent on (workspace, media_asset_id). Re-saving returns the
        existing asset with 200 instead of 201 without touching its
        folder or metadata. Requires the Idempotency-Key header (scope
        library:asset-save).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLibraryAssetRequest'
      responses:
        '200':
          description: Asset already saved (dedup hit returns the existing asset).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAssetEnvelope'
        '201':
          description: Asset saved.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAssetEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/library/assets/{asset_id}:
    patch:
      tags: [WorkspaceLibrary]
      operationId: moveWorkspaceLibraryAsset
      summary: Move a workspace library asset to another folder (members only)
      description: >-
        An empty folder_id unfiles the asset. Unknown assets or folders
        404 with their own codes. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LibraryAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveLibraryAssetRequest'
      responses:
        '200':
          description: Asset moved.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAssetEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [WorkspaceLibrary]
      operationId: deleteWorkspaceLibraryAsset
      summary: Delete a workspace library asset (members only)
      description: >-
        Drops the saved reference only (the provider original is
        untouched; materialized media assets are owned by Media).
        Requires the Idempotency-Key header (scope
        library:asset-delete).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LibraryAssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Asset deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/library/assets/{asset_id}/derivatives/{tier}:
    get:
      tags: [WorkspaceLibrary]
      operationId: derivativeWorkspaceLibraryAsset
      summary: Read a library display rendition (members only)
      description: Resolves a stored preview or existing managed link without materialization. Returns WebP bytes.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: asset_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LibraryAssetId"
        - name: tier
          in: path
          required: true
          schema:
            type: string
            enum: [thumb, preview, large-preview]
        - name: v
          in: query
          required: true
          schema:
            type: string
          description: Source version returned in the display descriptor URL.
      responses:
        "200":
          description: Rendered image bytes; Cache-Control is private, max-age=300.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid display tier (plain status).
        "401":
          description: Authentication required (plain status).
        "404":
          description: Workspace, asset or source version not found (plain status).
        "409":
          description: Image source unavailable (plain status).
        "503":
          description: Renderer unavailable (plain status).
  /workspaces/{workspace_id}/library/asset-resolutions:
    post:
      tags: [WorkspaceLibrary]
      operationId: resolveWorkspaceLibraryAssets
      summary: Batch-resolve saved workspace assets by reference (members only, max 20)
      description: >-
        Typed batch lookup against saved workspace assets only (by
        provider + source_id or exact known provider URL) — NOT a
        general proxy; nothing is fetched and unknown references report
        unresolved per item. Batches above 20 render 400. No
        Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveLibraryAssetsRequest'
      responses:
        '200':
          description: Per-item resolve outcomes.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveLibraryAssetsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/search:
    get:
      tags: [WorkspaceSearch]
      operationId: searchWorkspace
      summary: Search provider catalogs in a workspace context (members only)
      description: >-
        Results carry provider URL + source metadata only (never bytes),
        mirroring the library asset boundary. Query validation is
        explicit: blank or over-limit queries render 422
        validation_failed (details.fields names q), never a silent empty
        page. The cursor is opaque and bound to (query, providers,
        page_size): replaying it against a different query, filter set,
        or page size renders 400 pagination_cursor_invalid. All
        providers failed renders 503 search_provider_unavailable.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          required: true
          description: Search keywords (1..200 characters after trimming).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: provider
          in: query
          required: false
          description: Provider filter (repeatable). Empty means both catalog providers.
          schema:
            type: array
            items:
              type: string
              enum: [unsplash, pexels]
      responses:
        '200':
          description: Paginated search hits.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaceSearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Search providers unavailable (search_provider_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/search/vision-queries:
    post:
      tags: [WorkspaceSearch]
      operationId: createWorkspaceVisionQuery
      summary: File a vision query from text plus owned refs (members only)
      description: >-
        Inputs reference owned workspace library assets by lasset_ id
        (resolved server-side; unknown, malformed, or cross-workspace
        refs converge to 404 library_asset_not_found), staged workspace
        uploads by upload_ id (stage-then-reference through the
        upload-session byte PUT; unknown ids 404 upload_not_found,
        expired 410 upload_expired, failed 409 upload_state_conflict,
        unstaged 422 validation_failed), and external images by
        allowlisted https URL (images.unsplash.com, plus.unsplash.com,
        images.pexels.com; anything else 422); client bytes never cross
        this boundary, so there is no multipart surface.
        Billing settles through credits.Commands against a server-side
        quote for the ai-search:vision SKU (unpriced or unregistered SKU
        renders billing_pricing_unavailable 422 deterministic, transient
        quote failures billing_quote_unavailable 503,
        billing_wallet_restricted 403). Provider extraction
        failures render 502 search_vision_provider_error (hold
        refunded); unconfigured vision renders 503
        search_vision_not_configured. Requires the Idempotency-Key
        header (scope search:vision): key reuse with a different request
        renders 409 search_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceVisionQueryRequest'
      responses:
        '201':
          description: Vision query extracted (normalized query returned).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceVisionQueryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Restricted wallet (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: Staged-upload session expired (upload_expired).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation failure (validation_failed) or SKU unpriced/unregistered (billing_pricing_unavailable, deterministic, do not retry).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Vision provider failure (search_vision_provider_error, hold refunded).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Vision unconfigured or transient quote failure (search_vision_not_configured, billing_quote_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    publicSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Human session via the Better Auth transport (/api/auth/*).
    publicApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Personal API key or OAuth token principal.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token bound to principal, filters and sort order.
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: page_size
      in: query
      required: false
      description: Requested page size. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WorkspaceId'
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganizationId'
    MemberId:
      name: member_id
      in: path
      required: true
      description: External usr_ member identifier (database ids never appear in URLs).
      schema:
        $ref: '#/components/schemas/UserId'
    MemberLookupEmail:
      name: email
      in: query
      required: true
      description: Registered user email for exact-match invite lookup (trimmed, case-insensitive; resolved per call, never stored).
      schema:
        type: string
        format: email
        minLength: 1
        maxLength: 320
    BoardId:
      name: board_id
      in: path
      required: true
      description: Opaque board_ identifier (malformed shapes converge to 404 board_not_found, never 400).
      schema:
        $ref: '#/components/schemas/BoardId'
    RevisionId:
      name: revision_id
      in: path
      required: true
      description: Board revision number or entry id (unknown values converge to 404 board_not_found).
      schema:
        type: integer
        format: int64
        minimum: 1
    UploadId:
      name: upload_id
      in: path
      required: true
      description: Opaque upload_ session identifier (malformed shapes converge to 404 upload_not_found).
      schema:
        $ref: '#/components/schemas/UploadId'
    AssetId:
      name: asset_id
      in: path
      required: true
      description: Opaque asset_ media identifier (malformed shapes converge to 404 media_not_found).
      schema:
        $ref: '#/components/schemas/MediaAssetId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Expected board revision (the ETag value from the last read).
        Missing, wildcard, or unparsable values render 400; stale values
        render 409 board_revision_conflict at write time.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    AccessIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Expected board access version (the access-<version> ETag value
        from the last access read). Missing values render 428
        board_precondition_required; unparsable values render 400; stale
        versions render 412 board_access_conflict at write time.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-chosen idempotency key, at most 128 characters. Scoped by
        principal, operation and key value. Reuse it when retrying the same
        action; reuse with a different request returns 409 with
        workspace_idempotency_conflict-style codes. No body-level key is accepted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: Request-Id
      in: header
      required: false
      description: Caller-supplied correlation ID echoed back on the response.
      schema:
        type: string
        maxLength: 128
    TaskId:
      name: task_id
      in: path
      required: true
      description: Opaque task_ identifier (malformed shapes converge to 404 task_not_found).
      schema:
        $ref: '#/components/schemas/TaskId'
    LibraryFolderId:
      name: folder_id
      in: path
      required: true
      description: Opaque lfolder_ library folder identifier (malformed shapes, including legacy integer ids, converge to 404 library_folder_not_found).
      schema:
        $ref: '#/components/schemas/LibraryFolderId'
    LibraryAssetId:
      name: asset_id
      in: path
      required: true
      description: Opaque lasset_ library asset identifier (malformed shapes, including legacy integer ids, converge to 404 library_asset_not_found).
      schema:
        $ref: '#/components/schemas/LibraryAssetId'
  headers:
    RequestId:
      description: Server-assigned request correlation ID, present on every response.
      schema:
        type: string
    ETag:
      description: Resource version (board revision counter) for optimistic updates; send back as If-Match.
      schema:
        type: string
    RateLimitLimit:
      description: Rate limit ceiling for the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying (429 and 503 with known window).
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request, including missing idempotency keys.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing authentication.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Visible-but-forbidden; hidden resources converge to 404 instead.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Missing or invisible resource (anti-enumeration).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Idempotency-key reuse with a different request.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: Stale access version (board_access_conflict).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: Missing access-version precondition (board_precondition_required).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Validation failure with details.fields.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SupportChannel:
      type: object
      required: [id, name, kind, url, enabled, sort_order]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [discord, telegram, whatsapp, line, wechat, custom]
        url:
          type: string
          format: uri
          maxLength: 2048
        enabled:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
    SupportChannelsSetting:
      type: object
      required: [channels]
      additionalProperties: false
      properties:
        channels:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SupportChannel'
    SupportChannelsSettingEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/SupportChannelsSetting'
    SuccessEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          description: Resource payload.
        meta:
          type: object
          description: Optional single-resource metadata.
    DeletedEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [deleted]
          additionalProperties: false
          properties:
            deleted:
              type: boolean
    UserEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/User'
    WorkspaceEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Workspace'
    WorkspaceList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    OrganizationEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Organization'
    WorkspaceMemberEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceMemberList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceMemberLookup:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/UserId'
    WorkspaceMemberLookupEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceMemberLookup'
    PaginationMeta:
      type: object
      required: [next_cursor, has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when exhausted.
        has_more:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. workspace_idempotency_conflict.
              example: workspace_idempotency_conflict
            message:
              type: string
              description: User-facing text; may change. Branch on code, not message.
            details:
              type: object
              description: Field-level validation failures under details.fields.
            request_id:
              type: string
              description: Correlation ID matching the Request-Id response header.
    UserId:
      type: string
      pattern: '^usr_[A-Za-z0-9_-]+$'
      description: Opaque public user identifier.
    OrganizationId:
      type: string
      pattern: '^org_[A-Za-z0-9_-]+$'
      description: Opaque public organization identifier.
    WorkspaceId:
      type: string
      pattern: '^ws_[A-Za-z0-9_-]+$'
      description: Opaque public workspace identifier.
    BoardId:
      type: string
      pattern: '^board_[A-Za-z0-9_-]+$'
      description: Opaque public board identifier.
    TaskId:
      type: string
      pattern: '^task_[A-Za-z0-9_-]+$'
      description: Opaque public task identifier.
    MediaAssetId:
      type: string
      pattern: '^asset_[A-Za-z0-9_-]+$'
      description: Opaque public media asset identifier.
    UploadId:
      type: string
      pattern: '^upload_[A-Za-z0-9_-]+$'
      description: Opaque public upload session identifier.
    EventId:
      type: string
      pattern: '^evt_[A-Za-z0-9_-]+$'
      description: Opaque public event identifier.
    MembershipRole:
      type: string
      enum: [owner, admin, member]
      description: Workspace/organization membership role.
    User:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        personal_workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        avatar:
          type: string
          description: Public avatar route URL with a content version query; omitted when no avatar is set.
        storage_namespace:
          type: string
          description: Media storage namespace; omitted when no storage namespace is set.
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC profile creation timestamp; omitted when unavailable.
        updated_at:
          type: string
          format: date-time
          description: RFC3339 UTC profile update timestamp; omitted when unavailable.
        status:
          type: integer
          description: Numeric user status; 0 means banned and 1 means active. Always present.
    Workspace:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/WorkspaceId'
        organization_id:
          anyOf:
            - $ref: '#/components/schemas/OrganizationId'
            - nullable: true
          description: Null for personal workspaces without an organization.
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
    Organization:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OrganizationId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
    WorkspaceMember:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/UserId'
        role:
          $ref: '#/components/schemas/MembershipRole'
        created_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
          description: >-
            Workspace-visible member email for invite search and display
            assistance only (members-only visibility, unmasked by decision).
            Omitted when unavailable; never used as a write identity
            (member writes stay usr_ with unknown users converging to 404).
    CreateWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            organization_id:
              anyOf:
                - $ref: '#/components/schemas/OrganizationId'
                - nullable: true
    UpdateWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    AddWorkspaceMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [user_id, role]
          additionalProperties: false
          properties:
            user_id:
              $ref: '#/components/schemas/UserId'
            role:
              $ref: '#/components/schemas/MembershipRole'
    UpdateWorkspaceMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [role]
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/MembershipRole'
    CreateOrganizationRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    UpdateOrganizationRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    CreateOrganizationWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    PaginatedWorkspaces:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginatedOrganizations:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    WorkspaceAccess:
      type: string
      enum: [none, viewer, editor]
      description: >-
        Common Board role for selected Workspace members only.
        none disables sharing and clears all selections.
    BoardAccessState:
      type: string
      enum: [private, workspace]
      description: >-
        private when sharing is disabled or no members are selected;
        workspace when selected members can access with the common role.
    BoardRelationship:
      type: object
      required: [is_creator, has_direct_grant]
      additionalProperties: false
      properties:
        is_creator:
          type: boolean
          description: Caller is the board creator (implicit owner).
        has_direct_grant:
          type: boolean
          description: Caller holds an explicit board grant row.
    BoardCapabilities:
      type: object
      required: [read, write, manage, generate]
      additionalProperties: false
      properties:
        read:
          type: boolean
        write:
          type: boolean
          description: Rename, archive/restore, and document replacement.
        manage:
          type: boolean
          description: Grants, access-resource writes, and access reads.
        generate:
          type: boolean
          description: >-
            Generation affordance; task/billing authorization still
            applies at submit time and is never expanded by this flag.
    Board:
      type: object
      required: [id, workspace_id, name, revision, schema_version, creator_user_id, workspace_access, access_version, access_state, relationship, capabilities, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/BoardId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Revision counter, also served as the ETag header.
        schema_version:
          type: integer
          format: int32
          minimum: 1
        content_version:
          type: string
          minLength: 8
          maxLength: 128
          nullable: true
          description: >-
            Opaque identity of the accepted persisted content (hex SHA-256
            of the canonical document, assigned in the accepting
            transaction). Metadata renames and archive transitions never
            change it. Null when a content identity has not been assigned.
        preview_scene:
          type: object
          nullable: true
          description: >-
            Stored versioned Board Preview Scene projection (contract:
            apps/api/internal/boards/previewscene/contract.md). Gallery
            catalog cards carry it without a document fetch; null when the
            document schema is not extractable or the stored projection
            is absent.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
        creator_user_id:
          type: string
          description: Creator User public identity (usr_ opaque).
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
        access_version:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Independent monotonic access counter, served as the
            access-<version> ETag on the access resource. Access
            mutations bump it; document writes never do.
        access_state:
          $ref: '#/components/schemas/BoardAccessState'
        relationship:
          $ref: '#/components/schemas/BoardRelationship'
        capabilities:
          $ref: '#/components/schemas/BoardCapabilities'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BoardEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Board'
    PaginatedBoards:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Board'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    UpdateBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    BoardAccess:
      type: object
      required: [workspace_id, board_id, workspace_access, member_user_ids, access_version, access_state]
      additionalProperties: false
      properties:
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        board_id:
          $ref: '#/components/schemas/BoardId'
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
        member_user_ids:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            $ref: '#/components/schemas/UserId'
          description: Selected current Workspace members, excluding the Creator.
        access_version:
          type: integer
          format: int64
          minimum: 1
        access_state:
          $ref: '#/components/schemas/BoardAccessState'
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
    BoardAccessEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardAccess'
    UpdateBoardAccessRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [workspace_access, member_user_ids]
          additionalProperties: false
          properties:
            workspace_access:
              $ref: '#/components/schemas/WorkspaceAccess'
            member_user_ids:
              type: array
              uniqueItems: true
              maxItems: 4
              items:
                $ref: '#/components/schemas/UserId'
              description: Complete selected member set; none clears all selections atomically.
    BoardDocument:
      type: object
