              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingQuoteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: SKU unpriced or unregistered (billing_pricing_unavailable, deterministic, do not retry).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Transient quote failure (billing_quote_unavailable, no SKU oracle).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/rewards/redemptions:
    post:
      tags: [WorkspaceRewards]
      operationId: redeemWorkspaceReward
      summary: Redeem a reward code into the caller wallet (members only, 201)
      description: >-
        Redeems one reward code through the Rewards seam, which Grants
        through credits.Commands inside its own transaction (durable
        per-user replay); the kernel IdempotencyStore adds header-key
        replay for transport retries. Code plaintext never leaves the
        request hash. Unknown, expired, exhausted, or disabled codes
        converge to 422 reward_code_unavailable (no oracle); frozen
        wallets render 409 reward_wallet_locked; key reuse with a
        different request renders 409 reward_redeem_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemWorkspaceRewardRequest'
      responses:
        '201':
          description: Reward redeemed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemWorkspaceRewardResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Frozen wallet (reward_wallet_locked) or idempotency conflict (reward_redeem_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Reward code unavailable (reward_code_unavailable, no oracle).
          headers:
