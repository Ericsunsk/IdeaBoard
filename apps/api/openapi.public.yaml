      additionalProperties: false
      properties:
        board_id:
          $ref: '#/components/schemas/BoardId'
        revision:
          type: integer
          format: int64
          minimum: 1
        schema_version:
          type: integer
          format: int32
          minimum: 1
        document:
          type: object
          description: Canonical snapshot payload object.
        updated_at:
          type: string
          format: date-time
    BoardDocumentEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardDocument'
    ReplaceBoardDocumentRequest:
