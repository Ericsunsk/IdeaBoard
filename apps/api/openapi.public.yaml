  /workspaces/{workspace_id}/task-quotes:
    post:
      tags: [WorkspaceTasks]
      operationId: quoteWorkspaceTask
      summary: Preflight price quote for a task (members only, no persistence)
      description: >-
        Returns an immutable price snapshot with no persistence (separate
