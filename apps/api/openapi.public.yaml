            - $ref: '#/components/schemas/SaveExternalLibraryAssetData'
            - $ref: '#/components/schemas/SaveMediaLibraryAssetData'
          description: Save payload discriminated by source.
    SaveExternalLibraryAssetData:
      type: object
      required: [source, provider, source_id]
      additionalProperties: false
      properties:
