  /workspaces/{workspace_id}/checkout-sessions:
    post:
      tags: [WorkspaceBilling]
      operationId: createWorkspaceCheckoutSession
      summary: Create a recharge checkout session (members only)
      description: >-
        Pricing is server-side only: the request carries the Idea quantity
        plus terms acceptance, never prices or amounts (unknown fields
        such as client-supplied prices are strictly rejected with 400).
        Quantity bounds are 500..500000 Ideas; terms must be accepted at
        the current versions. Requires the Idempotency-Key header: same
        key+hash replays the first session, a different request renders
        409 billing_checkout_conflict. Restricted wallets render 403
        billing_wallet_restricted. Webhook settlement (POST
        /api/webhooks/stripe) is unchanged and settles only through the
        Payments to credits transaction.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceCheckoutRequest'
      responses:
        '201':
          description: Checkout session created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCheckoutSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wallet restricted and not rechargeable (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency-Key reused with a different checkout request (billing_checkout_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Price snapshot or checkout service unavailable (billing_quote_unavailable, service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/checkout-sessions/{session_id}:
    get:
      tags: [WorkspaceBilling]
      operationId: getWorkspaceCheckoutSession
      summary: Get a checkout session status (members only)
      description: >-
        Unknown sessions within a visible workspace render 404
        billing_session_not_found; hidden workspaces converge to 404
        workspace_not_found first.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: session_id
          in: path
          required: true
          description: Opaque checkout session identifier returned at creation.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Checkout session status.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCheckoutSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown checkout session (billing_session_not_found) or hidden workspace (workspace_not_found).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Checkout service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    publicSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Human session via the Better Auth transport (/api/auth/*).
    publicApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Personal API key or OAuth token principal.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token bound to principal, filters and sort order.
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: page_size
      in: query
      required: false
      description: Requested page size. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WorkspaceId'
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganizationId'
    MemberId:
      name: member_id
      in: path
      required: true
      description: External usr_ member identifier (database ids never appear in URLs).
      schema:
        $ref: '#/components/schemas/UserId'
    BoardId:
      name: board_id
      in: path
      required: true
      description: Opaque board_ identifier (malformed shapes converge to 404 board_not_found, never 400).
      schema:
        $ref: '#/components/schemas/BoardId'
    RevisionId:
      name: revision_id
      in: path
      required: true
      description: Board revision number or entry id (unknown values converge to 404 board_not_found).
      schema:
        type: integer
        format: int64
        minimum: 1
    TokenId:
      name: token_id
      in: path
      required: true
      description: Opaque sht_ share token identifier (legacy integer shapes simply miss and read as 404).
      schema:
        $ref: '#/components/schemas/ShareTokenId'
    UploadId:
      name: upload_id
      in: path
      required: true
      description: Opaque upload_ session identifier (malformed shapes converge to 404 upload_not_found).
      schema:
        $ref: '#/components/schemas/UploadId'
    AssetId:
      name: asset_id
      in: path
      required: true
      description: Opaque asset_ media identifier (malformed shapes converge to 404 media_not_found).
      schema:
        $ref: '#/components/schemas/MediaAssetId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Expected board revision (the ETag value from the last read).
        Missing, wildcard, or unparsable values render 400; stale values
        render 409 board_revision_conflict at write time.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-chosen idempotency key, at most 128 characters. Scoped by
        principal, operation and key value. Reuse it when retrying the same
        action; reuse with a different request returns 409 with
        workspace_idempotency_conflict-style codes. No body-level key is accepted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: Request-Id
      in: header
      required: false
      description: Caller-supplied correlation ID echoed back on the response.
      schema:
        type: string
        maxLength: 128
  headers:
    RequestId:
      description: Server-assigned request correlation ID, present on every response.
      schema:
        type: string
    ETag:
      description: Resource version (board revision counter) for optimistic updates; send back as If-Match.
      schema:
        type: string
    RateLimitLimit:
      description: Rate limit ceiling for the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying (429 and 503 with known window).
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request, including missing idempotency keys.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing authentication.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Visible-but-forbidden; hidden resources converge to 404 instead.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Missing or invisible resource (anti-enumeration).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Idempotency-key reuse with a different request.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Validation failure with details.fields.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          description: Resource payload.
        meta:
          type: object
          description: Optional single-resource metadata.
    DeletedEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [deleted]
          additionalProperties: false
          properties:
            deleted:
              type: boolean
    MeEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Me'
    WorkspaceEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Workspace'
    WorkspaceList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    OrganizationEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Organization'
    WorkspaceMemberEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceMemberList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    PaginationMeta:
      type: object
      required: [next_cursor, has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when exhausted.
        has_more:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. workspace_idempotency_conflict.
              example: workspace_idempotency_conflict
            message:
              type: string
              description: User-facing text; may change. Branch on code, not message.
            details:
              type: object
              description: Field-level validation failures under details.fields.
            request_id:
              type: string
              description: Correlation ID matching the Request-Id response header.
    UserId:
      type: string
      pattern: '^usr_[A-Za-z0-9]+$'
      description: Opaque public user identifier.
    OrganizationId:
      type: string
      pattern: '^org_[A-Za-z0-9]+$'
      description: Opaque public organization identifier.
    WorkspaceId:
      type: string
      pattern: '^ws_[A-Za-z0-9]+$'
      description: Opaque public workspace identifier.
    BoardId:
      type: string
      pattern: '^board_[A-Za-z0-9]+$'
      description: Opaque public board identifier.
    TaskId:
      type: string
      pattern: '^task_[A-Za-z0-9]+$'
      description: Opaque public task identifier.
    MediaAssetId:
      type: string
      pattern: '^asset_[A-Za-z0-9]+$'
      description: Opaque public media asset identifier.
    UploadId:
      type: string
      pattern: '^upload_[A-Za-z0-9]+$'
      description: Opaque public upload session identifier.
    EventId:
      type: string
      pattern: '^evt_[A-Za-z0-9]+$'
      description: Opaque public event identifier.
    MembershipRole:
      type: string
      enum: [owner, admin, member]
      description: Workspace/organization membership role.
    Me:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        personal_workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
    Workspace:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/WorkspaceId'
        organization_id:
          anyOf:
            - $ref: '#/components/schemas/OrganizationId'
            - nullable: true
          description: Null for personal workspaces without an organization.
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
    Organization:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OrganizationId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
    WorkspaceMember:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/UserId'
        role:
          $ref: '#/components/schemas/MembershipRole'
        created_at:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            organization_id:
              anyOf:
                - $ref: '#/components/schemas/OrganizationId'
                - nullable: true
    UpdateWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    AddWorkspaceMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [user_id, role]
          additionalProperties: false
          properties:
            user_id:
              $ref: '#/components/schemas/UserId'
            role:
              $ref: '#/components/schemas/MembershipRole'
    UpdateWorkspaceMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [role]
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/MembershipRole'
    CreateOrganizationRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    UpdateOrganizationRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    CreateOrganizationWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    PaginatedWorkspaces:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginatedOrganizations:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ShareTokenId:
      type: string
      pattern: '^sht_[A-Za-z0-9_-]+$'
      description: Opaque share bearer identifier (the bearer itself is shown once at creation only).
    BoardRole:
      type: string
      enum: [owner, editor, viewer]
      description: Explicit board grant role (creator row counts as owner).
    ShareRole:
      type: string
      enum: [editor, viewer]
      description: Share bearer role (owner cannot be granted via shares).
    Board:
      type: object
      required: [id, workspace_id, name, revision, schema_version, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/BoardId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Revision counter, also served as the ETag header.
        schema_version:
          type: integer
          format: int32
          minimum: 1
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BoardEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Board'
    PaginatedBoards:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Board'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    UpdateBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    JoinBoardRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [token]
          additionalProperties: false
          properties:
            token:
              type: string
              minLength: 1
              maxLength: 256
              description: Share bearer plaintext.
    BoardDocument:
      type: object
      required: [board_id, revision, schema_version, document, updated_at]
      additionalProperties: false
      properties:
        board_id:
          $ref: '#/components/schemas/BoardId'
        revision:
          type: integer
          format: int64
          minimum: 1
        schema_version:
          type: integer
          format: int32
          minimum: 1
        document:
          type: object
          description: Canonical snapshot payload object.
        updated_at:
          type: string
          format: date-time
    BoardDocumentEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardDocument'
    ReplaceBoardDocumentRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [schema_version, payload]
          additionalProperties: false
          properties:
            schema_version:
              type: integer
              format: int32
              minimum: 1
            payload:
              type: object
              description: Snapshot payload object (unknown fields rejected).
    BoardRevision:
      type: object
      required: [id, revision, schema_version, source_revision, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Immutable entry id (addressable like the revision number).
        revision:
          type: integer
          format: int64
          minimum: 1
        schema_version:
          type: integer
          format: int32
          minimum: 1
        source_revision:
          type: integer
          format: int64
          minimum: 0
          description: Expected revision the write was based on (0 for revision 1).
        created_by:
          $ref: '#/components/schemas/UserId'
        created_at:
          type: string
          format: date-time
    BoardRevisionDetail:
      type: object
      required: [id, revision, schema_version, source_revision, created_at, snapshot]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 1
        schema_version:
          type: integer
          format: int32
          minimum: 1
        source_revision:
          type: integer
          format: int64
          minimum: 0
        created_by:
          $ref: '#/components/schemas/UserId'
        created_at:
          type: string
          format: date-time
        snapshot:
          type: object
          description: Immutable snapshot bytes as a JSON object.
    BoardRevisionDetailEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardRevisionDetail'
    PaginatedBoardRevisions:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BoardRevision'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BoardMember:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/UserId'
        role:
          $ref: '#/components/schemas/BoardRole'
        created_at:
          type: string
          format: date-time
    BoardMemberEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardMember'
    BoardMemberList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BoardMember'
    AddBoardMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [user_id, role]
          additionalProperties: false
          properties:
            user_id:
              $ref: '#/components/schemas/UserId'
            role:
              $ref: '#/components/schemas/BoardRole'
    UpdateBoardMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [role]
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/BoardRole'
    BoardShareToken:
      type: object
      required: [token_id, token_prefix, role, revoked, usage_count, created_at]
      additionalProperties: false
      properties:
        token_id:
          $ref: '#/components/schemas/ShareTokenId'
        token:
          type: string
          description: Bearer plaintext, returned once at creation (and on idempotent replay), never on list.
        token_prefix:
          type: string
          description: List-safe bearer prefix (first 8 characters).
        role:
          $ref: '#/components/schemas/ShareRole'
        revoked:
          type: boolean
        usage_count:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless revoked.
    BoardShareTokenEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardShareToken'
    BoardShareTokenList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BoardShareToken'
    CreateShareTokenRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [role]
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/ShareRole'
    UploadTarget:
      type: object
      required: [kind, slot, expires_at]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [same-origin-slot]
          description: Opaque same-origin transfer slot (no bucket, secret, or storage key).
        slot:
          $ref: '#/components/schemas/UploadId'
        expires_at:
          type: string
          format: date-time
    UploadSession:
      type: object
      required: [id, workspace_id, status, filename, mime_type, size_bytes, checksum_sha256, media_kind, upload_target, created_at, updated_at, expires_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UploadId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        status:
          type: string
          enum: [pending, transferring, completed, failed, expired]
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          type: string
          description: Canonical image MIME from the supported allowlist.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 31457280
        checksum_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 64-character hex sha256 digest (normalized to lowercase).
        media_kind:
          type: string
          enum: [image]
        upload_target:
          $ref: '#/components/schemas/UploadTarget'
        asset_id:
          $ref: '#/components/schemas/MediaAssetId'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    UploadSessionEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/UploadSession'
    CreateUploadRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [filename, mime_type, size_bytes, checksum_sha256]
          additionalProperties: false
          properties:
            filename:
              type: string
              minLength: 1
              maxLength: 255
            mime_type:
              type: string
              description: Image MIME from the supported allowlist.
            size_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 31457280
            checksum_sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
            media_kind:
              type: string
              enum: [image]
              default: image
              description: Defaults to image when omitted.
    CompleteUploadRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [checksum_sha256, size_bytes]
          additionalProperties: false
          properties:
            checksum_sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
              description: Must equal the session declaration or the session fails terminally.
            size_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 31457280
              description: Must equal the session declaration.
            mime_type:
              type: string
              description: Must match the session declaration when present.
            media_kind:
              type: string
              enum: [image]
              description: Must match the session declaration when present.
            width:
              type: integer
              format: int32
              minimum: 0
              maximum: 32768
              description: Client-declared frame width (byte inspection lands with #805).
            height:
              type: integer
              format: int32
              minimum: 0
              maximum: 32768
              description: Client-declared frame height (byte inspection lands with #805).
    CompleteUploadResult:
      type: object
      required: [upload, asset]
      additionalProperties: false
      properties:
        upload:
          $ref: '#/components/schemas/UploadSession'
        asset:
          $ref: '#/components/schemas/MediaAsset'
    CompleteUploadEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/CompleteUploadResult'
    MediaDerivative:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, ready]
        url:
          type: string
          format: uri
          description: Same-origin derivative URL, present when ready.
    MediaAsset:
      type: object
      required: [id, workspace_id, status, media_kind, mime_type, width, height, size_bytes, checksum_sha256, content_url, derivatives, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/MediaAssetId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        status:
          type: string
          enum: [pending, ready]
          description: pending until byte verification lands (#805); binary reads stay 409 meanwhile.
        media_kind:
          type: string
          enum: [image]
        mime_type:
          type: string
        width:
          type: integer
          format: int32
          minimum: 0
        height:
          type: integer
          format: int32
          minimum: 0
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        content_url:
          type: string
          format: uri
          description: Canonical same-origin content URL.
        derivatives:
          type: object
          description: Display tiers keyed by variant (thumb, preview, large-preview); tiers without stored rows stay pending.
          additionalProperties:
            $ref: '#/components/schemas/MediaDerivative'
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MediaAssetEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/MediaAsset'
    PaginatedMediaAssets:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    WorkspaceBillingAccount:
      type: object
      required: [workspace_id, owner_type]
      additionalProperties: false
      properties:
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        owner_type:
          type: string
          enum: [workspace]
        created_at:
          type: string
          format: date-time
          description: Omitted when empty.
        updated_at:
          type: string
          format: date-time
          description: Omitted when empty.
    WorkspaceBillingAccountEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceBillingAccount'
    WorkspaceCreditsBalance:
      type: object
      required: [workspace_id, available_credits, reserved_credits, status]
      additionalProperties: false
      properties:
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        available_credits:
          type: integer
          format: int64
          minimum: 0
          description: Integer minor units.
        reserved_credits:
          type: integer
          format: int64
          minimum: 0
          description: Integer minor units.
        status:
          type: string
          enum: [active, frozen]
        active_restrictions:
          type: array
          items:
            type: string
          description: Restriction type names; omitted when empty.
    WorkspaceCreditsBalanceEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceCreditsBalance'
    CreditsLedgerEntry:
      type: object
      required: [transaction_id, command_type, amount_credits, available_credits_after, reserved_credits_after, created_at]
      additionalProperties: false
      properties:
        transaction_id:
          type: string
        command_type:
          type: string
          enum: [grant, hold, capture, release, refund, deduction, correction, purchase_credit, purchase_refund, payment_dispute_debit, payment_dispute_restore]
        amount_credits:
          type: integer
          format: int64
          description: Integer minor units (signed).
        available_credits_after:
          type: integer
          format: int64
        reserved_credits_after:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    PaginatedCreditsLedger:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CreditsLedgerEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BillingRecord:
      type: object
      required: [record_id, occurred_at, kind, title, credit_delta, available_credits_after]
      additionalProperties: false
      properties:
        record_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [ai_usage, usage, reward, system_grant, system_adjustment, top_up]
        title:
          type: string
        credit_delta:
          type: integer
          format: int64
          description: Integer minor units (signed).
        available_credits_after:
          type: integer
          format: int64
    PaginatedBillingRecords:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingRecord'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    WorkspaceUsage:
      type: object
      required: [timezone, lifetime, trend]
      additionalProperties: false
      properties:
        timezone:
          type: string
          enum: [Asia/Shanghai]
        lifetime:
          type: object
          required: [total_credits, peak_daily_credits, average_daily_credits, task_count, active_days]
          additionalProperties: false
          properties:
            total_credits:
              type: integer
              format: int64
              minimum: 0
            peak_daily_credits:
              type: integer
              format: int64
              minimum: 0
            average_daily_credits:
              type: number
              minimum: 0
            task_count:
              type: integer
              format: int64
              minimum: 0
            active_days:
              type: integer
              format: int64
              minimum: 0
        trend:
          type: array
          items:
            type: object
            required: [date, credits]
            additionalProperties: false
            properties:
              date:
                type: string
                description: Calendar date (YYYY-MM-DD) in the snapshot timezone.
              credits:
                type: integer
                format: int64
                minimum: 0
    WorkspaceUsageEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceUsage'
    CreateWorkspaceCheckoutRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [idea_quantity, terms_accepted]
          additionalProperties: false
          properties:
            idea_quantity:
              type: integer
              format: int64
              minimum: 500
              maximum: 500000
              description: Idea quantity to recharge (no price fields; pricing is server-side only).
            terms_accepted:
              type: boolean
              description: Must be true at the current terms versions.
            terms_version:
              type: string
              description: Defaults to the current terms version when omitted.
            refund_policy_version:
              type: string
              description: Defaults to the current refund policy version when omitted.
    WorkspaceCheckoutSession:
      type: object
      required: [session_id]
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: Opaque checkout session identifier.
        status:
          type: string
          description: Session status (present on read).
        idea_quantity:
          type: integer
          format: int64
          minimum: 0
        checkout_url:
          type: string
          format: uri
          description: Omitted when empty.
        expires_at:
          type: string
          format: date-time
          description: Omitted when empty.
        reused:
          type: boolean
          description: True when an idempotent replay returned the first session.
    WorkspaceCheckoutSessionEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceCheckoutSession'
