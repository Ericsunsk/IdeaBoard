        Unpriced or unregistered SKU renders billing_pricing_unavailable
        422 deterministic; transient quote failures render
        billing_quote_unavailable 503.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteWorkspaceTaskRequest'
      responses:
        '200':
          description: Price snapshot (settlement_state quoted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskBillingSnapshotEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Price service unavailable (billing_quote_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/uploads:
    post:
      tags: [WorkspaceMedia]
