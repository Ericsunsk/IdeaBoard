    put:
      tags: [WorkspaceMedia]
      operationId: stageWorkspaceUploadBytes
      summary: Stage declared upload bytes (members only, retryable)
      description: >-
        Stages the raw image bytes matching the session declaration
        (size, checksum, MIME). Raw image bytes body (never JSON, never
        multipart). Retryable: 422 validation mismatches change no state.
        Success reuses the UploadSession envelope. Requires the
        Idempotency-Key header (scope upload:bytes): key reuse with a
        different body renders 409 upload_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Raw image bytes matching the session declaration (size, checksum, MIME). Retryable 422s change no state.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Bytes staged; session echoed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
