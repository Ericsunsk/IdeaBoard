    BoardRevision:
      type: object
      required: [id, revision, schema_version, source_revision, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Immutable entry id (addressable like the revision number).
        revision:
          type: integer
          format: int64
          minimum: 1
        schema_version:
          type: integer
          format: int32
          minimum: 1
        source_revision:
          type: integer
          format: int64
          minimum: 0
          description: Expected revision the write was based on (0 for revision 1).
        created_by:
          $ref: '#/components/schemas/UserId'
        created_at:
          type: string
          format: date-time
    BoardRevisionDetail:
      type: object
      required: [id, revision, schema_version, source_revision, created_at, snapshot]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 1
        schema_version:
          type: integer
          format: int32
          minimum: 1
        source_revision:
          type: integer
          format: int64
          minimum: 0
        created_by:
          $ref: '#/components/schemas/UserId'
        created_at:
          type: string
          format: date-time
        snapshot:
          type: object
          description: Immutable snapshot bytes as a JSON object.
    BoardRevisionDetailEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardRevisionDetail'
    PaginatedBoardRevisions:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BoardRevision'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BoardMember:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/UserId'
        role:
          $ref: '#/components/schemas/BoardRole'
        created_at:
          type: string
          format: date-time
    BoardMemberEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardMember'
    BoardMemberList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BoardMember'
    AddBoardMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [user_id, role]
          additionalProperties: false
          properties:
            user_id:
              $ref: '#/components/schemas/UserId'
            role:
              $ref: '#/components/schemas/BoardRole'
    UpdateBoardMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [role]
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/BoardRole'
    BoardShareToken:
      type: object
      required: [token_id, token_prefix, role, revoked, usage_count, created_at]
      additionalProperties: false
      properties:
        token_id:
          $ref: '#/components/schemas/ShareTokenId'
        token:
          type: string
          description: Bearer plaintext, returned once at creation (and on idempotent replay), never on list.
        token_prefix:
          type: string
          description: List-safe bearer prefix (first 8 characters).
        role:
          $ref: '#/components/schemas/ShareRole'
        revoked:
          type: boolean
        usage_count:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless revoked.
    BoardShareTokenEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BoardShareToken'
    BoardShareTokenList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BoardShareToken'
    CreateShareTokenRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [role]
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/ShareRole'
    UploadTarget:
      type: object
      required: [kind, slot, expires_at]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [same-origin-slot]
          description: Opaque same-origin transfer slot (no bucket, secret, or storage key).
        slot:
          $ref: '#/components/schemas/UploadId'
        expires_at:
          type: string
          format: date-time
    UploadSession:
      type: object
      required: [id, workspace_id, status, filename, mime_type, size_bytes, checksum_sha256, media_kind, upload_target, created_at, updated_at, expires_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UploadId'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
        status:
          type: string
          enum: [pending, transferring, completed, failed, expired]
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          type: string
          description: Canonical image MIME from the supported allowlist.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 31457280
        checksum_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 64-character hex sha256 digest (normalized to lowercase).
        media_kind:
          type: string
          enum: [image]
        upload_target:
          $ref: '#/components/schemas/UploadTarget'
        asset_id:
          $ref: '#/components/schemas/MediaAssetId'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    UploadSessionEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/UploadSession'
    CreateUploadRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [filename, mime_type, size_bytes, checksum_sha256]
          additionalProperties: false
          properties:
            filename:
              type: string
              minLength: 1
              maxLength: 255
            mime_type:
              type: string
              description: Image MIME from the supported allowlist.
            size_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 31457280
            checksum_sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
            media_kind:
              type: string
              enum: [image]
              default: image
              description: Defaults to image when omitted.
    CompleteUploadRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [checksum_sha256, size_bytes]
          additionalProperties: false
          properties:
            checksum_sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
              description: Must equal the session declaration or the session fails terminally.
            size_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 31457280
              description: Must equal the session declaration.
            mime_type:
              type: string
              description: Must match the session declaration when present.
            media_kind:
              type: string
              enum: [image]
              description: Must match the session declaration when present.
            width:
              type: integer
              format: int32
              minimum: 0
              maximum: 32768
              description: Client-declared frame width (byte inspection lands with #805).
            height:
              type: integer
              format: int32
              minimum: 0
              maximum: 32768
              description: Client-declared frame height (byte inspection lands with #805).
    CompleteUploadResult:
      type: object
      required: [upload, asset]
      additionalProperties: false
      properties:
        upload:
          $ref: '#/components/schemas/UploadSession'
        asset:
          $ref: '#/components/schemas/MediaAsset'
    CompleteUploadEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/CompleteUploadResult'
    MediaDerivative:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, ready]
        url:
          type: string
          format: uri
          description: Same-origin derivative URL, present when ready.
    MediaAsset:
