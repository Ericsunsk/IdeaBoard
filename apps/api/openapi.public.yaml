    CreateWorkspaceVisionQueryRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            user_text:
              type: string
              maxLength: 200
              description: Free text (at least one of user_text/refs is required).
            library_asset_ids:
              type: array
              maxItems: 4
              items:
                $ref: '#/components/schemas/LibraryAssetId'
              description: Owned workspace library references (no client bytes).
            upload_ids:
              type: array
              maxItems: 4
              items:
                $ref: '#/components/schemas/UploadId'
              description: >-
                Staged workspace upload references (stage-then-reference;
                no client bytes). At most 4 refs combined across
                library_asset_ids, upload_ids, and image_urls.
            image_urls:
              type: array
              maxItems: 4
              items:
                type: string
                format: uri
              description: >-
