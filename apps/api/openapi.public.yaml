        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/boards/{board_id}/access:
    get:
      tags: [Boards]
      operationId: getBoardAccess
      summary: Read the board access fact (owner only)
      description: >-
        Returns the common sharing role, selected member identities,
        monotonic access version, and actual Private/Workspace posture. The version is returned as the ETag
        response header in access-<version> form (disjoint from the
        document revision ETag namespace). Management capability is
        required; every other caller already sees the version fact on
        board payloads.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Board access fact.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardAccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Boards]
      operationId: updateBoardAccess
      summary: Replace the complete sharing configuration (Creator only)
      description: >-
        Replaces workspace_access and the complete member_user_ids set atomically; none clears selections. Requires both
        the Idempotency-Key header and the If-Match precondition carrying
        the expected access version (the access-<version> ETag value from
        the last access read). Missing preconditions render 428
        board_precondition_required; unparsable values render 400; stale
        versions render 412 board_access_conflict; archived boards render
        409 board_archived. No-op replays keep the version; real changes
        bump it without touching the document revision, content_version,
        or Preview Scene. Same key+hash replays the first result, a
        different request renders 409 board_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardAccessRequest'
      responses:
        '200':
          description: Sharing configuration replaced.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardAccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
