                plus.unsplash.com, images.pexels.com). At most 4 refs
                combined across library_asset_ids, upload_ids, and
                image_urls.
    WorkspaceVisionQuery:
      type: object
      required: [operation_id, status, query, created_at]
      additionalProperties: false
      properties:
        operation_id:
          $ref: '#/components/schemas/VisionQueryId'
        status:
          type: string
          enum: [succeeded]
        query:
          type: string
          description: Normalized extracted query.
        replayed:
          type: boolean
          description: True when an idempotent replay returned the first query.
        created_at:
          type: string
          format: date-time
    WorkspaceVisionQueryEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceVisionQuery'
