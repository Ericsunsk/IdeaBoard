          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillingRecords'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
