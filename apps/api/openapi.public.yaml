        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC timestamp; null unless archived.
    Organization:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OrganizationId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
    WorkspaceMember:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/UserId'
        role:
          $ref: '#/components/schemas/MembershipRole'
        created_at:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            organization_id:
              anyOf:
                - $ref: '#/components/schemas/OrganizationId'
                - nullable: true
    UpdateWorkspaceRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    AddWorkspaceMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [user_id, role]
          additionalProperties: false
          properties:
            user_id:
              $ref: '#/components/schemas/UserId'
            role:
              $ref: '#/components/schemas/MembershipRole'
    UpdateWorkspaceMemberRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [role]
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/MembershipRole'
    CreateOrganizationRequest:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [name]
          additionalProperties: false
          properties:
