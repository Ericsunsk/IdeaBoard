        ordered by user. Bearer secrets never appear here.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Board member list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Boards]
      operationId: addBoardMember
      summary: Grant a board role (owner only)
      description: >-
        Requires the Idempotency-Key header. Re-adding an existing member
        keeps the current role. Inviting the implicit owner renders 400
        bad_request; unknown users render 404 board_member_not_found;
        illegal roles render 422 validation_failed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBoardMemberRequest'
      responses:
        '201':
          description: Member added.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards/{board_id}/members/{member_id}:
    patch:
      tags: [Boards]
      operationId: updateBoardMember
      summary: Change a board member role (owner only)
      description: >-
        Demoting the last owner renders 403
        membership_transition_forbidden. Unknown or malformed member ids
        converge to 404 board_member_not_found. No Idempotency-Key is
        required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardMemberRequest'
      responses:
        '200':
          description: Member role updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Boards]
      operationId: removeBoardMember
      summary: Remove a board member (owner manages the roster; anyone may leave)
      description: >-
        Owners may remove anyone; any member may remove themselves
        (self-leave). Removing the last owner renders 403
        membership_transition_forbidden; removing the implicit owner row
        renders 400. Requires the Idempotency-Key header.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Member removed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/boards/{board_id}/shares:
    get:
      tags: [Boards]
      operationId: listShareTokens
      summary: List share tokens without bearers (owner only)
      description: >-
        List entries carry the list-safe token_prefix only; the bearer
        plaintext is shown once at creation (and on idempotent replay)
        and never here.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Share token list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardShareTokenList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Boards]
      operationId: createShareToken
      summary: Create a share bearer (owner only)
      description: >-
        Requires the Idempotency-Key header; same key+hash replays the
        same bearer, a different request renders 409
        board_idempotency_conflict. Share roles are editor or viewer
        only (anything else renders 422 validation_failed). The bearer
        `token` is returned once and must be stored by the caller.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareTokenRequest'
      responses:
        '201':
          description: Share token created (bearer shown once).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardShareTokenEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards/{board_id}/shares/{token_id}:
    delete:
      tags: [Boards]
      operationId: revokeShareToken
      summary: Revoke a share token (owner only)
      description: >-
        Requires the Idempotency-Key header. Revocation is idempotent:
        revoking twice succeeds. Unknown token ids converge to 404
        board_share_token_not_found. Joins against the bearer converge to
        the same 404 afterwards.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/TokenId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Share token revoked.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/uploads:
    post:
      tags: [Uploads]
      operationId: createUploadSession
      summary: Declare an upload session (workspace members only)
      description: >-
        Declares filename, MIME, size, checksum, and media kind; the
        session coordinates transfer only and creates no durable asset.
        Only image declarations are accepted in this slice. Requires the
        Idempotency-Key header (scope upload:create): key reuse with a
        different declaration renders 409 upload_idempotency_conflict.
        Declaration failures render 422 upload_validation_failed with
        details.fields. Byte transfer rides the opaque same-origin slot
        named in upload_target (no bucket, secret, or storage key ever
        leaves the server).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload session declared.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/uploads/{upload_id}:
    get:
      tags: [Uploads]
      operationId: getUploadSession
      summary: Get an upload session (workspace members only)
      description: >-
        The first read moves a pending session to transferring. Expired
        sessions render 410 upload_expired; cross-workspace ids are
        invisible and render 404 upload_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Upload session detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Upload session expired (upload_expired); declare a new session.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/uploads/{upload_id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUploadSession
      summary: Complete an upload session and materialize the media asset
      description: >-
        The completion echo (checksum, size, and MIME/kind when present)
        must equal the session declarations byte-for-byte, otherwise the
        session fails terminally and completion renders 422
        upload_validation_failed. Completing a terminal session renders
        409 upload_state_conflict. Only a successful complete creates the
        durable media asset row, returned alongside the session.
        Requires the Idempotency-Key header (scope upload:complete).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: Upload completed with its media asset.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: Upload session expired (upload_expired); declare a new session.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/media-assets:
    get:
      tags: [MediaAssets]
      operationId: listMediaAssets
      summary: List workspace media assets with cursor pagination (members only)
      description: >-
        Any workspace member reads any workspace asset; archived assets
        are hidden from the list (they stay metadata-readable by id).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated media asset list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAssets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/media-assets/{asset_id}:
    get:
      tags: [MediaAssets]
      operationId: getMediaAsset
      summary: Get media asset metadata (members only)
      description: >-
        Metadata speaks the JSON envelope only and never carries storage
        keys. Archived assets stay metadata-readable (archived_at set).
        Cross-workspace ids are invisible and render 404 media_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Media asset metadata.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/media-assets/{asset_id}/content:
    get:
      tags: [MediaAssets]
      operationId: getMediaAssetContent
      summary: Download asset bytes (members only)
      description: >-
        Binary endpoint: serves raw bytes with the asset MIME type and
        never the JSON envelope, never storage keys. Every failure
        (including auth) is a plain non-JSON status with the same
        semantics: 404 invisible asset or workspace, 409 asset not ready,
        410 asset archived.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Raw asset bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Missing authentication (plain-text body, never the JSON envelope).
        '404':
          description: Invisible asset or workspace (plain-text body, never the JSON envelope).
        '409':
          description: Asset bytes not ready (plain-text body, never the JSON envelope).
        '410':
          description: Asset archived (media_archived; plain-text body, never the JSON envelope).
  /workspaces/{workspace_id}/media-assets/{asset_id}/derivatives/{variant}:
    get:
      tags: [MediaAssets]
      operationId: getMediaAssetDerivative
      summary: Download a stored derivative rendition (members only)
      description: >-
        Binary endpoint with the same plain-status protocol as content:
        unknown tiers render a plain 400, tiers without a stored row
        render a plain 409, archived assets a plain 410. There is no
        pull-through rendering on this path.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
        - name: variant
          in: path
          required: true
          description: Derivative tier.
          schema:
            type: string
            enum: [thumb, preview, large-preview]
      responses:
        '200':
          description: Raw derivative bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Unknown derivative tier (plain-text body, never the JSON envelope).
        '401':
          description: Missing authentication (plain-text body, never the JSON envelope).
        '404':
          description: Invisible asset or workspace (plain-text body, never the JSON envelope).
        '409':
          description: Tier not materialized or asset not ready (plain-text body, never the JSON envelope).
        '410':
          description: Asset archived (media_archived; plain-text body, never the JSON envelope).
  /workspaces/{workspace_id}/media-assets/{asset_id}/archive:
    post:
      tags: [MediaAssets]
      operationId: archiveMediaAsset
      summary: Archive a media asset (owner/admin only)
      description: >-
        Documented deviation: the archive action is a POST /archive
        sub-resource (not an `:archive` action suffix) to keep Gin
        routing collision-free. Requires the Idempotency-Key header.
        Non-admin members render 403 workspace_forbidden. Archived assets
        stay metadata-readable but binary reads go 410.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Media asset archived.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/billing-account:
