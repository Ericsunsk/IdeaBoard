openapi: 3.0.3
info:
  title: IdeaBoard Public API
  version: 0.1.0
  description: |
    Public Data Plane API at /api/v1 for identity, workspaces,
    organizations, board collaboration, media assets, billing, tasks,
    library, and search. Envelopes, cursor pagination, idempotency and
    correlation headers, and opaque public identifiers follow the
    contract kernel.
servers:
  - url: /api/v1
security:
  - publicSession: []
  - publicApiKey: []
tags:
  - name: User
    description: Identity-owned profile and preferences of the current principal.
  - name: Workspaces
    description: Workspace lifecycle and membership.
  - name: Organizations
    description: Organization lifecycle and organization-scoped workspaces.
  - name: WorkspaceMembers
    description: Workspace membership and role transitions.
  - name: Boards
    description: Workspace-rooted board collaboration, documents, and access management.
  - name: WorkspaceBilling
    description: Implicit per-workspace billing account, credits, and checkout.
  - name: WorkspaceRewards
    description: Caller-scoped reward redemptions settled into the credits ledger.
  - name: WorkspaceTasks
    description: Workspace-scoped async task lifecycle (submit, read, cancel, outputs, quotes).
  - name: WorkspaceLibrary
    description: Workspace-scoped library folders and saved provider references.
  - name: WorkspaceMedia
    description: Workspace-scoped upload sessions, media assets, and derivatives.
  - name: WorkspaceSearch
    description: Workspace-scoped provider search and vision queries.
paths:
  /support-channels:
    get:
      tags: [User]
      operationId: getSupportChannels
      summary: List enabled customer support channels
      description: Public settings endpoint; only enabled channels are returned.
      security: []
      responses:
        '200':
          description: Enabled support channels.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportChannelsSettingEnvelope'
        '503':
          description: Support channel settings unavailable.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /user:
    get:
      tags: [User]
      operationId: getUser
      summary: Get the current principal profile
      description: >-
        Returns the session principal with the external usr_ identifier.
        Provisions the personal workspace idempotently on first call.
      responses:
        '200':
          description: Current principal profile.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Profile projection unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /user/avatar:
    put:
      tags: [User]
      operationId: uploadAvatar
      summary: Replace the caller profile avatar (user-scoped, raw bytes)
      description: >-
        Replaces the caller's profile avatar. The request is raw image
        bytes (never JSON, never multipart); MIME is sniffed from the
        bytes against the image allowlist and capped at 5MiB. Bytes
        persist through the storage abstraction (active profile) under
        the canonical content-hashed key uploads/avatars/{uid}/{hash}.ext.
        The response envelope carries the public avatar route URL
        (/api/v1/public/users/{uid}/avatar?v={version}). The Idempotency-Key header
        is optional (scope avatar:upload): absent keys are minted
        server-side from the content hash; key reuse with a different
        body renders 409 media_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Raw image bytes (allowlisted image MIME, 5MiB cap). Persisted under the canonical avatar key; served back by the public avatar route.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        '200':
          description: Avatar replaced.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Idempotency conflict (media_idempotency_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '501':
          description: Avatar surface not implemented (contract_not_implemented).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Avatar service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /public/users/{uid}/avatar:
    get:
      tags: [User]
      operationId: getPublicUserAvatar
      summary: Read a user's public avatar (no auth, size variants)
      description: >-
        Public avatar delivery (no auth: avatars are public). Returns
        rendered image bytes at the requested size
        (32|64|128|256, default 64); callers without a custom avatar get
        the bundled default SVG inline. Malformed uids and sizes outside
        the whitelist render plain 400; unknown uids render plain 404.
        Responses carry no JSON envelope. Per-IP rate limiting rides the
        global middleware, like every v1 route.
      security: []
      parameters:
        - name: uid
          in: path
          required: true
          description: Media storage namespace UID (6 uppercase alphanumerics); unknown values converge to 404.
          schema:
            type: string
            pattern: "^[A-Z0-9]{6}$"
        - name: size
          in: query
          required: false
          description: Square display size. Defaults to 64; anything outside 32|64|128|256 renders 400.
          schema:
            type: integer
            enum: [32, 64, 128, 256]
            default: 64
        - name: v
          in: query
          required: false
          description: Content version used to refresh avatar consumers after replacement.
          schema:
            type: string
      responses:
        "200":
          description: >-
            Rendered WebP or bundled default SVG (no custom avatar set);
            Cache-Control: no-store.
          headers:
            Cache-Control:
              description: Response cache policy (no-store).
              schema:
                type: string
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Avatar has no servable source (media_not_ready).
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Avatar service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /public/branding/logo:
    get:
      tags: [User]
      operationId: getPublicBrandingLogo
      summary: Read an uploaded branding logo (no auth)
      description: >-
        Returns rendered WebP bytes for the requested canonical site-asset key.
        The requested upload can be previewed before the branding setting is saved.
        Responses carry no JSON envelope and Cache-Control is no-store.
      security: []
      parameters:
        - name: key
          in: query
          required: true
          description: Canonical uploads/site/assets/ object key.
          schema:
            type: string
      responses:
        "200":
          description: Rendered logo image bytes.
          headers:
            Cache-Control:
              schema:
                type: string
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Missing or invalid site-asset key (plain status).
        "404":
          description: Logo object not found (plain status).
        "409":
          description: Logo source unavailable (plain status).
        "503":
          description: Renderer unavailable (plain status).

  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List visible workspaces with cursor pagination
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated workspace list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaces'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get a workspace by explicit workspace context
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Rename a workspace (owner/admin only)
      description: >-
        Renames the workspace. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/archive:
    post:
      tags: [Workspaces]
      operationId: archiveWorkspace
      summary: Archive a workspace (owner/admin only)
      description: >-
        Archives the workspace. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace archived.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/members:
    get:
      tags: [WorkspaceMembers]
      operationId: listWorkspaceMembers
      summary: List workspace members (members only)
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace member list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [WorkspaceMembers]
      operationId: addWorkspaceMember
      summary: Add a workspace member (owner/admin only; owner-only promotion)
      description: >-
        Requires the Idempotency-Key header. Re-adding an existing member
        keeps the current role, including when the workspace is full.
        Workspaces support at most 5 members including owners; exceeding
        this limit renders 409 workspace_member_limit_reached.
        Reusing a key with a different request
        renders 409 workspace_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceMemberRequest'
      responses:
        '201':
          description: Member added.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/members/lookup:
    get:
      tags: [WorkspaceMembers]
      operationId: lookupWorkspaceMemberByEmail
      summary: Look up a registered user by email (owner/admin only)
      description: >-
        Resolves one registered user to its usr_ identifier by exact email
        match (trimmed, case-insensitive) for the invite flow. Only
        workspace owners/admins may call it: non-members converge to 404
        workspace_not_found, visible members without the capability render
        403. Unknown emails converge to 404 workspace_member_not_found,
        indistinguishable from unregistered identities. The email is
        resolved through the Auth identity and never stored; the response
        carries only the usr_ identifier. This is a read-only query: it
        performs no membership write (invite with POST
        /workspaces/{workspace_id}/members using the resolved usr_,
        role, and Idempotency-Key). Abuse is bounded by the existing
        global per-IP rate limiting plus the single-address exact-match
        shape (no batch enumeration).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberLookupEmail'
      responses:
        '200':
          description: User resolved to its public identifier.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberLookupEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/members/{member_id}:
    patch:
      tags: [WorkspaceMembers]
      operationId: updateWorkspaceMember
      summary: Change a member role (last owner cannot be demoted)
      description: >-
        Changes a member role. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberRequest'
      responses:
        '200':
          description: Member role updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [WorkspaceMembers]
      operationId: removeWorkspaceMember
      summary: Remove a workspace member (last owner cannot be removed)
      description: >-
        Removes a workspace member. Requires the Idempotency-Key header.
        Reusing a key with a different request renders 409
        workspace_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Member removed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List visible organizations with cursor pagination
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated organization list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizations'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organization_id}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization by explicit organization context
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Rename an organization (owner/admin only)
      description: >-
        Renames the organization. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organization_id}/workspaces:
    get:
      tags: [Organizations]
      operationId: listOrganizationWorkspaces
      summary: List workspaces of an organization (org members only)
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization workspace list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Organizations]
      operationId: createOrganizationWorkspace
      summary: Create an organization workspace (org owner/admin only)
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationWorkspaceRequest'
      responses:
        '201':
          description: Organization workspace created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards:
    get:
      tags: [Boards]
      operationId: listBoards
      summary: List accessible boards of a workspace with cursor pagination
      description: >-
        Lists non-archived boards visible to the caller under the unified
        board policy: the current-member Creator and explicitly selected
        current Workspace members at the common Viewer/Editor role. Each card carries metadata plus the stored preview scene
        projection (content_version, preview_scene) without a document
        fetch, plus the caller relationship and capabilities — never the
        full ACL. Boards without an effective role stay invisible and are
        excluded, never 403. Hidden workspaces converge to 404
        workspace_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated board list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoards'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Boards]
      operationId: createBoard
      summary: Create a board (workspace members only)
      description: >-
        Creates a board at revision 1 with the empty document snapshot;
        the creator is the implicit owner. The server fixes
        workspace_access to none: creation requests cannot widen access.
        Requires the Idempotency-Key
        header (scope board:create): missing keys render 400
        idempotency_key_required, key reuse with a different request
        renders 409 board_idempotency_conflict, same key+hash replays the
        first result. Unknown body fields are rejected with 400; blank or
        overlong names render 422 validation_failed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
      responses:
        '201':
          description: Board created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
