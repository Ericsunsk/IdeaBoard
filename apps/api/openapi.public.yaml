  /workspaces/{workspace_id}/media-assets/{asset_id}/archive:
    post:
      tags: [WorkspaceMedia]
      operationId: archiveWorkspaceMediaAsset
      summary: Archive a workspace media asset (owner/admin only, 200)
      description: >-
        Stamps the archive lifecycle marker. Repeat archives converge on
