              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/tasks:
    get:
      tags: [WorkspaceTasks]
      operationId: listWorkspaceTasks
      summary: List workspace tasks with cursor pagination (members only)
      description: >-
        Lists workspace tasks oldest-first with cursor pagination. Hidden
        workspaces converge to 404 task_not_found (never
        workspace_not_found) so the task surface never leaks workspace
        existence. Tasks are submitter- or current-Board-reader-only:
        Board-less tasks by other submitters are silently skipped, so
        omitting the Board ID never degrades into workspace-wide
        visibility.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated task list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaceTasks'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [WorkspaceTasks]
      operationId: createWorkspaceTask
      summary: Submit a workspace task (members only, 202 + Location)
      description: >-
        Submits an async task under the discriminated input union
        {service, inputs:{media_asset_ids}, params}: service
        names a registered AI image service (generation, inpaint, render,
        variations, cutout, fusion, upscale, outpaint); media_asset_ids
        carry asset_... references only (no raw storage URLs); unknown
        params keys and storage URLs render 422 validation_failed with
        details.fields. Settlement runs Quote -> Hold -> Insert -> Enqueue
        with compensating rollback. Requires the Idempotency-Key header
        (scope task:create): same key+hash replays the first task, key
        reuse with a different request renders 409
        task_idempotency_conflict. Insufficient Ideas render 402
        task_insufficient_credits. Billing settles against a server-side
        quote for the ai-image:<service> SKU (unpriced or unregistered SKU
        renders billing_pricing_unavailable 422 deterministic, transient
        quote failures billing_quote_unavailable 503,
        billing_wallet_restricted 403). Missing Service Model Pool routing
        returns service_resolution_unavailable 422 before Quote/Hold.
        Resolution semantics: params.output_resolution is the client
        source of truth; an explicit top-level resolution must agree
        with it exactly (case-insensitive) or submit fails 422
        validation_failed on details.fields.resolution. An omitted
        resolution is normalized once to the Service policy's canonical
        1k/2k/4k value. Only 1k, 2k, and 4k are accepted; default is not a
        request or billing variant. An optional data.board_id binds a
        Canvas submit to its Board (Board identity + generate capability
        validated before Quote/Hold; invisible Boards render 404
        board_not_found, archived Boards 409 board_archived, visible
        Boards without generate capability 403 task_forbidden).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceTaskRequest'
      responses:
        '202':
          description: Task accepted for async execution.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: Canonical task URL (/api/v1/workspaces/{workspace_id}/tasks/{task_id}).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Insufficient Ideas (task_insufficient_credits).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Visible-but-forbidden (task_forbidden) or restricted wallet (billing_wallet_restricted).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Validation failure (validation_failed), unavailable Service resolution (service_resolution_unavailable), or SKU unpriced/unregistered (billing_pricing_unavailable, deterministic, do not retry).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Quote or task service unavailable (billing_quote_unavailable, service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/tasks/{task_id}:
    get:
      tags: [WorkspaceTasks]
      operationId: getWorkspaceTask
      summary: Get a workspace task (members only)
      description: >-
        Malformed task_ shapes, unknown tasks, and cross-workspace ids
        converge to 404 task_not_found. Tasks are submitter- or
        current-Board-reader-only (other callers converge to 404
        task_not_found). The response carries no params object (params are
