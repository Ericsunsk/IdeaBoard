          $ref: '#/components/schemas/WorkspaceId'
        status:
          type: string
          enum: [pending, ready]
          description: pending until byte verification lands (#805); binary reads stay 409 meanwhile.
        media_kind:
          type: string
          enum: [image]
        mime_type:
          type: string
        width:
          type: integer
          format: int32
          minimum: 0
        height:
          type: integer
          format: int32
          minimum: 0
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        content_url:
          type: string
          format: uri
          description: Canonical same-origin content URL.
        derivatives:
          type: object
          description: Display tiers keyed by variant (thumb, preview, large-preview); render on demand once the asset is ready, and stay pending while it is not.
          additionalProperties:
            $ref: '#/components/schemas/MediaDerivative'
