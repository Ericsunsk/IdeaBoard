openapi: 3.0.3
info:
  title: IdeaBoard Public API
  version: 0.1.0
  description: |
    Public Data Plane contract (issue #800 kernel, #801 workspace/
    organization/member lifecycle, #802 board collaboration, #803 upload
    sessions + media assets, #804 workspace billing, #805 workspace tasks,
    #806 workspace library + search). Canonical prefix
    is /api/v1. Envelopes, cursor pagination, idempotency and correlation
    headers, and opaque public identifiers follow the contract kernel.
    The legacy single-file contract in apps/api/openapi.yaml is
    untouched; deletion is #809.
servers:
  - url: /api/v1
security:
  - publicSession: []
  - publicApiKey: []
tags:
  - name: User
    description: Identity-owned profile and preferences of the current principal.
  - name: Workspaces
    description: Workspace lifecycle and membership.
  - name: Organizations
    description: Organization lifecycle and organization-scoped workspaces.
  - name: WorkspaceMembers
    description: Workspace membership and role transitions.
  - name: Boards
    description: Workspace-rooted board collaboration, documents, and share tokens.
  - name: WorkspaceBilling
    description: Implicit per-workspace billing account, credits, and checkout.
  - name: WorkspaceRewards
    description: Caller-scoped reward redemptions settled into the credits ledger.
  - name: WorkspaceTasks
    description: Workspace-scoped async task lifecycle (submit, read, cancel, outputs, quotes).
  - name: WorkspaceLibrary
    description: Workspace-scoped library folders and saved provider references.
  - name: WorkspaceMedia
    description: Workspace-scoped upload sessions, media assets, and derivatives.
  - name: WorkspaceSearch
    description: Workspace-scoped provider search and vision queries.
paths:
  /user:
    get:
      tags: [User]
      operationId: getUser
      summary: Get the current principal profile
      description: >-
        Returns the session principal with the external usr_ identifier.
        Provisions the personal workspace idempotently on first call.
      responses:
        '200':
          description: Current principal profile.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user/avatar:
    put:
      tags: [User]
      operationId: uploadAvatar
      summary: Replace the caller profile avatar (user-scoped, raw bytes)
      description: >-
        Replaces the caller's profile avatar. The request is raw image
        bytes (never JSON, never multipart); MIME is sniffed from the
        bytes against the image allowlist and capped at 5MiB. The
        response envelope carries the avatar URL served back by the
        existing static /uploads/profile/{uid}/avatar reads. Requires
        the Idempotency-Key header (scope avatar:upload): key reuse with
        a different body renders 409 media_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Raw image bytes (allowlisted image MIME, 5MiB cap). Served back by the existing static /uploads/profile/{uid}/avatar reads.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        '200':
          description: Avatar replaced.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Idempotency conflict (media_idempotency_conflict).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '501':
          description: Avatar surface not implemented (contract_not_implemented).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Avatar service unavailable (service_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List visible workspaces with cursor pagination
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated workspace list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaces'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get a workspace by explicit workspace context
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Rename a workspace (owner/admin only)
      description: >-
        Renames the workspace. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/archive:
    post:
      tags: [Workspaces]
      operationId: archiveWorkspace
      summary: Archive a workspace (owner/admin only)
      description: >-
        Archives the workspace. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace archived.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/members:
    get:
      tags: [WorkspaceMembers]
      operationId: listWorkspaceMembers
      summary: List workspace members (members only)
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace member list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [WorkspaceMembers]
      operationId: addWorkspaceMember
      summary: Add a workspace member (owner/admin only; owner-only promotion)
      description: >-
        Requires the Idempotency-Key header. Re-adding an existing member
        keeps the current role. Reusing a key with a different request
        renders 409 workspace_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceMemberRequest'
      responses:
        '201':
          description: Member added.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/members/{member_id}:
    patch:
      tags: [WorkspaceMembers]
      operationId: updateWorkspaceMember
      summary: Change a member role (last owner cannot be demoted)
      description: >-
        Changes a member role. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberRequest'
      responses:
        '200':
          description: Member role updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [WorkspaceMembers]
      operationId: removeWorkspaceMember
      summary: Remove a workspace member (last owner cannot be removed)
      description: >-
        Removes a workspace member. Requires the Idempotency-Key header.
        Reusing a key with a different request renders 409
        workspace_idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Member removed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List visible organizations with cursor pagination
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated organization list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizations'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organization_id}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization by explicit organization context
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Rename an organization (owner/admin only)
      description: >-
        Renames the organization. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organization_id}/workspaces:
    get:
      tags: [Organizations]
      operationId: listOrganizationWorkspaces
      summary: List workspaces of an organization (org members only)
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization workspace list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Organizations]
      operationId: createOrganizationWorkspace
      summary: Create an organization workspace (org owner/admin only)
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationWorkspaceRequest'
      responses:
        '201':
          description: Organization workspace created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards:
    get:
      tags: [Boards]
      operationId: listBoards
      summary: List accessible boards of a workspace with cursor pagination
      description: >-
        Lists non-archived boards the caller holds an explicit board role
        on (owner, editor, or viewer). Workspace membership alone never
        grants board access: boards without a grant stay invisible and are
        excluded, never 403. Hidden workspaces converge to 404
        workspace_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated board list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoards'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Boards]
      operationId: createBoard
      summary: Create a board (workspace members only)
      description: >-
        Creates a board at revision 1 with the empty document snapshot;
        the creator is the implicit owner. Requires the Idempotency-Key
        header (scope board:create): missing keys render 400
        idempotency_key_required, key reuse with a different request
        renders 409 board_idempotency_conflict, same key+hash replays the
        first result. Unknown body fields are rejected with 400; blank or
        overlong names render 422 validation_failed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
      responses:
        '201':
          description: Board created.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards/join:
    post:
      tags: [Boards]
      operationId: joinBoardByToken
      summary: Join a board with a share bearer
      description: >-
        The bearer is the capability: the caller needs no prior workspace
        membership or board grant, and a successful join grants workspace
        membership (member) alongside the board grant. Requires the
        Idempotency-Key header. Every join failure (unknown, revoked, or
        foreign-workspace bearer) converges to 404
        board_share_token_not_found so existence is never leaked; only
        malformed input renders 400.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinBoardRequest'
      responses:
        '200':
          description: Joined board.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/boards/{board_id}:
    get:
      tags: [Boards]
      operationId: getBoard
      summary: Get a board (any board role)
      description: >-
        Malformed ids, unknown boards, and callers holding no board role
        converge to 404 board_not_found. The revision counter is returned
        as the ETag response header.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Board detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Boards]
      operationId: updateBoard
      summary: Rename a board (owner/editor only)
      description: >-
        Viewers render 403 board_forbidden. Writes against an archived
        board render 409 board_archived. Blank or overlong names
        render 422 validation_failed. No Idempotency-Key is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardRequest'
      responses:
        '200':
          description: Board renamed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspace_id}/boards/{board_id}/archive:
    post:
      tags: [Boards]
      operationId: archiveBoard
      summary: Archive a board (owner/editor only)
      description: >-
        Requires the Idempotency-Key header. Already-archived boards read
        as 404 board_not_found so archive stays idempotent-safe.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Board archived.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/boards/{board_id}/restore:
    post:
      tags: [Boards]
      operationId: restoreBoard
      summary: Restore an archived board (owner/editor only)
      description: >-
        Requires the Idempotency-Key header. Live boards read as 404
        board_not_found.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Board restored.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/boards/{board_id}/document:
    get:
      tags: [Boards]
      operationId: getBoardDocument
      summary: Get the board document snapshot (any board role)
      description: >-
        Returns the canonical snapshot envelope with the revision counter
        as the ETag response header.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: Board document snapshot.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDocumentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Boards]
      operationId: replaceBoardDocument
      summary: Replace the board document (owner/editor only, optimistic concurrency)
      description: >-
        Requires both the Idempotency-Key header and the If-Match
        precondition carrying the expected revision (the ETag value from
        the last read). Missing, wildcard, or unparsable preconditions
        render 400; stale revisions render 409 board_revision_conflict;
        archived boards render 409 board_archived.
        The snapshot is a versioned discriminated union
        {schema_version, payload}: unknown fields are rejected with 400.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBoardDocumentRequest'
      responses:
        '200':
          description: Document replaced; revision advanced.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDocumentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/boards/{board_id}/revisions:
    get:
      tags: [Boards]
      operationId: listBoardRevisions
      summary: List immutable document revisions (any board role)
      description: >-
        Revisions are INSERT-only and returned oldest-first with cursor
        pagination.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
