              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTaskOutputsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/task-quotes:
    post:
      tags: [WorkspaceTasks]
      operationId: quoteWorkspaceTask
      summary: Preflight price quote for a task (members only, no persistence)
      description: >-
        Returns an immutable price snapshot with no persistence (separate
