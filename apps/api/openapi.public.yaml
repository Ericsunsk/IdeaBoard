  /workspaces/{workspace_id}/billing-quotes:
    post:
      tags: [WorkspaceBilling]
      operationId: createWorkspaceBillingQuote
      summary: Mint a server-side billing quote (members only, no persistence)
      description: >-
        Mints an immutable price snapshot with no persistence (preflight,
        like task-quotes): the quote path is the only place a price is
        ever shown, and settlement re-quotes authoritatively. Covers the
        ai-search:vision SKU (post {data:{sku:"ai-search:vision"}} and
        read total_credits). No price fields are accepted (unknown fields
        rejected with 400); unpriced or unregistered SKUs converge to
        billing_pricing_unavailable (422, deterministic, no SKU oracle),
        transient quote failures to billing_quote_unavailable (503). No
        Idempotency-Key: pure read, safe to retry. For ai-image SKUs an
        omitted output_resolution is normalized to the Service policy's
        canonical 1k/2k/4k value and availability is checked before pricing
        (empty pool renders service_resolution_unavailable 422). The only
        accepted resolutions are 1k, 2k, and 4k.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceBillingQuoteRequest'
      responses:
        '200':
          description: Immutable billing quote.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingQuoteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: SKU unpriced or unregistered (billing_pricing_unavailable, deterministic, do not retry), invalid resolution (validation_failed), or unavailable Service resolution for ai-image SKUs (service_resolution_unavailable).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Transient quote failure (billing_quote_unavailable, no SKU oracle).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /workspaces/{workspace_id}/rewards/redemptions:
    post:
      tags: [WorkspaceRewards]
      operationId: redeemWorkspaceReward
      summary: Redeem a reward code into the caller wallet (members only, 201)
      description: >-
        Redeems one reward code through the Rewards seam, which Grants
        through credits.Commands inside its own transaction (durable
        per-user replay); the kernel IdempotencyStore adds header-key
        replay for transport retries. Code plaintext never leaves the
        request hash. Unknown, expired, exhausted, or disabled codes
        converge to 422 reward_code_unavailable (no oracle); frozen
        wallets render 409 reward_wallet_locked; key reuse with a
        different request renders 409 reward_redeem_conflict.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
