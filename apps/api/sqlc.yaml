version: "2"
sql:
  - engine: "mysql"
    schema: "internal/db/schema/schema.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "dbsqlc"
        out: "internal/db/sqlc"
        sql_package: "database/sql"
        sql_driver: "github.com/go-sql-driver/mysql"
        emit_interface: true
        emit_json_tags: true
