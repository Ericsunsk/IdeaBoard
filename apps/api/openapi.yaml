components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    BoardId:
      name: board_id
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    StorageProfileId:
      name: id
      in: path
      required: true
      schema: { type: string }
    LineDraftModeId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    MemberUid:
      name: member_uid
      in: path
      required: true
      schema: { type: string }
    ShareTokenID:
      name: token_id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer }

  schemas:
    ApiResponseBase:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer }
        msg: { type: string }

    User:
      type: object
      required: [id, uid, username, role, status, created_at, updated_at]
      properties:
        id: { type: integer }
        uid: { type: string }
        username: { type: string }
        auth_user_id: { type: string }
        avatar: { type: string }
        role: { type: string }
        status: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    UserBoardItem:
      type: object
      required: [board_id, name, state, revision, state_schema_version, created_at, updated_at]
      properties:
        board_id: { type: string }
        name: { type: string }
        state:
          $ref: '#/components/schemas/BoardStateEnvelope'
        access_role:
          type: string
          enum: [owner, editor, viewer]
        revision: { type: integer }
        state_schema_version: { type: integer }
        created_at: { type: number }
        updated_at: { type: number }

    UserBoardUpsertRequest:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state:
          $ref: '#/components/schemas/BoardStateEnvelope'
        created_at: { type: number }
        updated_at: { type: number }

    BoardStateEnvelope:
      type: object
      required: [schemaVersion, imageNodes, promptNodes, fusionNodes, connections, updatedAt]
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        imageNodes:
          type: array
          items:
            $ref: '#/components/schemas/BoardStateNode'
        promptNodes:
          type: array
          items:
            $ref: '#/components/schemas/BoardStateNode'
        fusionNodes:
          type: array
          items:
            $ref: '#/components/schemas/BoardStateNode'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/BoardStateConnection'
        mediaRefs:
          type: array
          items:
            $ref: '#/components/schemas/BoardStateMediaRef'
        previewSnapshotDataUrl: { type: string, minLength: 1 }
        previewSnapshotUpdatedAt: { type: number }
        previewSnapshotVersion: { type: integer, minimum: 1 }
        updatedAt: { type: number }

    BoardStateNode:
      type: object
      additionalProperties: true

    BoardStateConnection:
      type: object
      additionalProperties: true

    BoardStateMediaRef:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }

    BoardMemberItem:
      type: object
      required: [user_id, member_uid, username, role]
      properties:
        user_id: { type: integer }
        member_uid: { type: string }
        username: { type: string }
        role:
          type: string
          enum: [owner, editor, viewer]

    BoardShareTokenItem:
      type: object
      required: [id, token_prefix, role, revoked, usage_count, created_at, updated_at]
      properties:
        id: { type: integer }
        token: { type: string }
        token_prefix: { type: string }
        role:
          type: string
          enum: [editor, viewer]
        revoked: { type: boolean }
        usage_count: { type: integer }
        max_uses:
          type: integer
          nullable: true
        last_used_at:
          type: number
          nullable: true
        revoked_at:
          type: number
          nullable: true
        expires_at:
          type: number
          nullable: true
        created_at: { type: number }
        updated_at: { type: number }
        share_url: { type: string }

    InviteBoardMemberRequest:
      type: object
      required: [member_uid, role]
      properties:
        member_uid: { type: string }
        role:
          type: string
          enum: [editor, viewer]

    UpdateBoardMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [editor, viewer]

    CreateBoardShareTokenRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [editor, viewer]
        expires_at:
          type: number
          nullable: true

    JoinBoardByShareTokenBody:
      type: object
      required: [token]
      properties:
        token: { type: string }

    Task:
      type: object
      required: [id, task_id, user_id, prompt, status, created_at, updated_at]
      properties:
        id: { type: integer }
        task_id: { type: string }
        user_id: { type: integer }
        assigned_channel_id:
          type: integer
          nullable: true
        account_id:
          type: integer
          nullable: true
        prompt: { type: string }
        user_prompt: { type: string }
        params: { type: string }
        feature_slug: { type: string }
        requested_model: { type: string }
        resolved_model: { type: string }
        api_type: { type: string }
        status: { type: string }
        retry_count: { type: integer }
        error_msg: { type: string }
        result: { type: string }
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/TaskOutput'
        execution_metrics:
          $ref: '#/components/schemas/TaskExecutionMetrics'
        created_at: { type: string }
        updated_at: { type: string }
        completed_at:
          type: string
          nullable: true
        cancelled_at:
          type: string
          nullable: true
        cancelled_by:
          type: integer
          nullable: true
        cancel_reason: { type: string }

    TaskExecutionMetrics:
      type: object
      required:
        - task_id
        - current_stage
        - bottleneck_source
        - failure_stage
        - failure_category
        - queue_wait_ms
        - worker_overhead_ms
        - provider_latency_ms
        - finalize_latency_ms
        - total_latency_ms
        - created_at
        - updated_at
      properties:
        task_id: { type: string }
        current_stage:
          type: string
          enum: [queued, assigned, provider, finalizing, completed, failed, cancelled]
        bottleneck_source:
          type: string
          enum: [queue, worker, provider, storage, finalize, input, unknown]
        failure_stage:
          type: string
          enum: ['', queued, assigned, provider, finalizing, completed, failed, cancelled]
        failure_category:
          type: string
          enum: ['', input_invalid, auth, quota, timeout, provider_error, storage_error, finalize_error, cancelled, unknown]
        assigned_at:
          type: string
          nullable: true
        provider_started_at:
          type: string
          nullable: true
        provider_finished_at:
          type: string
          nullable: true
        finalize_started_at:
          type: string
          nullable: true
        finalize_finished_at:
          type: string
          nullable: true
        queue_wait_ms: { type: integer }
        worker_overhead_ms: { type: integer }
        provider_latency_ms: { type: integer }
        finalize_latency_ms: { type: integer }
        total_latency_ms: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    TaskOutput:
      type: object
      required:
        - id
        - task_id
        - role
        - url
        - mime_type
        - width
        - height
        - size_bytes
        - sort_index
        - created_at
        - updated_at
      properties:
        id: { type: integer }
        task_id: { type: string }
        media_asset_id:
          type: integer
          nullable: true
        role: { type: string }
        url: { type: string }
        storage_key: { type: string }
        mime_type: { type: string }
        width: { type: integer }
        height: { type: integer }
        size_bytes: { type: integer }
        source_url: { type: string }
        checksum_sha256: { type: string }
        storage_profile: { type: string }
        metadata: { type: string }
        sort_index: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    SubmitTaskRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        feature:
          $ref: '#/components/schemas/WorkflowFeatureSlug'
        image_urls:
          type: array
          items: { type: string }
        params:
          $ref: '#/components/schemas/SubmitTaskRequestParams'

    WorkflowFeatureSlug:
      type: string
      enum:
        - partial-edit
        - remove-bg
        - style-fusion
        - pattern-gen
        - sketch-to-image
        - style-variation
        - hd-upscale
        - image-extend

    SubmitTaskRequestParams:
      type: object
      additionalProperties: false
      properties:
        model: { type: string }
        original_image_url: { type: string }
        mask_image_url: { type: string }
        reference_image_urls:
          type: array
          items: { type: string }
        use_mask: { type: boolean }
        custom_width:
          type: number
          minimum: 1
        custom_height:
          type: number
          minimum: 1
        original_image_width:
          type: number
          minimum: 1
        original_image_height:
          type: number
          minimum: 1
        ratio: { type: string }
        quality: { type: string }
        sample_count:
          type: integer
          minimum: 1
        output_count:
          type: integer
          minimum: 1
        image_count:
          type: integer
          minimum: 1
        prompt_upsampling: { type: boolean }
        variation:
          $ref: '#/components/schemas/StyleVariationParams'
        extend:
          $ref: '#/components/schemas/ImageExtendParams'
        hd:
          $ref: '#/components/schemas/HDUpscaleParams'
        fusion:
          $ref: '#/components/schemas/StyleFusionParams'

    WorkflowTaskParams:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          minimum: 1
        feature:
          $ref: '#/components/schemas/WorkflowFeatureSlug'
        model: { type: string }
        media:
          $ref: '#/components/schemas/WorkflowMediaInputs'
        controls:
          $ref: '#/components/schemas/GenerationControls'
        variation:
          $ref: '#/components/schemas/StyleVariationParams'
        extend:
          $ref: '#/components/schemas/ImageExtendParams'
        hd:
          $ref: '#/components/schemas/HDUpscaleParams'
        fusion:
          $ref: '#/components/schemas/StyleFusionParams'
        extra:
          type: object
          additionalProperties: true

    WorkflowMediaInputs:
      type: object
      additionalProperties: false
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMediaRef'
        references:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMediaRef'
        mask:
          $ref: '#/components/schemas/WorkflowMediaRef'
        original:
          $ref: '#/components/schemas/WorkflowMediaRef'
        use_mask: { type: boolean }

    WorkflowMediaRef:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string }
        role: { type: string }
        weight:
          type: number
          minimum: 0

    GenerationControls:
      type: object
      additionalProperties: false
      properties:
        custom_width:
          type: number
          minimum: 1
        custom_height:
          type: number
          minimum: 1
        original_image_width:
          type: number
          minimum: 1
        original_image_height:
          type: number
          minimum: 1
        ratio: { type: string }
        quality: { type: string }
        sample_count:
          type: integer
          minimum: 1
        output_count:
          type: integer
          minimum: 1
        image_count:
          type: integer
          minimum: 1
        prompt_upsampling: { type: boolean }

    StyleVariationParams:
      type: object
      required: [strength]
      additionalProperties: false
      properties:
        strength:
          type: number
          minimum: 0
          maximum: 100

    ImageExtendParams:
      type: object
      required: [top_percent, right_percent, bottom_percent, left_percent]
      additionalProperties: false
      properties:
        top_percent:
          type: number
          minimum: 0
        right_percent:
          type: number
          minimum: 0
        bottom_percent:
          type: number
          minimum: 0
        left_percent:
          type: number
          minimum: 0

    HDUpscaleParams:
      type: object
      required: [clarity_strength]
      additionalProperties: false
      properties:
        clarity_strength:
          type: number
          minimum: 0
          maximum: 100

    StyleFusionParams:
      type: object
      required: [input_weights]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [weighted_reference]
        input_weights:
          type: array
          minItems: 1
          items:
            type: number
            minimum: 0

    BrandingSetting:
      type: object
      required: [project_name, logo_url]
      properties:
        project_name:
          type: string
          minLength: 1
          maxLength: 40
        logo_url:
          type: string
          maxLength: 2048

    RateLimitSetting:
      type: object
      required: [window_seconds, max_requests]
      properties:
        window_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        max_requests:
          type: integer
          minimum: 1
          maximum: 10000

    PublicURLSetting:
      type: object
      required: [public_base_url, public_asset_base_url]
      properties:
        public_base_url:
          type: string
          maxLength: 2048
        public_asset_base_url:
          type: string
          maxLength: 2048

    MediaUploadSetting:
      type: object
      required: [upload_max_concurrent]
      properties:
        upload_max_concurrent:
          type: integer
          minimum: 1
          maximum: 64

    TaskMonitorSetting:
      type: object
      required: [list_page_size, auto_refresh_enabled, refresh_interval_seconds, result_preview_enabled]
      properties:
        list_page_size:
          type: integer
          minimum: 5
          maximum: 50
        auto_refresh_enabled:
          type: boolean
        refresh_interval_seconds:
          type: integer
          minimum: 2
          maximum: 60
        result_preview_enabled:
          type: boolean

    AdminAccount:
      type: object
      required: [id, name, channel_id, platform, api_type, proxy_url, models, secret_configured, max_concurrent, fail_count, weight, timeout, extra_config, status, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        channel_id: { type: integer }
        platform: { type: string }
        api_type: { type: string }
        proxy_url: { type: string }
        models:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountModel'
        secret_configured: { type: boolean }
        max_concurrent: { type: integer }
        current_concurrent: { type: integer }
        wait_queue_count: { type: integer }
        running_status: { type: string }
        fail_count: { type: integer }
        weight: { type: integer }
        timeout: { type: integer }
        extra_config: { type: string }
        status: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    AdminAccountModel:
      type: object
      required: [name, enabled, weight, sort_order]
      properties:
        id: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
        weight: { type: integer }
        max_concurrent: { type: integer }
        feature_slugs:
          type: array
          items: { type: string }
        sort_order: { type: integer }

    AdminAccountModelInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        weight: { type: integer }
        max_concurrent: { type: integer }
        feature_slugs:
          type: array
          items: { type: string }

    AdminAccountCreateRequest:
      type: object
      required: [name, channel_id, platform, api_type, secret, models]
      properties:
        name: { type: string }
        channel_id: { type: integer }
        platform: { type: string }
        api_type: { type: string }
        secret: { type: string }
        models:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountModelInput'
        proxy_url: { type: string }
        max_concurrent: { type: integer }
        timeout: { type: integer }
        weight: { type: integer }
        extra_config: { type: string }

    AdminAccountUpdateRequest:
      type: object
      required: [models]
      properties:
        name: { type: string }
        platform: { type: string }
        api_type: { type: string }
        secret: { type: string }
        models:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountModelInput'
        proxy_url: { type: string }
        max_concurrent: { type: integer }
        timeout: { type: integer }
        weight: { type: integer }
        extra_config: { type: string }

    AccountLimitRange:
      type: object
      required: [min, max, default]
      properties:
        min: { type: integer }
        max: { type: integer }
        default: { type: integer }

    AccountLimits:
      type: object
      required: [max_concurrent, timeout_seconds]
      properties:
        max_concurrent:
          $ref: '#/components/schemas/AccountLimitRange'
        timeout_seconds:
          $ref: '#/components/schemas/AccountLimitRange'

    MonitorAccountLoad:
      type: object
      required: [current_concurrent, max_concurrent]
      properties:
        current_concurrent:
          type: integer
