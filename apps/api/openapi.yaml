        - provider_error_count
        - provider_error_rate
        - queue_delay_ms
        - provider_latency_ms
        - finalize_latency_ms
      properties:
        window_seconds:
          type: integer
          description: Rolling observation window in seconds.
        sample_count:
          type: integer
          description: Recent task execution metrics sampled for this snapshot.
        provider_attempts:
          type: integer
          description: Recent tasks that reached provider execution.
        provider_error_count:
          type: integer
          description: Recent provider-stage failures.
        provider_error_rate:
          type: number
          description: provider_error_count / provider_attempts.
        queue_delay_ms:
          $ref: '#/components/schemas/MonitorLatencySignal'
        provider_latency_ms:
          $ref: '#/components/schemas/MonitorLatencySignal'
        finalize_latency_ms:
          $ref: '#/components/schemas/MonitorLatencySignal'

