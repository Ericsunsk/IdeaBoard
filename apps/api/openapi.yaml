          items: { type: string }
        use_mask: { type: boolean }
        custom_width:
          type: number
          minimum: 1
        custom_height:
          type: number
          minimum: 1
        original_image_width:
          type: number
          minimum: 1
        original_image_height:
          type: number
          minimum: 1
        ratio: { type: string }
        quality: { type: string }
        sample_count:
          type: integer
          minimum: 1
        output_count:
          type: integer
          minimum: 1
        image_count:
          type: integer
          minimum: 1
        prompt_upsampling: { type: boolean }
        variation:
          $ref: '#/components/schemas/StyleVariationParams'
        extend:
          $ref: '#/components/schemas/ImageExtendParams'
        hd:
          $ref: '#/components/schemas/HDUpscaleParams'
        fusion:
          $ref: '#/components/schemas/StyleFusionParams'

