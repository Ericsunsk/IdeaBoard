          description: River jobs waiting to be processed.
        wait_queue_len:
          type: integer
          description: Reserved queue subcount; River-backed task queues report 0.
        running_attempts:
          type: integer
          description: Running task attempts currently recorded in PostgreSQL.
        account_loads:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MonitorAccountLoad'
        execution_pressure:
          type: array
          items:
            $ref: '#/components/schemas/MonitorExecutionPressurePoint'
        golden_signals:
          $ref: '#/components/schemas/MonitorGoldenSignals'

