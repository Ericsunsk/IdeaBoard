openapi: 3.0.3
info:
  title: IdeaBoard API
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: Settings
  - name: User
  - name: Boards
  - name: Tasks
  - name: AdminSettings
  - name: AdminUsers
  - name: AdminAccounts
  - name: AdminTasks
  - name: AdminMonitor
  - name: AdminStatistics
  - name: AdminChannels
  - name: AdminStorage
  - name: AdminFeaturePrompts
  - name: UserAssets
  - name: AdminAssets
  - name: UserLineDraftModes
  - name: AdminLineDraftModes
paths:
  /settings/branding:
    get:
      tags: [Settings]
      operationId: getSiteBrandingSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
  /user/info:
    get:
      tags: [User]
      operationId: getUserInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserInfo'
  /user/profile/avatar:
    post:
      tags: [UserAssets]
      operationId: uploadUserProfileAvatar
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded profile avatar metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUploadAvatar'
  /user/boards:
    get:
      tags: [Boards]
      operationId: listUserBoards
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoardList'
  /user/boards/{board_id}:
    put:
      tags: [Boards]
      operationId: upsertUserBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBoardUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoard'
    delete:
      tags: [Boards]
      operationId: deleteUserBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/uploads:
    post:
      tags: [UserAssets]
      operationId: uploadUserBoardAsset
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded board asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUploadImage'
    delete:
      tags: [UserAssets]
      operationId: deleteUserBoardUpload
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUploadRequest'
      responses:
        '200':
          description: Deleted board upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/members:
    get:
      tags: [Boards]
      operationId: listBoardMembers
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMemberList'
  /user/boards/{board_id}/members/invite:
    post:
      tags: [Boards]
      operationId: inviteBoardMember
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteBoardMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMember'
  /user/boards/{board_id}/members/{member_uid}/role:
    put:
      tags: [Boards]
      operationId: updateBoardMemberRole
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardMemberRoleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMember'
  /user/boards/{board_id}/members/{member_uid}:
    delete:
      tags: [Boards]
      operationId: removeBoardMember
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberUid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/share-tokens:
    get:
      tags: [Boards]
      operationId: listBoardShareTokens
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardShareTokenList'
    post:
      tags: [Boards]
      operationId: createBoardShareToken
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardShareTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardShareToken'
  /user/boards/{board_id}/share-tokens/{token_id}/revoke:
    post:
      tags: [Boards]
      operationId: revokeBoardShareToken
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/ShareTokenID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRevoked'
  /user/boards/share-tokens/join:
    post:
      tags: [Boards]
      operationId: joinBoardByShareToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinBoardByShareTokenBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoard'
  /user/tasks/submit:
    post:
      tags: [Tasks]
      operationId: submitUserTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskId'
  /user/tasks/submit/readiness:
    post:
      tags: [Tasks]
      operationId: checkUserTaskSubmitReadiness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskSubmitReadiness'
  /user/tasks:
    get:
      tags: [Tasks]
      operationId: listUserTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskList'
  /user/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getUserTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
    delete:
      tags: [Tasks]
      operationId: deleteUserTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
  /user/tasks/{task_id}/events:
    get:
      tags: [Tasks]
      operationId: streamUserTaskEvents
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Server-Sent Events stream for task updates
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: ping
                data: {}

                event: task
                data: {"task_id":"task_123","status":"running"}
  /user/download:
    get:
      tags: [UserAssets]
      operationId: downloadUserImage
      security:
        - cookieAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: Downloaded image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
  /user/line-draft-modes:
    get:
      tags: [UserLineDraftModes]
      operationId: listUserLineDraftModes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Enabled line draft modes without prompt templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserLineDraftModeList'

  /admin/settings/registration:
    get:
      tags: [AdminSettings]
      operationId: getAdminRegistrationSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminRegistrationSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSetting'
  /admin/settings/branding:
    get:
      tags: [AdminSettings]
      operationId: getAdminBrandingSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminBrandingSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
  /admin/settings/public-urls:
    get:
      tags: [AdminSettings]
      operationId: getAdminPublicURLSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublicURLSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminPublicURLSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicURLSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublicURLSetting'
  /admin/settings/media-upload:
    get:
      tags: [AdminSettings]
      operationId: getAdminMediaUploadSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMediaUploadSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminMediaUploadSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMediaUploadSetting'
  /admin/settings/rate-limit:
    get:
      tags: [AdminSettings]
      operationId: getAdminRateLimitSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRateLimitSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminRateLimitSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRateLimitSetting'
  /admin/settings/task-monitor:
    get:
      tags: [AdminSettings]
      operationId: getAdminTaskMonitorSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskMonitorSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminTaskMonitorSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMonitorSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskMonitorSetting'

  /admin/users:
    get:
      tags: [AdminUsers]
      operationId: listAdminUsers
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, user]
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserList'
  /admin/users/{id}/ban:
    post:
      tags: [AdminUsers]
      operationId: banAdminUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                expires_in_days:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}/unban:
    post:
      tags: [AdminUsers]
      operationId: unbanAdminUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}/revoke-sessions:
    post:
      tags: [AdminUsers]
      operationId: revokeAdminUserSessions
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}/role:
    put:
      tags: [AdminUsers]
      operationId: updateAdminUserRole
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, user]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}:
    delete:
      tags: [AdminUsers]
      operationId: deleteAdminUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'

  /admin/accounts:
    get:
      tags: [AdminAccounts]
      operationId: listAdminAccounts
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: platform
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccountList'
    post:
      tags: [AdminAccounts]
      operationId: createAdminAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminAccount'
  /admin/accounts/limits:
    get:
      tags: [AdminAccounts]
      operationId: getAdminAccountLimits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccountLimits'
  /admin/accounts/{id}:
    get:
      tags: [AdminAccounts]
      operationId: getAdminAccount
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminAccount'
    put:
      tags: [AdminAccounts]
      operationId: updateAdminAccount
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
    delete:
      tags: [AdminAccounts]
      operationId: deleteAdminAccount
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/accounts/{id}/queue:
    get:
      tags: [AdminAccounts]
      operationId: getAdminAccountQueue
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMonitorAccountLoad'
  /admin/accounts/{id}/start:
    post:
      tags: [AdminAccounts]
      operationId: startAdminAccount
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/accounts/{id}/stop:
    post:
      tags: [AdminAccounts]
      operationId: stopAdminAccount
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'

  /admin/tasks:
    get:
      tags: [AdminTasks]
      operationId: listAdminTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: user_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: account_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: keyword
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskList'
  /admin/tasks/submit:
    post:
      tags: [AdminTasks]
      operationId: submitAdminTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskId'
  /admin/tasks/{task_id}:
    get:
      tags: [AdminTasks]
      operationId: getAdminTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'

  /admin/monitor:
    get:
      tags: [AdminMonitor]
      operationId: getAdminMonitor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMonitor'
  /admin/monitor/stream:
    get:
      tags: [AdminMonitor]
      operationId: streamAdminMonitor
      responses:
        '200':
          description: Server-sent monitor snapshots. Snapshot events carry ApiResponseMonitor JSON.
          content:
            text/event-stream:
              schema:
                type: string

  /admin/statistics:
    get:
      tags: [AdminStatistics]
      operationId: getAdminStatistics
      parameters:
        - name: range
          in: query
          schema:
            type: string
            default: 7d
            enum: [1d, 7d, 30d, 1y]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminStatistics'
  /admin/statistics/backfill:
    post:
      tags: [AdminStatistics]
      operationId: backfillAdminStatistics
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStatisticsBackfillRequest'
      responses:
        '200':
          description: Backfilled missing daily statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminStatisticsBackfill'
  /admin/upload:
    post:
      tags: [AdminAssets]
      operationId: uploadAdminAsset
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded admin asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUploadImage'

  /admin/channels:
    get:
      tags: [AdminChannels]
      operationId: listAdminChannels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannelList'
    post:
      tags: [AdminChannels]
      operationId: createAdminChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelFormData'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannel'
  /admin/channels/detect-models:
    post:
      tags: [AdminChannels]
      operationId: detectAdminChannelModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectModelsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDetectModels'
  /admin/channels/{id}:
    put:
      tags: [AdminChannels]
      operationId: updateAdminChannel
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelFormData'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseChannel'
