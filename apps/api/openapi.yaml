      properties:
        prompt: { type: string }
        client_action_id:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
          description: >
            Client-generated idempotency key for a single task submission action.
            It is required for every canonical AI image workflow because billed submissions must
            converge after network timeouts. Reuse the same value when retrying the
            same action; generate a new value for an intentional rerun.
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: Optional River-compatible task priority. Defaults to 2 when omitted.
        feature:
          $ref: '#/components/schemas/WorkflowFeatureSlug'
        image_urls:
          type: array
          items: { type: string }
        params:
          $ref: '#/components/schemas/SubmitTaskRequestParams'

    SubmitTaskReadinessRequest:
      allOf:
        - $ref: '#/components/schemas/SubmitTaskRequest'
        - type: object
          required: [billing_quantity]
          properties:
            billing_quantity:
              type: integer
              format: int64
              minimum: 1
              maximum: 16
              description: Readiness-only number of independently billed Task submissions in this activation.

    WorkflowFeatureSlug:
      type: string
      enum:
        - partial-edit
        - remove-bg
        - style-fusion
        - pattern-gen
        - sketch-to-image
        - style-variation
        - hd-upscale
        - image-extend

    SubmitTaskRequestParams:
      type: object
      additionalProperties: false
      properties:
        model: { type: string }
        original_image_url: { type: string }
        mask_image_url: { type: string }
        reference_image_urls:
