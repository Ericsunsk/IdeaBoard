    DetectModelsResponse:
      type: object
      required: [models, api_type]
      properties:
        models:
          type: array
          items: { type: string }
        api_type:
          $ref: '#/components/schemas/ProviderAPIType'

    StorageProviderField:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string }
        placeholder: { type: string }
        hint: { type: string }
        required: { type: boolean }
        secret: { type: boolean }

    StorageProviderMeta:
      type: object
