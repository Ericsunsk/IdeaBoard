            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFeaturePrompt'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    BoardId:
      name: board_id
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    StorageProfileId:
      name: id
      in: path
      required: true
      schema: { type: string }
    LineDraftModeId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    MemberUid:
      name: member_uid
      in: path
      required: true
      schema: { type: string }
    ShareTokenID:
      name: token_id
      in: path
      required: true
      schema: { type: integer }
    BillingSKUPath:
      name: sku
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BillingSKUCode' }
    Page:
      name: page
      in: query
      schema: { type: integer }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer }

  schemas:
    ApiResponseBase:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer }
        msg: { type: string }

    InsufficientCreditsError:
      type: object
      required: [code, msg]
      properties:
        code:
          type: string
          enum: [insufficient_credits]
        msg:
          type: string

    PricingUnavailableError:
      type: object
      required: [code, msg]
      properties:
        code:
          type: string
          enum: [pricing_unavailable]
        msg:
          type: string

    User:
      type: object
      required: [id, uid, username, role, status, created_at, updated_at]
      properties:
        id: { type: integer }
        uid: { type: string }
        username: { type: string }
        auth_user_id: { type: string }
        avatar: { type: string }
        role: { type: string }
        status: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    AdminCreditGrantRequest:
      type: object
      additionalProperties: false
      required: [user_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    AdminCreditDeductionRequest:
      type: object
      additionalProperties: false
      required: [user_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    AdminCreditRefundRequest:
      type: object
      additionalProperties: false
      required: [user_id, charge_transaction_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        charge_transaction_id: { type: string, minLength: 1, maxLength: 64 }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    AdminCreditCorrectionRequest:
      type: object
      additionalProperties: false
      required: [user_id, original_transaction_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        original_transaction_id: { type: string, minLength: 1, maxLength: 64 }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    BillingSKUCode:
      type: string
      minLength: 3
      maxLength: 128
      pattern: '^[a-z][a-z0-9-]{0,31}:[a-z][a-z0-9._-]{0,94}$'
      example: ideaboard:image.generate

    BillingQuoteRequest:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        quantity: { type: integer, format: int64, minimum: 1 }

    BillingQuote:
      type: object
      required: [sku, display_name, price_version_id, price_version, unit_credits, quantity, total_credits, quoted_at]
      properties:
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        price_version_id: { type: integer, format: int64, minimum: 1 }
        price_version: { type: integer, format: int64, minimum: 1 }
        unit_credits: { type: integer, format: int64, minimum: 0, maximum: 9000000000000000 }
        quantity: { type: integer, format: int64, minimum: 1 }
        total_credits: { type: integer, format: int64, minimum: 0, maximum: 9000000000000000 }
        quoted_at: { type: string, format: date-time }

    TaskBillingReadiness:
      allOf:
        - $ref: '#/components/schemas/BillingQuote'
        - type: object
          required: [available_credits, reserved_credits, sufficient]
          properties:
            available_credits: { type: integer, format: int64, minimum: 0 }
            reserved_credits: { type: integer, format: int64, minimum: 0 }
            sufficient: { type: boolean }

    BillingPrice:
      type: object
      required: [price_version_id, version, unit_credits, enabled, created_by, created_at, updated_by, updated_at]
      properties:
        price_version_id: { type: integer, format: int64, minimum: 1 }
        version: { type: integer, format: int64, minimum: 1 }
        unit_credits: { type: integer, format: int64, minimum: 0, maximum: 9000000000000000 }
        enabled: { type: boolean }
        created_by: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }

    BillingCatalogItem:
      type: object
      required: [sku, display_name, description, enabled, created_at, updated_at]
      properties:
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        enabled: { type: boolean }
        current_price_version_id: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current_price: { $ref: '#/components/schemas/BillingPrice' }

    BillingCatalogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BillingCatalogItem' }
        next_after_sku: { $ref: '#/components/schemas/BillingSKUCode' }

    BillableItemStatus:
      type: string
      enum: [unpriced, active, disabled, archived]

    BillableItemCatalogCard:
      type: object
      required: [sku, namespace, product_kind, display_name, description, sort_order, status]
      properties:
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        namespace: { type: string, minLength: 1, maxLength: 32 }
        product_kind: { type: string, minLength: 1, maxLength: 64 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        sort_order: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/BillableItemStatus' }
        current_price: { $ref: '#/components/schemas/BillingPrice' }
        updated_at: { type: string, format: date-time }

    BillableItemCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BillableItemCatalogCard' }

    BillingCoverageItem:
      type: object
      required: [feature, model, sku, sku_configured, sku_enabled, price_configured, price_enabled]
      properties:
        feature: { $ref: '#/components/schemas/WorkflowFeatureSlug' }
        model: { type: string, minLength: 1 }
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        sku_configured: { type: boolean }
        sku_enabled: { type: boolean }
        price_configured: { type: boolean }
        price_enabled: { type: boolean }
        unit_credits: { type: integer, format: int64, minimum: 0, maximum: 9000000000000000 }

    BillingCoverage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BillingCoverageItem' }

    BillingPricePage:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items: { $ref: '#/components/schemas/BillingPrice' }
        next_before_version: { type: integer, format: int64, minimum: 1 }

    AdminBillingSKUCreateRequest:
      type: object
      additionalProperties: false
      required: [sku, display_name, enabled, reason]
      properties:
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, default: '' }
        enabled: { type: boolean }
        reason: { $ref: '#/components/schemas/AdminActionReason' }

    AdminBillingSKUUpdateRequest:
      type: object
      additionalProperties: false
      required: [reason]
      anyOf:
        - required: [display_name]
        - required: [description]
        - required: [enabled]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        enabled: { type: boolean }
        reason: { $ref: '#/components/schemas/AdminActionReason' }

    AdminBillingPriceCreateRequest:
      type: object
      additionalProperties: false
      required: [unit_credits, enabled, reason]
      properties:
        unit_credits: { type: integer, format: int64, minimum: 0, maximum: 9000000000000000 }
        enabled: { type: boolean }
        reason: { $ref: '#/components/schemas/AdminActionReason' }

    AdminBillingPriceStateRequest:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { $ref: '#/components/schemas/AdminActionReason' }

    AdminActionReason:
      type: string
      minLength: 1
      maxLength: 1000

    RewardCampaign:
      type: object
      additionalProperties: false
      required: [id, display_name, internal_note, credit_amount, mode, lifecycle_status, status, max_redemptions, redemption_count, issued_code_count, valid_unused_code_count, created_by, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        internal_note: { type: string, maxLength: 1000 }
        credit_amount: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        mode: { type: string, enum: [public, single_use] }
        lifecycle_status: { type: string, enum: [draft, active, paused, cancelled] }
        status: { type: string, enum: [draft, cancelled, expired, exhausted, paused, scheduled, active] }
        max_redemptions: { type: integer, format: int64, minimum: 0 }
        redemption_count: { type: integer, format: int64, minimum: 0 }
        issued_code_count: { type: integer, format: int64, minimum: 0 }
        valid_unused_code_count: { type: integer, format: int64, minimum: 0 }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RewardCodeMetadata:
      type: object
      additionalProperties: false
      required: [id, campaign_id, hint, issued_by, issued_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        campaign_id: { type: integer, format: int64, minimum: 1 }
        hint: { type: string, pattern: '^[A-Z0-9]{4}$' }
        issued_by: { type: integer, format: int64, minimum: 1 }
        issued_at: { type: string, format: date-time }

    IssuedRewardPublicCode:
      type: object
      additionalProperties: false
      required: [code, plaintext]
      properties:
        code: { $ref: '#/components/schemas/RewardCodeMetadata' }
        plaintext: { type: string, minLength: 8, maxLength: 32, pattern: '^[A-Z0-9]+$' }

    RewardCodeBatch:
      type: object
      additionalProperties: false
      required: [id, campaign_id, idempotency_key, code_count, valid_unused_count, redeemed_count, revoked_unused_count, issued_by, issued_at, masked_code_hint_preview]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        campaign_id: { type: integer, format: int64, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        code_count: { type: integer, minimum: 1, maximum: 10000 }
        valid_unused_count: { type: integer, minimum: 0 }
        redeemed_count: { type: integer, minimum: 0 }
        revoked_unused_count: { type: integer, minimum: 0 }
        issued_by: { type: integer, format: int64, minimum: 1 }
        issued_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        revoked_by: { type: integer, format: int64, minimum: 1 }
        masked_code_hint_preview:
          type: array
          maxItems: 3
          items: { type: string, minLength: 9, maxLength: 9, pattern: '^•••• [A-Z0-9]{4}$' }

    GeneratedRewardCodeBatch:
      type: object
      additionalProperties: false
      required: [batch, export_unavailable, replayed]
      properties:
        batch: { $ref: '#/components/schemas/RewardCodeBatch' }
        plaintexts:
          type: array
          maxItems: 10000
          items:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{4}(?:-[0-9A-HJKMNP-TV-Z]{4}){3}$'
        export_unavailable: { type: boolean }
        replayed: { type: boolean }

    RewardCodeBatchPage:
      type: object
      additionalProperties: false
      required: [batches]
      properties:
