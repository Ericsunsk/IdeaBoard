openapi: 3.0.3
info:
  title: IdeaBoard API
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: Settings
  - name: User
  - name: Boards
  - name: Tasks
  - name: Billing
  - name: UserBilling
  - name: UserCredits
  - name: UserUsage
  - name: UserRewards
  - name: UserPayments
  - name: AdminSettings
  - name: AdminUsers
  - name: AdminCredits
  - name: AdminBilling
  - name: AdminRewards
  - name: AdminPayments
  - name: AdminAccounts
  - name: AdminTasks
  - name: AdminMonitor
  - name: AdminStatistics
  - name: AdminProviderEndpoints
  - name: AdminStorage
  - name: AdminFeaturePrompts
  - name: UserAssets
  - name: AdminAssets
  - name: PaymentWebhooks
paths:
  /settings/branding:
    get:
      tags: [Settings]
      operationId: getSiteBrandingSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
  /user/info:
    get:
      tags: [User]
      operationId: getUserInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserInfo'
  /user/billing/quotes:
    post:
      tags: [Billing]
      operationId: createBillingQuote
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingQuoteRequest'
      responses:
        '200':
          description: Immutable server-side Credit price snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBillingQuote'
  /user/billing/records:
    get:
      tags: [UserBilling]
      operationId: listUserBillingRecords
      security:
        - cookieAuth: []
      parameters:
        - name: before_sequence
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Current authenticated user's final Idea income and expense records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBillingRecordPage'
  /user/credits/wallet:
    get:
      tags: [UserCredits]
      operationId: getUserCreditWallet
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current authenticated user's Credit wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCreditWalletBalance'
  /user/usage:
    get:
      tags: [UserUsage]
      operationId: getUserUsage
      security:
        - cookieAuth: []
      parameters:
        - name: range
          in: query
          description: Shanghai daily trend window; lifetime totals are never range-filtered
          schema: { type: string, enum: [7d, 30d, 1y], default: 30d }
      responses:
        '200':
          description: Current authenticated user's lifetime Credit usage and selected daily trend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserUsage'
        '400':
          description: Unsupported usage range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'
  /user/rewards/redeem:
    post:
      tags: [UserRewards]
      operationId: redeemUserReward
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewardRedeemRequest' }
      responses:
        '200':
          description: Reward redeemed or the original successful redemption replayed
          headers:
            Cache-Control:
              description: Sensitive redemption responses are never cached
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseRewardRedeemResult' }
        '400':
          description: Malformed request; user copy is 参数错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '409':
          description: RewardCode already redeemed by the authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '422':
          description: Code is invalid or unavailable without exposing its state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '423':
          description: Current Wallet cannot receive Rewards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '429':
          description: Per-user redemption attempt limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '500':
          description: Internal or transport failure with stable generic user copy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
  /user/rewards/redemptions:
    get:
      tags: [UserRewards]
      operationId: listUserRewardRedemptions
      security:
        - cookieAuth: []
      parameters:
        - name: before_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Current authenticated user's successful Reward Redemption history
          headers:
            Cache-Control:
              description: Sensitive redemption history is never cached
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseRewardRedemptionHistoryPage' }
  /user/payments/purchase-options:
    get:
      tags: [UserPayments]
      operationId: getUserPaymentPurchaseOptions
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current authenticated user's recharge availability and legal document versions
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePaymentPurchaseOptions' }
  /user/payments/checkout-sessions:
    post:
      tags: [UserPayments]
      operationId: createUserPaymentCheckoutSession
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentCheckoutRequest' }
      responses:
        '200':
          description: A durable Payment Order and its Stripe Checkout URL
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePaymentCheckout' }
        '400':
          description: Invalid checkout payload or legal acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '409':
          description: Idempotency conflict, three active pending orders, or the same quantity is already processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '423':
          description: Current Wallet cannot start a recharge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '422':
          description: Stripe definitively rejected Checkout creation, or a recovered Session is already completed or expired; the client may retry with a new idempotency key
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/CheckoutRequestRejectedError' }
                  - { $ref: '#/components/schemas/CheckoutStateConflictError' }
  /user/payments/orders/{public_token}:
    get:
      tags: [UserPayments]
      operationId: getUserPaymentOrderReturnStatus
      security:
        - cookieAuth: []
      parameters:
        - name: public_token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current authenticated user's Payment Order return status
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePaymentOrderReturnStatus' }
        '404':
          description: Payment Order does not belong to the authenticated user or does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
  /user/payments/pending-orders:
    get:
      tags: [UserPayments]
      operationId: listUserPendingPaymentOrders
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current authenticated user's non-final Payment Orders, separate from recharge history
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePendingPaymentOrderList' }
  /user/payments/pending-orders/{public_token}/continue:
    post:
      tags: [UserPayments]
      operationId: continueUserPendingPaymentOrder
      security:
        - cookieAuth: []
      parameters:
        - name: public_token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current canonical Payment Order after continuing Checkout
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePendingPaymentOrder' }
        '404':
          description: Payment Order does not belong to the authenticated user, does not exist, or has an invalid public token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '423':
          description: Current Wallet cannot continue a Checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
  /user/payments/pending-orders/{public_token}/abandon:
    post:
      tags: [UserPayments]
      operationId: abandonUserPendingPaymentOrder
      security:
        - cookieAuth: []
      parameters:
        - name: public_token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current canonical Payment Order after an idempotent abandon attempt
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePendingPaymentOrder' }
        '404':
          description: Payment Order does not belong to the authenticated user, does not exist, or has an invalid public token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
  /user/payments/recharges:
    get:
      tags: [UserPayments]
      operationId: listUserPaymentRecharges
      security:
        - cookieAuth: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Current authenticated user's last twelve months of final recharge facts
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseRechargeHistoryPage' }
  /user/payments/events:
    get:
      tags: [UserPayments]
      operationId: streamUserPaymentEvents
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User-scoped recharge status events
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            text/event-stream:
              schema: { type: string }
  /user/profile/avatar:
    post:
      tags: [UserAssets]
      operationId: uploadUserProfileAvatar
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded profile avatar metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUploadAvatar'
  /user/boards:
    get:
      tags: [Boards]
      operationId: listUserBoards
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoardList'
  /user/boards/{board_id}:
    put:
      tags: [Boards]
      operationId: upsertUserBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBoardUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoard'
    delete:
      tags: [Boards]
      operationId: deleteUserBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/uploads:
    post:
      tags: [UserAssets]
      operationId: uploadUserBoardAsset
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded board asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUploadImage'
  /user/boards/{board_id}/members:
    get:
      tags: [Boards]
      operationId: listBoardMembers
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMemberList'
  /user/boards/{board_id}/members/invite:
    post:
      tags: [Boards]
      operationId: inviteBoardMember
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteBoardMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMember'
  /user/boards/{board_id}/members/{member_public_id}/role:
    put:
      tags: [Boards]
      operationId: updateBoardMemberRole
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberPublicID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardMemberRoleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMember'
  /user/boards/{board_id}/members/{member_public_id}:
    delete:
      tags: [Boards]
      operationId: removeBoardMember
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberPublicID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/share-tokens:
    get:
      tags: [Boards]
      operationId: listBoardShareTokens
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardShareTokenList'
    post:
      tags: [Boards]
      operationId: createBoardShareToken
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardShareTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardShareToken'
  /user/boards/{board_id}/share-tokens/{token_id}/revoke:
    post:
      tags: [Boards]
      operationId: revokeBoardShareToken
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/ShareTokenID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRevoked'
  /user/boards/share-tokens/join:
    post:
      tags: [Boards]
      operationId: joinBoardByShareToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinBoardByShareTokenBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoard'
  /user/tasks/submit:
    post:
      tags: [Tasks]
      operationId: submitUserTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskId'
        '402':
          description: The server quote cannot be covered by the user's available Idea balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '409':
          description: The user's Wallet is restricted from new consumption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRestrictedError'
        '503':
          description: The authoritative Task price or transactional submission service is unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PricingUnavailableError'
                  - $ref: '#/components/schemas/SubmissionFailedError'
  /user/tasks/submit/readiness:
    post:
      tags: [Tasks]
      operationId: checkUserTaskSubmitReadiness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskReadinessRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskSubmitReadiness'
        '503':
          description: The readiness Quote cannot currently be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingUnavailableError'
  /user/tasks:
    get:
      tags: [Tasks]
      operationId: listUserTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskList'
  /user/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getUserTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
  /user/tasks/{task_id}/cancel:
    post:
      tags: [Tasks]
      operationId: cancelUserTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
  /user/tasks/{task_id}/events:
    get:
      tags: [Tasks]
      operationId: streamUserTaskEvents
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Server-Sent Events stream for task updates
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: ping
                data: {}

                event: task
                data: {"task_id":"task_123","status":"running"}
  /user/download:
    get:
      tags: [UserAssets]
      operationId: downloadUserImage
      security:
        - cookieAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: Downloaded image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
  /admin/settings/registration:
    get:
      tags: [AdminSettings]
      operationId: getAdminRegistrationSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminRegistrationSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSetting'
  /admin/settings/branding:
    get:
      tags: [AdminSettings]
      operationId: getAdminBrandingSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminBrandingSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
  /admin/settings/media-upload:
    get:
      tags: [AdminSettings]
      operationId: getAdminMediaUploadSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMediaUploadSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminMediaUploadSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMediaUploadSetting'
  /admin/settings/rate-limit:
    get:
      tags: [AdminSettings]
      operationId: getAdminRateLimitSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRateLimitSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminRateLimitSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRateLimitSetting'
  /admin/settings/outbound-policy:
    get:
      tags: [AdminSettings]
      operationId: getAdminOutboundPolicy
      responses:
        '200':
          description: Outbound hosts allowed in addition to public network destinations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOutboundPolicySetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminOutboundPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundPolicyUpdateRequest'
      responses:
        '200':
          description: Persisted outbound policy, effective immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOutboundPolicySetting'

  /admin/payments/stripe-config:
    get:
      tags: [AdminPayments]
      operationId: getAdminStripeConfiguration
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current safe Stripe configuration summary; Secrets are never returned
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStripeConfigurationSummary'
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '403':
          description: Admin role required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
    put:
      tags: [AdminPayments]
      operationId: updateAdminStripeConfiguration
      security:
        - cookieAuth: []
      requestBody:
        required: true
