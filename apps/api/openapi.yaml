openapi: 3.0.3
info:
  title: IdeaBoard API
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: Settings
  - name: User
  - name: Boards
  - name: Tasks
  - name: Billing
  - name: UserBilling
  - name: UserCredits
  - name: UserUsage
  - name: UserRewards
  - name: AdminSettings
  - name: AdminUsers
  - name: AdminCredits
  - name: AdminBilling
  - name: AdminRewards
  - name: AdminAccounts
  - name: AdminTasks
  - name: AdminMonitor
  - name: AdminStatistics
  - name: AdminProviderEndpoints
  - name: AdminStorage
  - name: AdminFeaturePrompts
  - name: UserAssets
  - name: AdminAssets
  - name: UserLineDraftModes
  - name: AdminLineDraftModes
paths:
  /settings/branding:
    get:
      tags: [Settings]
      operationId: getSiteBrandingSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
  /user/info:
    get:
      tags: [User]
      operationId: getUserInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserInfo'
  /user/billing/quotes:
    post:
      tags: [Billing]
      operationId: createBillingQuote
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingQuoteRequest'
      responses:
        '200':
          description: Immutable server-side Credit price snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBillingQuote'
  /user/billing/records:
    get:
      tags: [UserBilling]
      operationId: listUserBillingRecords
      security:
        - cookieAuth: []
      parameters:
        - name: before_sequence
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Current authenticated user's final Idea income and expense records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBillingRecordPage'
  /user/credits/wallet:
    get:
      tags: [UserCredits]
      operationId: getUserCreditWallet
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current authenticated user's Credit wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCreditWallet'
  /user/usage:
    get:
      tags: [UserUsage]
      operationId: getUserUsage
      security:
        - cookieAuth: []
      parameters:
        - name: range
          in: query
          description: Shanghai daily trend window; lifetime totals are never range-filtered
          schema: { type: string, enum: [7d, 30d, 1y], default: 30d }
      responses:
        '200':
          description: Current authenticated user's lifetime Credit usage and selected daily trend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserUsage'
        '400':
          description: Unsupported usage range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'
  /user/rewards/redeem:
    post:
      tags: [UserRewards]
      operationId: redeemUserReward
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewardRedeemRequest' }
      responses:
        '200':
          description: Reward redeemed or the original successful redemption replayed
          headers:
            Cache-Control:
              description: Sensitive redemption responses are never cached
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseRewardRedeemResult' }
        '400':
          description: Malformed request; user copy is 参数错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '409':
          description: Campaign already redeemed by the authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '422':
          description: Code is invalid or unavailable without exposing its state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '423':
          description: Current Wallet cannot receive Rewards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '429':
          description: Per-user redemption attempt limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
        '500':
          description: Internal or transport failure with stable generic user copy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBase' }
  /user/rewards/redemptions:
    get:
      tags: [UserRewards]
      operationId: listUserRewardRedemptions
      security:
        - cookieAuth: []
      parameters:
        - name: before_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Current authenticated user's successful Reward Redemption history
          headers:
            Cache-Control:
              description: Sensitive redemption history is never cached
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseRewardRedemptionHistoryPage' }
  /user/profile/avatar:
    post:
      tags: [UserAssets]
      operationId: uploadUserProfileAvatar
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded profile avatar metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUploadAvatar'
  /user/boards:
    get:
      tags: [Boards]
      operationId: listUserBoards
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoardList'
  /user/boards/{board_id}:
    put:
      tags: [Boards]
      operationId: upsertUserBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBoardUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoard'
    delete:
      tags: [Boards]
      operationId: deleteUserBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/uploads:
    post:
      tags: [UserAssets]
      operationId: uploadUserBoardAsset
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded board asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUploadImage'
    delete:
      tags: [UserAssets]
      operationId: deleteUserBoardUpload
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUploadRequest'
      responses:
        '200':
          description: Deleted board upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/members:
    get:
      tags: [Boards]
      operationId: listBoardMembers
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMemberList'
  /user/boards/{board_id}/members/invite:
    post:
      tags: [Boards]
      operationId: inviteBoardMember
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteBoardMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMember'
  /user/boards/{board_id}/members/{member_uid}/role:
    put:
      tags: [Boards]
      operationId: updateBoardMemberRole
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardMemberRoleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardMember'
  /user/boards/{board_id}/members/{member_uid}:
    delete:
      tags: [Boards]
      operationId: removeBoardMember
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/MemberUid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDeleted'
  /user/boards/{board_id}/share-tokens:
    get:
      tags: [Boards]
      operationId: listBoardShareTokens
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardShareTokenList'
    post:
      tags: [Boards]
      operationId: createBoardShareToken
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardShareTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoardShareToken'
  /user/boards/{board_id}/share-tokens/{token_id}/revoke:
    post:
      tags: [Boards]
      operationId: revokeBoardShareToken
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/ShareTokenID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRevoked'
  /user/boards/share-tokens/join:
    post:
      tags: [Boards]
      operationId: joinBoardByShareToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinBoardByShareTokenBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserBoard'
  /user/tasks/submit:
    post:
      tags: [Tasks]
      operationId: submitUserTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskId'
        '402':
          description: The server quote cannot be covered by the user's available Idea balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '503':
          description: The authoritative Task price cannot currently be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingUnavailableError'
  /user/tasks/submit/readiness:
    post:
      tags: [Tasks]
      operationId: checkUserTaskSubmitReadiness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskReadinessRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskSubmitReadiness'
        '503':
          description: The readiness Quote cannot currently be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingUnavailableError'
  /user/tasks:
    get:
      tags: [Tasks]
      operationId: listUserTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskList'
  /user/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getUserTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
    delete:
      tags: [Tasks]
      operationId: deleteUserTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
  /user/tasks/{task_id}/cancel:
    post:
      tags: [Tasks]
      operationId: cancelUserTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
  /user/tasks/{task_id}/events:
    get:
      tags: [Tasks]
      operationId: streamUserTaskEvents
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Server-Sent Events stream for task updates
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: ping
                data: {}

                event: task
                data: {"task_id":"task_123","status":"running"}
  /user/download:
    get:
      tags: [UserAssets]
      operationId: downloadUserImage
      security:
        - cookieAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: Downloaded image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
  /user/line-draft-modes:
    get:
      tags: [UserLineDraftModes]
      operationId: listUserLineDraftModes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Enabled line draft modes without prompt templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserLineDraftModeList'

  /admin/settings/registration:
    get:
      tags: [AdminSettings]
      operationId: getAdminRegistrationSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminRegistrationSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSetting'
  /admin/settings/branding:
    get:
      tags: [AdminSettings]
      operationId: getAdminBrandingSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminBrandingSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandingSetting'
  /admin/settings/public-urls:
    get:
      tags: [AdminSettings]
      operationId: getAdminPublicURLSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublicURLSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminPublicURLSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicURLSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublicURLSetting'
  /admin/settings/media-upload:
    get:
      tags: [AdminSettings]
      operationId: getAdminMediaUploadSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMediaUploadSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminMediaUploadSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMediaUploadSetting'
  /admin/settings/generation/google-native:
    get:
      tags: [AdminSettings]
      operationId: getAdminGoogleNativeGenerationSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGoogleNativeGenerationSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminGoogleNativeGenerationSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleNativeGenerationSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGoogleNativeGenerationSetting'
  /admin/settings/rate-limit:
    get:
      tags: [AdminSettings]
      operationId: getAdminRateLimitSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRateLimitSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminRateLimitSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRateLimitSetting'
  /admin/settings/task-monitor:
    get:
      tags: [AdminSettings]
      operationId: getAdminTaskMonitorSetting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskMonitorSetting'
    put:
      tags: [AdminSettings]
      operationId: updateAdminTaskMonitorSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMonitorSetting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskMonitorSetting'

  /admin/settings/operational:
    get:
      tags: [AdminSettings]
      operationId: getAdminOperationalSettings
      responses:
        '200':
          description: Persisted operational settings and the values effective in the current process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOperationalSettingsState'
    put:
      tags: [AdminSettings]
      operationId: updateAdminOperationalSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationalSettingsUpdateRequest'
      responses:
        '200':
          description: Persisted settings; restart_required identifies startup-only changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOperationalSettingsState'

  /admin/users:
    get:
      tags: [AdminUsers]
      operationId: listAdminUsers
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, user]
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserList'
  /admin/users/{id}/ban:
    post:
      tags: [AdminUsers]
      operationId: banAdminUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                expires_in_days:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}/unban:
    post:
      tags: [AdminUsers]
      operationId: unbanAdminUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}/revoke-sessions:
    post:
      tags: [AdminUsers]
      operationId: revokeAdminUserSessions
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}/role:
    put:
      tags: [AdminUsers]
      operationId: updateAdminUserRole
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, user]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
  /admin/users/{id}:
    delete:
      tags: [AdminUsers]
      operationId: deleteAdminUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'

  /admin/rewards/campaigns:
    get:
      tags: [AdminRewards]
      operationId: listAdminRewardCampaigns
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: mode
          in: query
          schema: { type: string, enum: [public, single_use] }
        - name: status
          in: query
          schema: { type: string, enum: [draft, cancelled, expired, exhausted, paused, scheduled, active] }
        - name: before_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Reward Campaign page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseRewardCampaignPage' }
    post:
      tags: [AdminRewards]
      operationId: createAdminRewardCampaign
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRewardCampaignCreateRequest' }
      responses:
        '200':
