components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    BoardId:
      name: board_id
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PublicUserIDPath:
      name: public_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RewardCodeIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RewardRedemptionIdPath:
      name: redemption_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    StorageProfileId:
      name: id
      in: path
      required: true
      schema: { type: string }
    MemberPublicID:
      name: member_public_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareTokenID:
      name: token_id
      in: path
      required: true
      schema: { type: integer }
    BillingSKUPath:
      name: sku
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BillingSKUCode' }
    Page:
      name: page
      in: query
      schema: { type: integer }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer }

  schemas:
    ApiResponseBase:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer }
        msg: { type: string }
        message_safe: { type: boolean }

    InsufficientCreditsError:
      type: object
      required: [code, msg]
      properties:
        code:
          type: string
          enum: [insufficient_credits]
        msg:
          type: string

    PricingUnavailableError:
      type: object
      required: [code, msg]
      properties:
        code:
          type: string
          enum: [pricing_unavailable]
        msg:
          type: string

    CheckoutRequestRejectedError:
      type: object
      required: [code, msg, message_safe]
      properties:
        code:
          type: string
          enum: [checkout_request_rejected]
        msg:
          type: string
        message_safe:
          type: boolean
          enum: [true]

    CheckoutStateConflictError:
      type: object
      required: [code, msg, message_safe]
      properties:
        code:
          type: string
          enum: [checkout_session_expired, payment_already_completed]
        msg:
          type: string
        message_safe:
          type: boolean
          enum: [true]

    SubmissionFailedError:
      type: object
      required: [code, msg]
      properties:
        code:
          type: string
          enum: [submission_failed]
        msg:
          type: string

    WalletRestrictedError:
      type: object
      required: [code, msg]
      properties:
        code:
          type: string
          enum: [wallet_restricted]
        msg:
          type: string

    User:
      type: object
      required: [public_id, display_name, storage_namespace, avatar, role, status, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid, description: Canonical immutable public user identity. }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        storage_namespace: { type: string, description: Stable storage namespace; opaque to clients. }
        avatar: { type: string }
        role: { type: string }
        status: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    AdminUserListItem:
      type: object
      required: [public_id, email, display_name, role, status, created_at, updated_at, available_credits]
      properties:
        public_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string }
        role: { type: string }
        status: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
        available_credits:
          type: integer
          format: int64
          minimum: 0
          maximum: 9000000000000000

    OAuthProviderSettings:
      type: object
      additionalProperties: false
      required:
        - provider
        - enabled
        - configured
        - available
        - client_id
        - client_secret_configured
        - scopes
        - config_version
        - callback_url
        - updated_at
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
        enabled: { type: boolean }
        configured: { type: boolean }
        available: { type: boolean }
        client_id: { type: string }
        client_secret_configured: { type: boolean }
        scopes:
          type: array
          items: { type: string }
        config_version:
          type: integer
          minimum: 0
        callback_url:
          type: string
          format: uri
        updated_at:
          type: string
          format: date-time
          nullable: true

    OAuthProviderSettingsUpdate:
      type: object
      additionalProperties: false
      required: [enabled, client_id]
      properties:
        enabled: { type: boolean }
        client_id: { type: string }
        client_secret:
          type: string
          writeOnly: true

    OAuthCapabilities:
      type: object
      additionalProperties: false
      required: [social]
      properties:
        social:
          type: object
          additionalProperties:
            type: boolean
        providers:
          type: array
          items:
            $ref: '#/components/schemas/OAuthProviderCapability'

    OAuthProviderCapability:
      type: object
      additionalProperties: false
      required: [provider, label, available]
      properties:
        provider: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string }
        available: { type: boolean }

    AdminCreditGrantRequest:
      type: object
      additionalProperties: false
      required: [user_public_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_public_id: { type: string, format: uuid }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    AdminCreditDeductionRequest:
      type: object
      additionalProperties: false
      required: [user_public_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_public_id: { type: string, format: uuid }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    AdminCreditRefundRequest:
      type: object
      additionalProperties: false
      required: [user_public_id, charge_transaction_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_public_id: { type: string, format: uuid }
        charge_transaction_id: { type: string, minLength: 1, maxLength: 64 }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    AdminCreditCorrectionRequest:
      type: object
      additionalProperties: false
      required: [user_public_id, original_transaction_id, amount_credits, idempotency_key, reason, business_reference_id]
      properties:
        user_public_id: { type: string, format: uuid }
        original_transaction_id: { type: string, minLength: 1, maxLength: 64 }
        amount_credits: { type: integer, format: int64, minimum: 1, maximum: 9000000000000000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1 }
        business_reference_id: { type: string, minLength: 1, maxLength: 160 }

    BillingSKUCode:
      type: string
      minLength: 3
      maxLength: 128
      pattern: '^[a-z][a-z0-9-]{0,31}:[a-z][a-z0-9._-]{0,94}$'
      example: ideaboard:image.generate

    BillingQuoteRequest:
      type: object
      additionalProperties: false
      required: [sku, output_resolution, quantity]
      properties:
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        output_resolution: { type: string, enum: [default, 1k, 2k, 4k] }
        quantity: { type: integer, format: int64, minimum: 1 }

    BillingQuote:
      type: object
      required: [sku, output_resolution, display_name, price_version_id, price_version, unit_credits, quantity, total_credits, quoted_at]
      properties:
        sku: { $ref: '#/components/schemas/BillingSKUCode' }
        output_resolution: { type: string, enum: [default, 1k, 2k, 4k] }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        price_version_id: { type: integer, format: int64, minimum: 1 }
        price_version: { type: integer, format: int64, minimum: 1 }
        unit_credits: { type: integer, format: int64, minimum: 0, maximum: 9000000000000000 }
        quantity: { type: integer, format: int64, minimum: 1 }
        total_credits: { type: integer, format: int64, minimum: 0, maximum: 9000000000000000 }
        quoted_at: { type: string, format: date-time }

    TaskBillingReadiness:
      allOf:
        - $ref: '#/components/schemas/BillingQuote'
        - type: object
          required: [available_credits, reserved_credits, sufficient]
          properties:
            available_credits: { type: integer, format: int64, minimum: 0 }
            reserved_credits: { type: integer, format: int64, minimum: 0 }
            sufficient: { type: boolean }

    BillingPrice:
      type: object
      required: [output_resolution, price_version_id, version, unit_credits, created_at]
      properties:
