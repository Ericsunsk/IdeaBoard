        description: { type: string }
        builtin: { type: boolean }
        create_allowed: { type: boolean }
        supports_test: { type: boolean }
        supports_bucket_info: { type: boolean }
        fields:
          type: array
          items:
            $ref: '#/components/schemas/StorageProviderField'

    StorageProfile:
      type: object
      required: [id, name, provider, enabled, is_current, builtin, config]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        enabled: { type: boolean }
        is_current: { type: boolean }
        builtin: { type: boolean }
        secret_configured: { type: boolean }
        config:
          type: object
          additionalProperties: true

    StorageProfilePayload:
      type: object
      required: [name, provider, enabled, config]
      properties:
        name: { type: string }
        provider: { type: string }
        enabled: { type: boolean }
        config:
