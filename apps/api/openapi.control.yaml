openapi: 3.0.3
info:
  title: IdeaBoard Control API
  version: 0.1.0
  description: |
    Control Plane API at /api/control/v1,
    with its own OpenAPI contract, capability authorization, rate limits, and
    mandatory audit records, independent from the Public Data Plane. It must
    never be exposed as ordinary public resources such as /api/v1/platform/*.

    Auth: operator session cookie or X-Control-Key; authorization is
    capability-based (x-capability on every operation), never a role check.
    Public capabilities never imply control capabilities.

    Mutations: every POST/PUT/PATCH/DELETE requires a header-only
    Idempotency-Key, else 400. Every guarded call emits a Control
    AuditRecord (operator, target, capability, request_id, idempotency
    key, outcome, timestamp); audit records never enter the public
    event layer.

    Envelope: every route renders {data, meta?} success and
    {error: {code, message, request_id}} errors with a Request-Id response
    header. Platform configuration uses the same envelope; the binary
    brand-logo (image/svg+xml) and the SSE
    monitor stream stay raw protocol exceptions, never JSON envelopes.

    Capability list (frozen): control:users, control:workspaces,
    control:billing, control:credits, control:payments, control:platform,
    control:tasks, plus the control:* wildcard grant.
  x-rate-limit:
    window_seconds: 60
    max_requests: 120
    description: Control Plane limits are separate from Public limits, per operator.
  x-audit:
    required: true
    fields: [operator, target, capability, request_id, idempotency_key, outcome, occurred_at]
    description: Every guarded call records operator, target, capability and outcome.
  x-capabilities:
    - control:users
    - control:workspaces
    - control:billing
    - control:credits
    - control:payments
    - control:platform
    - control:tasks
    - control:*
servers:
  - url: /api/control/v1
security:
  - controlSession: []
  - controlOperatorKey: []
tags:
  - name: ControlUsers
    description: User administration, sessions and impersonation.
  - name: ControlWorkspaces
    description: Workspace administration and membership intervention.
  - name: ControlBilling
    description: Billing accounts, catalog and financial operations.
  - name: ControlCredits
    description: Credit grants, deductions, refunds, corrections and reads via credits.Commands.
  - name: ControlPayments
    description: Payment order reads, refunds and Stripe configuration.
  - name: ControlTasks
    description: Scoped task read/ops (get/list/cancel). No task creation path.
  - name: ControlPlatform
    description: Platform settings, provider config and monitor/statistics.
paths:
  /users:
    get:
      tags: [ControlUsers]
      operationId: listControlUsers
      summary: List users for platform administration
      x-capability: control:users
      x-audit:
        operator: true
        target: null
        outcome: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ControlKeyword'
        - $ref: '#/components/parameters/ControlRole'
        - $ref: '#/components/parameters/ControlStatus'
      responses:
        '200':
          description: Paginated control user list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedControlUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{user_id}:
    get:
      tags: [ControlUsers]
      operationId: getControlUser
      summary: Get one user for platform administration
      x-capability: control:users
      x-audit:
        operator: true
        target: user
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlUserId'
      responses:
        '200':
          description: Control user detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
    delete:
      tags: [ControlUsers]
      operationId: deleteControlUser
      summary: Delete a user (durable multi-phase deletion via identity seam)
      x-capability: control:users
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deletion accepted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /users/{user_id}/role:
    put:
      tags: [ControlUsers]
      operationId: updateControlUserRole
      summary: Change a user role
      x-capability: control:users
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlSetRoleRequest'
      responses:
        '200':
          description: Role updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /users/{user_id}/ban:
    post:
      tags: [ControlUsers]
      operationId: banControlUser
      summary: Ban a user
      x-capability: control:users
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlBanRequest'
      responses:
        '200':
          description: User banned.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /users/{user_id}/unban:
    post:
      tags: [ControlUsers]
      operationId: unbanControlUser
      summary: Unban a user
      x-capability: control:users
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: User unbanned.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /users/{user_id}/sessions:
    delete:
      tags: [ControlUsers]
      operationId: revokeControlUserSessions
      summary: Revoke all sessions of a user
      x-capability: control:users
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sessions revoked.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /users/{user_id}/impersonation:
    post:
      tags: [ControlUsers]
      operationId: impersonateControlUser
      summary: Impersonate a user for support (never self or admins)
      x-capability: control:users
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Impersonation session cookies set.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /users/oauth/{provider}:
    get:
      tags: [ControlUsers]
      operationId: getControlOAuthProvider
      summary: Read one social OAuth provider channel
      description: >-
        Reads the social login channel behind control:users through the
        Auth-owned social-provider seam. Client secrets never cross this
        boundary (only client_secret_configured). Unknown or malformed
        slugs fail closed with 404 (invisible, never 403).
      x-capability: control:users
      x-audit:
        operator: true
        target: oauth_provider
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlProviderSlug'
      responses:
        '200':
          description: OAuth provider channel summary.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlOAuthProviderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
    put:
      tags: [ControlUsers]
      operationId: updateControlOAuthProvider
      summary: Update one social OAuth provider channel
      description: >-
        Updates the social login channel (enabled, client_id,
        client_secret) through the Auth-owned social-provider seam.
      x-capability: control:users
      x-audit:
        operator: true
        target: oauth_provider
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlProviderSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlOAuthProviderUpdateRequest'
      responses:
        '200':
          description: OAuth provider channel updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlOAuthProviderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}:
    get:
      tags: [ControlWorkspaces]
      operationId: getControlWorkspace
      summary: Get one workspace for platform administration
      x-capability: control:workspaces
      x-audit:
        operator: true
        target: workspace
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlWorkspaceId'
      responses:
        '200':
          description: Control workspace detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlWorkspaceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
  /workspaces/{workspace_id}/members:
    get:
      tags: [ControlWorkspaces]
      operationId: listControlWorkspaceMembers
      summary: List workspace members for platform administration
      x-capability: control:workspaces
      x-audit:
        operator: true
        target: workspace
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlWorkspaceId'
      responses:
        '200':
          description: Workspace member list.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedControlWorkspaceMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
    post:
      tags: [ControlWorkspaces]
      operationId: addControlWorkspaceMember
      summary: Override workspace membership
      x-capability: control:workspaces
      x-audit:
        operator: true
        target: workspace
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlWorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlWorkspaceMemberRequest'
      responses:
        '201':
          description: Member added.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlWorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /workspaces/{workspace_id}/members/{member_id}:
    patch:
      tags: [ControlWorkspaces]
      operationId: updateControlWorkspaceMember
      summary: Override a workspace member role
      x-capability: control:workspaces
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlWorkspaceId'
        - $ref: '#/components/parameters/ControlMemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlWorkspaceMemberRoleRequest'
      responses:
        '200':
          description: Member role updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlWorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
    delete:
      tags: [ControlWorkspaces]
      operationId: removeControlWorkspaceMember
      summary: Remove a workspace member
      x-capability: control:workspaces
      x-audit:
        operator: true
        target: user
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlWorkspaceId'
        - $ref: '#/components/parameters/ControlMemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Member removed.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /billing/accounts:
    get:
      tags: [ControlBilling]
      operationId: listControlBillingAccounts
      summary: Locate billing accounts for platform administration
      description: >-
        With workspace_id, resolves the implicit billing account for that
        workspace (single-item page). Without it, pages all stable Billing
        Accounts newest-first (Admin locate/audit for personal, shared and
        organization accounts) with the opaque cursor/page_size dialect and
        an optional owner_scope filter. Requires Idempotency-Key: no (read).
      x-capability: control:billing
      x-audit:
        operator: true
        target: null
        outcome: read
      parameters:
        - name: workspace_id
          in: query
          required: false
          description: Workspace public id (ws_...) owning the account. Omit to list all accounts.
          schema:
            type: string
            pattern: '^ws_[A-Za-z0-9_-]+$'
        - $ref: '#/components/parameters/ControlBillingOwnerScope'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Billing account page (single resolve or Admin list).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedControlBillingAccounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /billing/accounts/{billing_account_id}:
    get:
      tags: [ControlBilling]
      operationId: getControlBillingAccount
      summary: Read one billing account for platform administration
      description: >-
        Reads one stable Billing Account by its ba_ id with ownership
        linkage, explicitly linked workspaces, financial managers (usr_
        identities) and the wallet summary. Customer-side Billing
        Owner/Admin standing never implies this platform-Admin read.
        Requires Idempotency-Key: no (read).
      x-capability: control:billing
      x-audit:
        operator: true
        target: billing_account
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlBillingAccountId'
      responses:
        '200':
          description: Billing account detail.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlBillingAccountDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
  /billing/catalog:
    get:
      tags: [ControlBilling]
      operationId: listControlBillingCatalog
      summary: List the billable pricing catalog
      x-capability: control:billing
      x-audit:
        operator: true
        target: null
        outcome: read
      responses:
        '200':
          description: Catalog items.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCatalogEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /billing/catalog/{sku}/prices:
    post:
      tags: [ControlBilling]
      operationId: publishControlCatalogPrices
      summary: Publish SKU prices
      x-capability: control:billing
      x-audit:
        operator: true
        target: billing_sku
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlSku'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlPublishPricesRequest'
      responses:
        '200':
          description: Prices published.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /billing/catalog/{sku}/availability:
    put:
      tags: [ControlBilling]
      operationId: setControlCatalogAvailability
      summary: Set SKU availability
      x-capability: control:billing
      x-audit:
        operator: true
        target: billing_sku
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlSku'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlSetAvailabilityRequest'
      responses:
        '200':
          description: Availability updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /billing/catalog/{sku}:
    delete:
      tags: [ControlBilling]
      operationId: deleteControlCatalogItem
      summary: Delete an archived catalog item
      x-capability: control:billing
      x-audit:
        operator: true
        target: billing_sku
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlSku'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Catalog item deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAckEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /billing/catalog/{sku}/pool:
    get:
      tags: [ControlBilling]
      operationId: getControlCatalogModelPool
      summary: Get the Service Model Pool for a billing SKU
      x-capability: control:billing
      x-audit:
        operator: true
        target: billing_sku
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlSku'
      responses:
        '200':
          description: Complete pool with its current version (0 with empty entries when never written).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlModelPoolEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [ControlBilling]
