  /platform/settings/branding/logo:
    post:
      tags: [ControlPlatform]
      operationId: uploadControlBrandingLogo
      summary: Upload a branding logo file (multipart)
      description: >-
        Multipart logo upload behind control:platform. The file rides the
        Storage service into the canonical content-hashed key
        uploads/site/assets/logo_{hash}.ext through the active storage profile.
        The returned logo_url and branding settings carry that canonical key.
        Preview uses GET /api/v1/public/branding/logo?key={key}, which returns
        rendered image bytes. Validation applies a 50MB image
        cap and detected-format allowlist, without trusting the filename.
        Unknown image formats render 415 media_unsupported_type.
        The control guard cannot buffer multipart bodies, so this route
        registers as a POST read-guard and enforces the mutation
        guarantees in-handler: a header-only Idempotency-Key is
        required (400 otherwise); the key replays the first stored
        response on content-identical reuse and conflicts (409) on
        divergent reuse; every call is audited.
      x-capability: control:platform
      x-audit:
        operator: true
        target: null
        outcome: success
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: Logo image bytes (50MB cap, detected-format allowlist).
      responses:
        '200':
          description: Logo stored; logo_url feeds the branding setting update.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlBrandingLogoUploadEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '415':
          description: Unknown image format (media_unsupported_type).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
