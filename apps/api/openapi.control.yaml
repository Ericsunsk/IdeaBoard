components:
  securitySchemes:
    controlSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Operator session. Same transport cookie as Public, but authorized
        through separate Control capability checks and Control rate limits.
    controlOperatorKey:
      type: apiKey
      in: header
      name: X-Control-Key
      description: Operator service key for automation; never valid on Public routes.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token bound to operator, filters and sort order.
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every high-risk Control mutation; recorded in the audit record.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OperatorReason:
      name: X-Operator-Reason
      in: header
      required: false
      description: Operator note justifying the high-risk mutation. Required on every mutation via header or reason/operator_note body field.
      schema:
        type: string
        minLength: 1
        maxLength: 1000
    ControlUserId:
      name: user_id
      in: path
      required: true
      description: User public id (usr_...).
      schema:
        type: string
        pattern: '^usr_[A-Za-z0-9]+$'
    ControlWorkspaceId:
      name: workspace_id
      in: path
      required: true
      description: Workspace public id (ws_...).
      schema:
        type: string
        pattern: '^ws_[A-Za-z0-9_-]+$'
    ControlMemberId:
      name: member_id
      in: path
      required: true
      description: Member user public id (usr_...).
      schema:
        type: string
        pattern: '^usr_[A-Za-z0-9]+$'
    ControlTaskId:
      name: task_id
      in: path
      required: true
      description: Task public id (task_...).
      schema:
        type: string
        pattern: '^task_[A-Za-z0-9_-]+$'
    ControlSku:
      name: sku
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ControlOrderNumber:
      name: order_number
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ControlStorageProfileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ControlSearchProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ControlPromptSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ControlKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    ControlRole:
      name: role
      in: query
      required: false
      schema:
        type: string
        enum: [admin, user]
    ControlStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
    ControlTaskStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
    ControlTaskUser:
      name: user_id
      in: query
      required: false
      description: Filter by user public id (usr_...).
      schema:
        type: string
    ControlLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    ControlBeforeId:
      name: before_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ControlPaymentOrderFilters:
      name: order_number
      in: query
      required: false
      description: Filter by order number. Also accepts user, status, anomaly_only, cursor, limit.
      schema:
        type: string
  headers:
    RequestId:
      description: Server-assigned request correlation ID, present on every response.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying (429 and 503 with known window).
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request, missing operator reason, or missing Idempotency-Key.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    Unauthorized:
      description: Missing operator authentication.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    Forbidden:
      description: Authenticated operator lacks the Control capability for this family.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    ControlNotFound:
      description: Control resource not found (hidden resources converge here).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    IdempotencyConflict:
      description: Idempotency-Key reused with a different request.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    UnprocessableEntity:
      description: Semantically invalid control operation.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    RateLimited:
      description: Control rate-limit budget exhausted for this operator.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
  schemas:
    ControlErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code.
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
    ControlPaginationMeta:
      type: object
      required: [next_cursor, has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    AuditRecord:
      type: object
      required: [operator, capability, request_id, outcome, occurred_at]
      additionalProperties: false
      properties:
        operator:
          type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [human_session, internal_worker, service_account, api_key, oauth_app]
            id:
              type: string
        target:
          type: object
          nullable: true
          required: [type, id]
          additionalProperties: false
          properties:
            type:
              type: string
            id:
              type: string
        capability:
          type: string
          description: Control capability used, e.g. control:users.
        request_id:
          type: string
        idempotency_key:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
          description: Operator note justifying the high-risk mutation.
        outcome:
          type: string
          enum: [read, success, denied, failed]
        occurred_at:
          type: string
          format: date-time
    ControlUser:
      type: object
      required: [id, display_name, role, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^usr_[A-Za-z0-9]+$'
        display_name:
          type: string
        email:
          type: string
        providers:
          type: array
          items:
            type: string
        avatar:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: integer
        available_credits:
          type: integer
        last_login_ip:
          type: string
        last_login_country:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ControlWorkspace:
      type: object
      required: [id, name, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^ws_[A-Za-z0-9_-]+$'
        name:
          type: string
        organization_id:
          type: string
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ControlWorkspaceMember:
      type: object
      required: [user_id, role, created_at]
      additionalProperties: false
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9]+$'
        role:
          type: string
          enum: [owner, admin, member]
        created_at:
          type: string
          format: date-time
    ControlBillingAccount:
      type: object
      required: [workspace_id, created_at, updated_at]
      additionalProperties: false
      properties:
        workspace_id:
          type: string
          description: Workspace public id owning the implicit billing account.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ControlCreditWallet:
      type: object
      required: [user_id, display_name, available_credits, reserved_credits, status, active_restrictions]
      additionalProperties: false
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9]+$'
        display_name:
          type: string
        available_credits:
          type: integer
        reserved_credits:
          type: integer
        status:
          type: string
          enum: [active, frozen]
        active_restrictions:
          type: array
          items:
            $ref: '#/components/schemas/ControlWalletRestriction'
    ControlWalletRestriction:
      type: object
      required: [restriction_id, user_id, type, source, created_at]
      additionalProperties: false
      properties:
        restriction_id:
          type: string
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9]+$'
        display_name:
          type: string
        type:
          type: string
        source:
          type: string
        related_object:
          type: object
        reason:
          type: string
        created_by:
          type: object
        created_at:
          type: string
          format: date-time
    ControlCreditResult:
      type: object
      required: [transaction_id, command_type, amount_credits, replayed, created_at, wallet]
      additionalProperties: false
      properties:
        transaction_id:
          type: string
        command_type:
          type: string
        amount_credits:
          type: integer
        replayed:
          type: boolean
        created_at:
          type: string
          format: date-time
        wallet:
          $ref: '#/components/schemas/ControlCreditWallet'
    ControlLedgerTransaction:
      type: object
      required: [sequence_id, transaction_id, command_type, amount_credits, created_at]
      additionalProperties: false
      properties:
        sequence_id:
          type: integer
        transaction_id:
          type: string
        command_type:
          type: string
        amount_credits:
          type: integer
        available_credits_after:
          type: integer
        reserved_credits_after:
          type: integer
        related_transaction_id:
          type: string
        actor:
          type: object
        source:
          type: string
        reason:
          type: string
        business_reference:
          type: object
        charge:
          type: object
          required: [amount_credits, refunded_credits, remaining_refundable_credits]
          properties:
            amount_credits:
              type: integer
            refunded_credits:
              type: integer
            remaining_refundable_credits:
              type: integer
        created_at:
          type: string
          format: date-time
    ControlTask:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id:
          type: string
          pattern: '^task_[A-Za-z0-9_-]+$'
        status:
          type: string
        feature:
          type: string
    ControlSetRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [admin, user]
        reason:
          type: string
          description: Operator note (or X-Operator-Reason header).
    ControlBanRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        operator_note:
          type: string
        expires_in_days:
          type: integer
          minimum: 0
    ControlReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        operator_note:
          type: string
    ControlWorkspaceMemberRequest:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9]+$'
        role:
          type: string
          enum: [owner, admin, member]
        reason:
          type: string
    ControlWorkspaceMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [owner, admin, member]
        reason:
          type: string
    ControlPublishPricesRequest:
      type: object
      required: [prices]
      additionalProperties: false
      properties:
        prices:
          type: object
          additionalProperties:
            type: integer
        reason:
          type: string
    ControlSetAvailabilityRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        reason:
          type: string
    ControlCreditCommandRequest:
      type: object
      required: [user_id, amount_credits, business_reference_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9]+$'
        amount_credits:
          type: integer
          minimum: 1
        business_reference_id:
          type: string
        reason:
          type: string
        operator_note:
          type: string
    ControlCreditRefundRequest:
      allOf:
        - $ref: '#/components/schemas/ControlCreditCommandRequest'
        - type: object
          required: [charge_transaction_id]
          properties:
            charge_transaction_id:
              type: string
    ControlCreditCorrectionRequest:
      allOf:
        - $ref: '#/components/schemas/ControlCreditCommandRequest'
        - type: object
          required: [original_transaction_id]
          properties:
            original_transaction_id:
              type: string
    ControlPaymentRefundRequest:
      type: object
      required: [idea_quantity]
      additionalProperties: false
      properties:
        idea_quantity:
          type: integer
          minimum: 1
        reason:
          type: string
        operator_note:
          type: string
    ControlStripeConfigRequest:
      type: object
      required: [purchases_enabled]
      additionalProperties: false
      properties:
        api_key:
          type: string
        payment_method_configuration_id:
          type: string
        product_tax_code:
          type: string
        purchases_enabled:
          type: boolean
        reason:
          type: string
    ControlOutboundPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        allow_hosts:
          type: array
          items:
            type: string
        reason:
          type: string
    PaginatedControlUsers:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ControlUser'
        meta:
          $ref: '#/components/schemas/ControlPaginationMeta'
    PaginatedControlWorkspaces:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ControlWorkspace'
        meta:
          $ref: '#/components/schemas/ControlPaginationMeta'
    PaginatedControlWorkspaceMembers:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ControlWorkspaceMember'
        meta:
          $ref: '#/components/schemas/ControlPaginationMeta'
    PaginatedControlBillingAccounts:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ControlBillingAccount'
        meta:
          $ref: '#/components/schemas/ControlPaginationMeta'
    PaginatedControlLedger:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ControlLedgerTransaction'
        meta:
          $ref: '#/components/schemas/ControlPaginationMeta'
    PaginatedControlTasks:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ControlTask'
        meta:
          $ref: '#/components/schemas/ControlPaginationMeta'
    ControlUserEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ControlUser'
    ControlWorkspaceEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ControlWorkspace'
    ControlWorkspaceMemberEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ControlWorkspaceMember'
    ControlTaskEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [task]
          properties:
            task:
              $ref: '#/components/schemas/ControlTask'
    ControlCreditResultEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ControlCreditResult'
    ControlCreditWalletEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ControlCreditWallet'
    ControlCatalogEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
    ControlAckEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          description: Mutation acknowledgement flags (updated, banned, revoked, ...).
    ControlObjectEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          description: Opaque control payload (reconciliation, payments, monitor shapes).
