      summary: Resolve the implicit billing account for a workspace
      x-capability: control:billing
      x-audit:
        operator: true
        target: null
        reason: false
        outcome: read
      parameters:
        - name: workspace_id
          in: query
          required: true
          description: Workspace public id (ws_...) owning the account.
          schema:
            type: string
            pattern: '^ws_[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Billing account for the workspace.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
