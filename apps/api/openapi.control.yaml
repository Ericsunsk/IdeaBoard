    ControlSetAvailabilityRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    ControlModelPoolEntry:
      type: object
      required: [provider, model_id, enabled, resolutions]
      additionalProperties: false
      description: >-
        One Service Model Pool row. provider is the required registry slug
        (lowercased at the write boundary); unknown slugs are accepted and
        synthesize the default custom-<slug> gateway namespace at execution,
        never vanish. model_id is the required bare model name (no provider
        prefix, no @path, no whitespace; nested slashes inside the bare name
        are preserved). The provider/model display form is derived only for
        selection, snapshots, and Admin display.
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
          description: Registry provider slug; unknown slugs synthesize custom-<slug> at execution.
        model_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Bare model name without provider prefix or @path.
        enabled:
          type: boolean
        resolutions:
          type: array
          items:
            type: string
            enum: [1k, 2k, 4k]
    ControlModelPoolEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [service, sku, version, entries]
          additionalProperties: false
          properties:
            service:
              type: string
            sku:
              type: string
            version:
              type: integer
              minimum: 0
            entries:
              type: array
              items:
                $ref: '#/components/schemas/ControlModelPoolEntry'
    ControlReplaceModelPoolRequest:
      type: object
