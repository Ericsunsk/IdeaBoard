      x-audit:
        operator: true
        target: reward_code
        outcome: success
      parameters:
        - $ref: '#/components/parameters/ControlRewardCodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlRewardCodeEnabledRequest'
      responses:
        '200':
          description: Reward code flag updated.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlObjectEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /rewards/codes/{id}/redemptions:
    get:
      tags: [ControlCredits]
      operationId: listControlRewardRedemptions
      summary: List admin redemption reads for one reward code
      description: >-
        Data shape is ControlAdminRedemptionPage (identity-enriched
        redemption summaries) inside the contract envelope.
      x-capability: control:credits
      x-audit:
        operator: true
        target: reward_code
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlRewardCodeId'
        - $ref: '#/components/parameters/ControlBeforeId'
        - $ref: '#/components/parameters/ControlLimit'
      responses:
        '200':
          description: Admin redemption page (contract envelope).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlObjectEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
  /rewards/codes/{id}/redemptions/{redemption_id}:
    get:
      tags: [ControlCredits]
      operationId: getControlRewardRedemption
      summary: Read one admin redemption for one reward code
      description: >-
        Data shape is ControlAdminRedemptionDetail (identity-enriched)
        inside the contract envelope.
      x-capability: control:credits
      x-audit:
        operator: true
        target: reward_redemption
        outcome: read
      parameters:
        - $ref: '#/components/parameters/ControlRewardCodeId'
        - $ref: '#/components/parameters/ControlRedemptionId'
      responses:
        '200':
          description: Admin redemption detail (contract envelope).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlObjectEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControlNotFound'
components:
  securitySchemes:
    controlSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Operator session. Same transport cookie as Public, but authorized
        through separate Control capability checks and Control rate limits.
    controlOperatorKey:
      type: apiKey
      in: header
      name: X-Control-Key
      description: Operator service key for automation; never valid on Public routes.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token bound to operator, filters and sort order.
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every Control mutation; recorded in the audit record.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ControlUserId:
      name: user_id
      in: path
      required: true
      description: User public id (usr_...).
      schema:
        type: string
        pattern: '^usr_[A-Za-z0-9_-]+$'
    ControlWorkspaceId:
      name: workspace_id
      in: path
      required: true
      description: Workspace public id (ws_...).
      schema:
        type: string
        pattern: '^ws_[A-Za-z0-9_-]+$'
    ControlMemberId:
      name: member_id
      in: path
      required: true
      description: Member user public id (usr_...).
      schema:
        type: string
        pattern: '^usr_[A-Za-z0-9_-]+$'
    ControlBillingAccountId:
      name: billing_account_id
      in: path
      required: true
      description: Stable Billing Account public id (ba_...), the funds identity holding the unified balance.
      schema:
        type: string
        pattern: '^ba_[A-Za-z0-9_-]+$'
    ControlRestrictionId:
      name: restriction_id
      in: path
      required: true
      description: Wallet restriction id (UUID).
      schema:
        type: string
        format: uuid
    ControlBillingOwnerScope:
      name: owner_scope
      in: query
      required: false
      description: Filter the Admin account list by ownership (all, organization, workspace). Default all.
      schema:
        type: string
        enum: [all, organization, workspace]
        default: all
    ControlTaskId:
      name: task_id
      in: path
      required: true
      description: Task public id (task_...).
      schema:
        type: string
        pattern: '^task_[A-Za-z0-9_-]+$'
    ControlSku:
      name: sku
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ControlOrderNumber:
      name: order_number
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ControlStorageProfileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ControlSearchProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ControlPromptSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ControlProviderSlug:
      name: provider
      in: path
      required: true
      description: Provider slug (lowercase allowlist; unknown slugs fail closed with 404).
      schema:
        type: string
        pattern: '^[a-z0-9_-]{1,64}$'
    ControlBrandLogoScope:
      name: scope
      in: path
      required: true
      description: Brand logo override scope (provider-endpoint, storage-profile, search-provider, oauth-provider).
      schema:
        type: string
        enum: [provider-endpoint, storage-profile, search-provider, oauth-provider]
    ControlBrandLogoTargetKey:
      name: target_key
      in: path
      required: true
      description: Brand logo override target key.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    ControlRewardCodeId:
      name: id
      in: path
      required: true
      description: Reward code integer id (malformed shapes render 400 reward_code_id_invalid).
      schema:
        type: integer
        minimum: 1
    ControlRedemptionId:
      name: redemption_id
      in: path
      required: true
      description: Reward redemption integer id (malformed shapes render 400 reward_redemption_id_invalid).
      schema:
        type: integer
        minimum: 1
    ControlKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    ControlRole:
      name: role
      in: query
      required: false
      schema:
        type: string
        enum: [admin, user]
    ControlStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
    ControlTaskStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
    ControlTaskUser:
      name: user_id
      in: query
      required: false
      description: Filter by user public id (usr_...).
      schema:
        type: string
    ControlLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    ControlBeforeId:
      name: before_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ControlPaymentOrderFilters:
      name: order_number
      in: query
      required: false
      description: Filter by order number. Also accepts user, status, anomaly_only, cursor, limit.
      schema:
        type: string
  headers:
    RequestId:
      description: Server-assigned request correlation ID, present on every response.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying (429 and 503 with known window).
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request or missing Idempotency-Key.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    Unauthorized:
      description: Missing operator authentication.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    Forbidden:
      description: Authenticated operator lacks the Control capability for this family.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    ControlNotFound:
      description: Control resource not found (hidden resources converge here).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    Conflict:
      description: State conflict (conflict), or Idempotency-Key reused with a different request (idempotency_conflict).
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    IdempotencyConflict:
      description: Idempotency-Key reused with a different request.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    UnprocessableEntity:
      description: Semantically invalid control operation.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
    RateLimited:
      description: Control rate-limit budget exhausted for this operator.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlErrorEnvelope'
  schemas:
    SupportChannel:
      type: object
      required: [id, name, kind, url, enabled, sort_order]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum: [discord, telegram, whatsapp, line, wechat, custom]
        url:
          type: string
          format: uri
          maxLength: 2048
        enabled:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
    SupportChannelsSetting:
      type: object
      required: [channels]
      additionalProperties: false
      properties:
        channels:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SupportChannel'
    SupportChannelsSettingEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/SupportChannelsSetting'
    ControlErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code.
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
    ControlPaginationMeta:
      type: object
      required: [next_cursor, has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    AuditRecord:
      type: object
      required: [operator, capability, request_id, outcome, occurred_at]
      additionalProperties: false
      properties:
        operator:
          type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [human_session, internal_worker, service_account, api_key, oauth_app]
            id:
              type: string
        target:
          type: object
          nullable: true
          required: [type, id]
          additionalProperties: false
          properties:
            type:
              type: string
            id:
              type: string
        capability:
          type: string
          description: Control capability used, e.g. control:users.
        request_id:
          type: string
        idempotency_key:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [read, success, denied, failure]
        occurred_at:
          type: string
          format: date-time
    ControlUser:
      type: object
      required: [id, display_name, role, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^usr_[A-Za-z0-9_-]+$'
        display_name:
          type: string
        email:
          type: string
        providers:
          type: array
          items:
            type: string
        avatar:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: integer
        available_credits:
          type: integer
        last_login_ip:
          type: string
        last_login_country:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ControlWorkspace:
      type: object
      required: [id, name, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^ws_[A-Za-z0-9_-]+$'
        name:
          type: string
        organization_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ControlWorkspaceMember:
      type: object
      required: [user_id, role, created_at]
      additionalProperties: false
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9_-]+$'
        role:
          type: string
          enum: [owner, admin, member]
        created_at:
          type: string
          format: date-time
    ControlBillingAccount:
      type: object
      required: [billing_account_id, owner_type, created_at, updated_at]
      additionalProperties: false
      properties:
        billing_account_id:
          type: string
          pattern: '^ba_[A-Za-z0-9_-]+$'
          description: Stable funds identity holding the unified balance.
        owner_type:
          type: string
          enum: [workspace, organization]
          description: workspace covers per-workspace and studio-shared links; organization is the shared org pool.
        workspace_id:
          type: string
          description: Resolving or owning Workspace public id, when the account is workspace-scoped.
        organization_id:
          type: string
          description: Owning Organization public id, when the account is the shared org pool.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ControlBillingAccountMember:
      type: object
      required: [user_id, display_name, role]
      additionalProperties: false
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9_-]+$'
        display_name:
          type: string
        role:
          type: string
          enum: [owner, admin]
    ControlLinkedWorkspace:
      type: object
      required: [workspace_id, name]
      additionalProperties: false
      properties:
        workspace_id:
          type: string
          pattern: '^ws_[A-Za-z0-9_-]+$'
        name:
          type: string
    ControlBillingAccountWalletSummary:
      type: object
      required: [available_credits, reserved_credits, status]
      additionalProperties: false
      properties:
        available_credits:
          type: integer
        reserved_credits:
          type: integer
        status:
          type: string
          enum: [active, frozen]
    ControlBillingAccountDetail:
      type: object
      required: [billing_account_id, owner_type, linked_workspaces, members, created_at, updated_at]
      additionalProperties: false
      properties:
        billing_account_id:
          type: string
          pattern: '^ba_[A-Za-z0-9_-]+$'
        owner_type:
          type: string
          enum: [workspace, organization]
        workspace_id:
          type: string
          description: Owning Workspace public id, when the account is workspace-scoped.
        organization_id:
          type: string
          description: Owning Organization public id, when the account is the shared org pool.
        linked_workspaces:
          type: array
          items:
            $ref: '#/components/schemas/ControlLinkedWorkspace'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ControlBillingAccountMember'
        wallet:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ControlBillingAccountWalletSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ControlBillingAccountDetailEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ControlBillingAccountDetail'
    ControlRestrictWalletRequest:
      type: object
      required: [billing_account_id, type, source, related_object_type, related_object_id]
      additionalProperties: false
      properties:
        billing_account_id:
          type: string
          pattern: '^ba_[A-Za-z0-9_-]+$'
        type:
          type: string
        source:
          type: string
        related_object_type:
          type: string
        related_object_id:
          type: string
        reason:
          type: string
    ControlReleaseWalletRestrictionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    ControlWalletRestrictionResult:
      type: object
      required: [restriction_id, replayed]
      additionalProperties: false
      properties:
        restriction_id:
          type: string
        replayed:
          type: boolean
        billing_account_id:
          type: string
          pattern: '^ba_[A-Za-z0-9_-]+$'
    ControlWalletRestrictionResultEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ControlWalletRestrictionResult'
    ControlCreditWallet:
      type: object
      required: [available_credits, reserved_credits, status, active_restrictions]
      additionalProperties: false
      properties:
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9_-]+$'
          description: Present only on user-addressed reads; account-addressed reads carry no single-user linkage.
        display_name:
          type: string
          description: Present only on user-addressed reads.
        billing_account_id:
          type: string
          pattern: '^ba_[A-Za-z0-9_-]+$'
          description: Stable funds identity holding the balance (#916). The wallet belongs to this Billing Account; user_id names the requested target only.
        owner_type:
          type: string
          enum: [workspace, organization]
          description: Ownership of the addressed Billing Account.
        available_credits:
          type: integer
        reserved_credits:
          type: integer
        status:
          type: string
          enum: [active, frozen]
        active_restrictions:
          type: array
          items:
            $ref: '#/components/schemas/ControlWalletRestriction'
    ControlWalletRestriction:
      type: object
      required: [restriction_id, type, source, created_at]
      additionalProperties: false
      properties:
        restriction_id:
          type: string
        user_id:
          type: string
          pattern: '^usr_[A-Za-z0-9_-]+$'
          description: Present only on user-addressed reads.
        display_name:
          type: string
          description: Present only on user-addressed reads.
        billing_account_id:
          type: string
          pattern: '^ba_[A-Za-z0-9_-]+$'
          description: The restricted Billing Account.
        type:
          type: string
        source:
          type: string
        related_object:
          type: object
        reason:
          type: string
        created_by:
          type: object
        created_at:
          type: string
          format: date-time
    ControlCreditResult:
      type: object
      required: [transaction_id, command_type, amount_credits, replayed, created_at, wallet]
      additionalProperties: false
      properties:
        transaction_id:
          type: string
        command_type:
          type: string
        amount_credits:
          type: integer
        replayed:
          type: boolean
        created_at:
          type: string
          format: date-time
        wallet:
          $ref: '#/components/schemas/ControlCreditWallet'
    ControlLedgerTransaction:
      type: object
      required: [sequence_id, transaction_id, command_type, amount_credits, created_at]
      additionalProperties: false
      properties:
        sequence_id:
          type: integer
        transaction_id:
          type: string
        command_type:
          type: string
        amount_credits:
          type: integer
        available_credits_after:
          type: integer
        reserved_credits_after:
          type: integer
        related_transaction_id:
          type: string
        actor:
          type: object
        source:
          type: string
        reason:
          type: string
        business_reference:
          type: object
        charge:
          type: object
          required: [amount_credits, refunded_credits, remaining_refundable_credits]
          properties:
            amount_credits:
              type: integer
            refunded_credits:
              type: integer
            remaining_refundable_credits:
              type: integer
        created_at:
          type: string
          format: date-time
    ControlTask:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id:
          type: string
          pattern: '^task_[A-Za-z0-9_-]+$'
        status:
          type: string
        service:
          type: string
          description: Registered AI image service slug (#847 rename).
        requested_resolution:
          type: string
          description: >-
            Submit-time snapshot requested resolution (#852). Empty when the
            task never pinned a routing snapshot (pre-pool row).
        pool_version:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Per-service pool version pinned by the submit-time routing
            snapshot (ADR-0012 rule 9). Zero means never pinned.
        selected_model:
          type: string
          description: >-
            Snapshot deterministic selection: the first send's model, not
            necessarily the final one (#852).
        final_resolved_model:
          type: string
          description: >-
            Execution attributed to the resolved (final) model derived
            from attempt facts (#852). Empty when attempts carry no model
            data.
        user_public_id:
          type: string
        user_display_name:
          type: string
        prompt:
          type: string
        user_prompt:
          type: string
        params:
          type: string
        correlation_id:
          type: string
        priority:
          type: integer
        retry_count:
          type: integer
        credits:
          type: integer
          format: int64
        error_msg:
          type: string
        cancel_reason:
          type: string
        result:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        latest_execution:
          $ref: '#/components/schemas/ControlTaskExecutionSnapshot'
        routing:
          $ref: '#/components/schemas/ControlTaskRoutingSnapshot'
        execution_attempts:
          type: array
          items:
            $ref: '#/components/schemas/ControlTaskAttempt'
        billing:
          type: object
          description: >-
            Immutable task billing snapshot projection (SKU, price
            version, quantity, settlement state). Shape owned by the
            tasking read model.
        outputs:
          type: array
          items:
            type: object
          description: Task output refs (asset/remote contracts).
        execution_metrics:
          type: object
          description: >-
            Task execution metrics row (stages, bottleneck source,
            failure stage/category, latencies).
    ControlTaskExecutionSnapshot:
      type: object
      additionalProperties: false
      properties:
        resolved_model:
          type: string
        provider:
          type: string
        gateway_step:
          type: string
    ControlTaskRoutingSnapshot:
      type: object
      required: [service, requested_resolution, eligible_models, selected_model, pool_version]
      additionalProperties: false
      description: >-
        Read-only projection over the immutable submit-time routing
        snapshot pinned on the task row (#852, ADR-0012 rule 9).
      properties:
        service:
          type: string
        requested_resolution:
          type: string
        eligible_models:
          type: array
          items:
            type: string
        selected_model:
          type: string
        retry_candidate:
          type: string
        pool_version:
          type: integer
          format: int64
          minimum: 0
    ControlTaskAttempt:
      type: object
      required: [attempt_no, status]
      additionalProperties: false
      description: >-
        Per-send execution attempt fact (#852, ADR-0012 rule 7).
        retry_layer is exactly gateway, model_fallback, or river_task;
        gateway_retry_count records same-model gateway-internal retries.
      properties:
        attempt_no:
          type: integer
        status:
          type: string
        stage:
          type: string
        failure_category:
          type: string
        service:
          type: string
        requested_model:
          type: string
        resolved_model:
          type: string
        provider:
          type: string
        gateway_step:
          type: string
        retry_layer:
          type: string
          enum: ['', gateway, model_fallback, river_task]
        gateway_retry_count:
          type: integer
          minimum: 0
        error_msg:
          type: string
        provider_started_at:
          type: string
          format: date-time
          nullable: true
        provider_finished_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        provider_latency_ms:
          type: integer
          format: int64
        total_latency_ms:
          type: integer
          format: int64
