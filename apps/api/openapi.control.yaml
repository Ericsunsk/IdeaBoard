          additionalProperties: false
          properties:
            service:
              type: string
            sku:
              type: string
            version:
              type: integer
              minimum: 0
            changed:
              type: boolean
            entries:
              type: array
              items:
                $ref: '#/components/schemas/ControlModelPoolEntry'
    ControlCreditCommandRequest:
