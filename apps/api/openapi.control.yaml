  /platform/monitor/stream:
    get:
      tags: [ControlPlatform]
      operationId: streamControlMonitor
      summary: Stream the runtime monitor snapshot (SSE)
      description: >-
        Global monitor snapshot stream (snapshot every 10s, closes after
        the max connection period with a close event). Read-guard so the
        long-lived stream is never body-buffered; the audit record emits
        on disconnect with the terminal status. Setup failures render
        the contract error envelope; the stream itself is text/event-stream,
        never a JSON envelope.
      x-capability: control:platform
      x-audit:
        operator: true
        target: null
        outcome: read
      responses:
        '200':
          description: Monitor snapshot event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Monitor stream concurrency limited (task_monitor_concurrency_limited).
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlErrorEnvelope'
